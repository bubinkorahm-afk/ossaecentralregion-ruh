BOOK1.push({
 id:`u3`, title:[`Orthodox Worship`,`ഓർത്തഡോക്സ് ആരാധന`],
 chapters:[
 {
  id:`u3c1`, icon:`🕊`,
  title:[`Spirituality: An Orthodox Perspective`,`ആത്മീയത — ഒരു ഓർത്തഡോക്സ് വീക്ഷണം`],
  points:[
   [`Spirituality is the crux of human nature — we are body, mind and spirit, created in God's image and likeness. Strictly, spirituality is the work of the Holy Spirit in us.`,
    `ആത്മീയത മനുഷ്യസ്വഭാവത്തിന്റെ കാതലാണ് — ശരീരം, മനസ്സ്, ആത്മാവ് ചേർന്ന, ദൈവത്തിന്റെ ഛായയിലും സാദൃശ്യത്തിലും സൃഷ്ടിക്കപ്പെട്ടവരാണ് നാം. കൃത്യമായി പറഞ്ഞാൽ, നമ്മിലുള്ള പരിശുദ്ധാത്മാവിന്റെ പ്രവർത്തനമാണ് ആത്മീയത.`],
   [`Spiritual progress is not by our effort alone — it is a gift of God's grace, yet it needs our constant preparation and effort.`,
    `ആത്മീയ പുരോഗതി നമ്മുടെ പ്രയത്നം കൊണ്ടു മാത്രമല്ല — അത് ദൈവകൃപയുടെ ദാനമാണ്; എങ്കിലും നമ്മുടെ നിരന്തര ഒരുക്കവും പരിശ്രമവും ആവശ്യമാണ്.`],
   [`Biblical images: Jacob's ladder (ladder of ascent); "deny yourself, take up your cross daily"; Paul taken up to heaven (2 Cor 12:2–3); Transfiguration on Mount Tabor; Moses' shining face on Sinai.`,
    `വേദപുസ്തക പ്രതീകങ്ങൾ: യാക്കോബിന്റെ ഗോവണി (ആരോഹണത്തിന്റെ ഗോവണി); "തന്നെത്താൻ ത്യജിച്ച് ദിനംപ്രതി ക്രൂശെടുത്ത്"; സ്വർഗ്ഗത്തോളം എടുക്കപ്പെട്ട പൗലോസ് (2 കൊരി. 12:2–3); താബോർ മലയിലെ രൂപാന്തരം; സീനായിൽ മോശയുടെ പ്രകാശിക്കുന്ന മുഖം.`],
   [`Spirituality is for everyone, not only saints. Two models: the martyrs and the monks. Desert Fathers and Mothers taught the twin commandments — love of God and love of people — and humility.`,
    `ആത്മീയത വിശുദ്ധന്മാർക്കു മാത്രമല്ല, എല്ലാവർക്കുമുള്ളതാണ്. രണ്ടു മാതൃകകൾ: രക്തസാക്ഷികളും സന്യാസിമാരും. മരുഭൂമിയിലെ പിതാക്കന്മാരും മാതാക്കന്മാരും ദൈവസ്നേഹം, മനുഷ്യസ്നേഹം എന്ന ഇരട്ട കല്പനകളും വിനയവും പഠിപ്പിച്ചു.`],
   [`West: the goal is the "vision of God". East: "unending growth" with "divine discontent" (St. Gregory of Nyssa). Means: ascesis — silence, fasting, vigils, spiritual reading, manual work, meditation.`,
    `പാശ്ചാത്യം: ലക്ഷ്യം "ദൈവദർശനം". പൗരസ്ത്യം: "ഒരിക്കലും അവസാനിക്കാത്ത വളർച്ച", "ദൈവിക അസംതൃപ്തി" (നിസ്സായിലെ വി. ഗ്രീഗോറിയോസ്). മാർഗ്ഗം: സന്യാസനിഷ്ഠ — മൗനം, ഉപവാസം, ജാഗരണം, ആദ്ധ്യാത്മിക വായന, കൈവേല, ധ്യാനം.`],
   [`"Pray without ceasing" → the Jesus Prayer (Prayer of the heart): "Lord Jesus Christ, Son of God, have mercy on me, a sinner." The final goal is Theosis (Divinization). Augustine: we find no rest until we rest in God.`,
    `"ഇടവിടാതെ പ്രാർത്ഥിപ്പിൻ" → യേശുപ്രാർത്ഥന (ഹൃദയപ്രാർത്ഥന): "ദൈവപുത്രനായ കർത്താവായ യേശുക്രിസ്തുവേ, പാപിയായ എന്നോടു കരുണ തോന്നണമേ." ആത്യന്തിക ലക്ഷ്യം തിയോസിസ് (ദൈവീകരണം). അഗസ്റ്റിൻ: ദൈവത്തിൽ വിശ്രമിക്കുന്നതുവരെ നമുക്ക് വിശ്രമമില്ല.`]
  ],
  direct:[
   {n:12, q:[`Which statement is INCORRECT regarding spirituality?`,`ആത്മീയതയുമായി ബന്ധപ്പെട്ട് ശരിയല്ലാത്ത പ്രസ്താവന?`],
    a:[`"Spirituality is something that can only be acquired through human effort."`,`"ആത്മീയത മനുഷ്യന്റെ കഠിനപ്രയത്നം കൊണ്ട് മാത്രം ആർജിച്ചെടുക്കാവുന്ന ഒന്നാണ്."`],
    why:[`Spiritual progress is ultimately a gift of God's grace.`,`ആത്മീയ പുരോഗതി ആത്യന്തികമായി ദൈവകൃപയുടെ ദാനമാണ്.`]},
   {n:13, q:[`The Church Father who said: "We have no rest until we rest in God."`,`"ദൈവത്തിൽ വിശ്രമിക്കുന്നതുവരെ നമുക്ക് വിശ്രമമില്ല" എന്നു പറഞ്ഞ സഭാപിതാവ്?`],
    a:[`St. Augustine`,`സെന്റ് അഗസ്റ്റിൻ`]},
   {n:19, q:[`The ultimate goal of spiritual growth in Eastern Orthodox thought.`,`പൗരസ്ത്യ ഓർത്തഡോക്സ് ചിന്തയിൽ ആത്മീയ വളർച്ചയുടെ ആത്യന്തിക ലക്ഷ്യം?`],
    a:[`Deification (Theosis)`,`ദൈവീകരണം (തിയോസിസ്)`],
    why:[`Theosis goes beyond the Western ideas of "imitation" and "vision of God".`,`പാശ്ചാത്യ സഭകളുടെ "അനുകരണം", "ദൈവദർശനം" എന്നീ ആശയങ്ങൾക്കപ്പുറമാണ് തിയോസിസ്.`]},
   {n:24, q:[`"That man was taken up to Paradise" — who was the man?`,`"ആ മനുഷ്യൻ പറുദീസയോളം എടുക്കപ്പെട്ടു" — ആര്?`],
    a:[`St. Paul`,`പൗലോസ് ശ്ലീഹാ`],
    why:[`2 Corinthians 12:2–4.`,`2 കൊരിന്ത്യർ 12:2–4.`]},
   {q:[`What are the words of the Jesus Prayer?`,`യേശുപ്രാർത്ഥനയുടെ വാക്കുകൾ?`],
    a:[`"Lord Jesus Christ, Son of God, have mercy on me, a sinner."`,`"ദൈവപുത്രനായ കർത്താവായ യേശുക്രിസ്തുവേ, പാപിയായ എന്നോടു കരുണ തോന്നണമേ."`]},
   {q:[`Who is the great exponent of spirituality as "unending growth"?`,`"അവസാനിക്കാത്ത വളർച്ച" എന്ന ആത്മീയ ആശയത്തിന്റെ പ്രധാന വക്താവ്?`],
    a:[`St. Gregory of Nyssa.`,`നിസ്സായിലെ വി. ഗ്രീഗോറിയോസ്.`]}
  ],
  indirect:[
   {q:[`How do the Western and Eastern views of the goal of spirituality differ?`,`ആത്മീയതയുടെ ലക്ഷ്യത്തെക്കുറിച്ച് പാശ്ചാത്യ, പൗരസ്ത്യ വീക്ഷണങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം?`],
    a:[`West: the vision of God. East: unending growth into Theosis — being transformed and sharing in God's nature.`,`പാശ്ചാത്യം: ദൈവദർശനം. പൗരസ്ത്യം: തിയോസിസിലേക്കുള്ള അവസാനിക്കാത്ത വളർച്ച — രൂപാന്തരപ്പെട്ട് ദൈവസ്വഭാവത്തിൽ പങ്കാളികളാകുക.`]},
   {q:[`What does the Transfiguration on Mount Tabor teach about our destiny?`,`താബോർ മലയിലെ രൂപാന്തരം നമ്മുടെ ലക്ഷ്യത്തെക്കുറിച്ച് എന്തു പഠിപ്പിക്കുന്നു?`],
    a:[`Not just to see God's glory, but to be transformed ourselves and share in divine nature and glory.`,`ദൈവമഹത്വം കാണുക മാത്രമല്ല, നാം തന്നെ രൂപാന്തരപ്പെട്ട് ദിവ്യസ്വഭാവത്തിലും മഹത്വത്തിലും പങ്കാളികളാകുക.`]},
   {q:[`List four spiritual exercises (ascesis).`,`നാല് ആദ്ധ്യാത്മിക അഭ്യാസങ്ങൾ (സന്യാസനിഷ്ഠകൾ) എഴുതുക.`],
    a:[`Silence, fasting, vigils, spiritual reading (also manual work, meditation, self-sacrifice).`,`മൗനം, ഉപവാസം, ജാഗരണം, ആദ്ധ്യാത്മിക വായന (കൈവേല, ധ്യാനം, ആത്മത്യാഗം എന്നിവയും).`]}
  ]
 },
 {
  id:`u3c2`, icon:`🕯`,
  title:[`Features of Orthodox Worship`,`ഓർത്തഡോക്സ് ആരാധനയുടെ പ്രത്യേകതകൾ`],
  points:[
   [`"Orthodox" means right faith / right worship. Right faith is expressed through right worship. In worship heaven and earth merge (Revelation 21:3).`,
    `"ഓർത്തഡോക്സ്" = ശരിയായ വിശ്വാസം / ശരിയായ ആരാധന. ശരിയായ വിശ്വാസം ശരിയായ ആരാധനയിലൂടെ പ്രകടമാകുന്നു. ആരാധനയിൽ സ്വർഗ്ഗവും ഭൂമിയും ഒന്നുചേരുന്നു (വെളിപ്പാട് 21:3).`],
   [`Local language: Orthodox churches worship in the people's language. Malankara used Syriac first, later Malayalam; the Qurbana is now in Tamil, Kannada, Konkani, Hindi, English and German. Some Syriac words remain.`,
    `പ്രാദേശിക ഭാഷ: ഓർത്തഡോക്സ് സഭകൾ ജനങ്ങളുടെ ഭാഷയിൽ ആരാധിക്കുന്നു. മലങ്കരയിൽ ആദ്യം സുറിയാനി, പിന്നീട് മലയാളം; ഇന്ന് തമിഴ്, കന്നഡ, കൊങ്കണി, ഹിന്ദി, ഇംഗ്ലീഷ്, ജർമ്മൻ ഭാഷകളിലും കുർബ്ബാനയുണ്ട്. ചില സുറിയാനി വാക്കുകൾ ഇപ്പോഴും നിലനിർത്തുന്നു.`],
   [`Laity participate: Qurbana needs at least a deacon and one layperson. We worship with all five senses — see, hear, smell (incense), touch (kiss of peace), taste (Communion). The choir should lead, not replace, the people.`,
    `അൽമായ പങ്കാളിത്തം: കുർബ്ബാനയ്ക്ക് കുറഞ്ഞത് ഒരു ശെമ്മാശനും ഒരു വിശ്വാസിയും വേണം. അഞ്ച് ഇന്ദ്രിയങ്ങളാലും ആരാധിക്കുന്നു — കാഴ്ച, കേൾവി, മണം (ധൂപം), സ്പർശം (സമാധാനം കൈമാറൽ), രുചി (കുർബ്ബാന). ഗായകസംഘം ജനത്തെ നയിക്കണം, പകരക്കാരാകരുത്.`],
   [`Worship is community-centred ("us", not "me"); it teaches faith (Sedra, Promeon, hymns); it is rich in Bible passages (Kukiliyon begins with a Psalm); it has intercessory prayers (Thubden, Hymns of Eucharistic Devotion).`,
    `ആരാധന സമൂഹകേന്ദ്രീകൃതമാണ് ("ഞാൻ" അല്ല, "ഞങ്ങൾ"); വിശ്വാസം പഠിപ്പിക്കുന്നു (സെദറാ, പ്രൊമിയോൻ, ഗീതങ്ങൾ); വേദപുസ്തക ഭാഗങ്ങൾ ധാരാളം (കുക്കിലിയോൻ സങ്കീർത്തനത്തോടെ ആരംഭിക്കുന്നു); മധ്യസ്ഥ പ്രാർത്ഥനകളുണ്ട് (തുബ്ദേൻ, കുർബ്ബാനാനന്തര ഗീതങ്ങൾ).`],
   [`Prayer to the Holy Spirit (invocation) in Qurbana, Baptism, Ordination and Mooron consecration. Icons became important in the 12th–13th centuries. Worship also gives ecological awareness.`,
    `കുർബ്ബാന, മാമോദീസ, പട്ടംകൊട, മൂറോൻ കൂദാശ എന്നിവയിൽ പരിശുദ്ധാത്മാവിനോടുള്ള പ്രാർത്ഥന (റൂഹാക്ഷണം). 12, 13 നൂറ്റാണ്ടുകളിൽ ഐക്കണുകൾക്ക് പ്രാധാന്യം ലഭിച്ചു. ആരാധന പരിസ്ഥിതി ബോധവും നൽകുന്നു.`],
   [`Music: Syriac is musical; most hymns can be sung in eight tunes (to avoid monotony). The book of these musical principles is "Eckhara" (meaning "basis").`,
    `സംഗീതം: സുറിയാനി സംഗീതാത്മകമായ ഭാഷയാണ്; മിക്ക ഗീതങ്ങളും എട്ട് രാഗങ്ങളിൽ പാടാം (ഏകതാനത ഒഴിവാക്കാൻ). ഈ സംഗീത നിയമങ്ങളുടെ ഗ്രന്ഥം "എക്കാറാ" ("അടിസ്ഥാനം").`]
  ],
  direct:[
   {n:14, q:[`Which of the following is NOT a characteristic of Orthodox worship?`,`ഓർത്തഡോക്സ് ആരാധനയുടെ പ്രത്യേകതകളിൽ ഉൾപ്പെടാത്തത്?`],
    a:[`"All Orthodox churches use only the Syriac language."`,`"എല്ലാ ഓർത്തഡോക്സ് സഭകളും സുറിയാനി ഭാഷയിൽ തന്നെ ആരാധന നടത്തുന്നു."`],
    why:[`Using the local language is itself a feature of Orthodox worship.`,`പ്രാദേശിക ഭാഷ ഉപയോഗിക്കുന്നതുതന്നെ ഓർത്തഡോക്സ് ആരാധനയുടെ പ്രത്യേകതയാണ്.`]},
   {q:[`What does "Orthodox" mean?`,`"ഓർത്തഡോക്സ്" എന്ന വാക്കിന്റെ അർത്ഥം?`],
    a:[`Right faith or right worship.`,`ശരിയായ വിശ്വാസം അല്ലെങ്കിൽ ശരിയായ ആരാധന.`]},
   {q:[`What is the minimum needed for the Holy Qurbana besides the priest?`,`പുരോഹിതനെ കൂടാതെ വി. കുർബ്ബാനയ്ക്ക് കുറഞ്ഞത് ആരെല്ലാം വേണം?`],
    a:[`At least a deacon and one layperson representing the faithful.`,`കുറഞ്ഞത് ഒരു ശെമ്മാശനും വിശ്വാസികളെ പ്രതിനിധീകരിച്ച് ഒരാളും.`]},
   {q:[`What is the book of the principles of our church music called? What does it mean?`,`നമ്മുടെ സഭാസംഗീതത്തിന്റെ നിയമങ്ങളടങ്ങിയ ഗ്രന്ഥത്തിന്റെ പേര്? അർത്ഥം?`],
    a:[`Eckhara — "basis".`,`എക്കാറാ — "അടിസ്ഥാനം".`]},
   {q:[`In how many tunes can most of our hymns be sung?`,`നമ്മുടെ മിക്ക ഗീതങ്ങളും എത്ര രാഗങ്ങളിൽ പാടാം?`],
    a:[`Eight.`,`എട്ട്.`]},
   {q:[`In which centuries did icons gain importance in Orthodox worship?`,`ഏതു നൂറ്റാണ്ടുകളിലാണ് ഐക്കണുകൾക്ക് ഓർത്തഡോക്സ് ആരാധനയിൽ പ്രാധാന്യം ലഭിച്ചത്?`],
    a:[`The 12th and 13th centuries.`,`12, 13 നൂറ്റാണ്ടുകളിൽ.`]}
  ],
  indirect:[
   {q:[`How do we worship God with all five senses?`,`അഞ്ച് ഇന്ദ്രിയങ്ങളാലും നാം എങ്ങനെ ദൈവത്തെ ആരാധിക്കുന്നു?`],
    a:[`See (madbaha, vestments), hear (music), smell (incense), touch (kiss of peace), taste (Holy Communion).`,`കാഴ്ച (മദ്ബഹാ, തിരുവസ്ത്രങ്ങൾ), കേൾവി (സംഗീതം), മണം (ധൂപം), സ്പർശം (സമാധാനം കൈമാറൽ), രുചി (വി. കുർബ്ബാന).`]},
   {q:[`Why are "I, my, mine" rare in Orthodox prayers?`,`ഓർത്തഡോക്സ് പ്രാർത്ഥനകളിൽ "ഞാൻ, എന്റെ" എന്നിവ വിരളമാകുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Because the Church worships as one community, modelled on "Our Father" — "give US our daily bread".`,`സഭ ഒരു സമൂഹമായാണ് ആരാധിക്കുന്നത്; "സ്വർഗ്ഗസ്ഥനായ ഞങ്ങളുടെ പിതാവേ" — "ഞങ്ങൾക്ക് ആവശ്യമുള്ള ആഹാരം" എന്ന മാതൃകയിൽ.`]},
   {q:[`How is worship a school of faith?`,`ആരാധന വിശ്വാസം പഠിപ്പിക്കുന്നത് എങ്ങനെ?`],
    a:[`Faith is learned through worship with the Holy Spirit, not only by logic. Sedras, Promeons and hymns (e.g. the Pentecost and Denha Sedras on the Trinity) teach the faith.`,`വിശ്വാസം യുക്തികൊണ്ടു മാത്രമല്ല, പരിശുദ്ധാത്മാവിന്റെ സഹായത്താൽ ആരാധനയിലൂടെ പഠിക്കുന്നു. സെദറാകളും പ്രൊമിയോനുകളും ഗീതങ്ങളും (ഉദാ: ത്രിത്വത്തെക്കുറിച്ചുള്ള പെന്തിക്കോസ്തി, ദനഹാ സെദറാകൾ) വിശ്വാസം പഠിപ്പിക്കുന്നു.`]}
  ]
 },
 {
  id:`u3c3`, icon:`📿`,
  title:[`Orthodox Liturgy`,`ഓർത്തഡോക്സ് ആരാധനാക്രമം`],
  points:[
   [`Liturgies began in Jerusalem, mother of all churches. Malankara's old liturgical books were destroyed at the Synod of Udayamperoor; after the Koonan Cross Oath (1653) the West Syrian liturgy of Antioch spread in Malankara.`,
    `എല്ലാ സഭകളുടെയും മാതാവായ യെരുശലേമിലാണ് ആരാധനാക്രമങ്ങൾ രൂപംകൊണ്ടത്. ഉദയംപേരൂർ സുന്നഹദോസിനോടനുബന്ധിച്ച് മലങ്കരയിലെ പഴയ ആരാധനാഗ്രന്ഥങ്ങൾ നശിപ്പിക്കപ്പെട്ടു; കൂനൻകുരിശ് സത്യത്തിനു (1653) ശേഷം അന്ത്യോഖ്യൻ പശ്ചിമ സുറിയാനി ക്രമം മലങ്കരയിൽ പ്രചരിച്ചു.`],
   [`Seven canonical hours (day begins with evening): Evening (Sandhya), Late Evening (Soothara), Midnight, Morning, Third hour, Sixth hour (Noon), Ninth hour. Basis: Psalm 119:164. They may be said in two sittings — evening and morning.`,
    `ഏഴു യാമപ്രാർത്ഥനകൾ (ദിവസം സന്ധ്യയോടെ ആരംഭിക്കുന്നു): സന്ധ്യ, സൂത്താറാ, രാത്രി, പ്രഭാതം, മൂന്നാം മണി, ആറാം മണി (ഉച്ച), ഒൻപതാം മണി. അടിസ്ഥാനം: സങ്കീർത്തനം 119:164. ഇവ സന്ധ്യയ്ക്കും പ്രഭാതത്തിലുമായി രണ്ടു നേരം ചൊല്ലാൻ അനുവാദമുണ്ട്.`],
   [`"Kauma" means "standing up" — all prayers begin and end with it; we stand in God's presence. Kauma and the Creed are the pillars of worship. Six Bible readings (three from the OT) in the Qurbana are unique to Orthodox liturgy.`,
    `"കൗമാ" = "എഴുന്നേറ്റു നിൽക്കൽ" — എല്ലാ നമസ്കാരങ്ങളും കൗമായോടെ ആരംഭിക്കുകയും അവസാനിക്കുകയും ചെയ്യുന്നു; ദൈവസന്നിധിയിൽ നാം നിന്നു പ്രാർത്ഥിക്കുന്നു. കൗമായും വിശ്വാസപ്രമാണവും ആരാധനയുടെ തൂണുകളാണ്. കുർബ്ബാനയിലെ ആറു വേദവായനകൾ (മൂന്നെണ്ണം പഴയനിയമം) ഓർത്തഡോക്സ് ആരാധനയുടെ മാത്രം പ്രത്യേകത.`],
   [`Genuflection is not made on Sundays, Moranaya feasts, and from Easter to Pentecost. In Lent and the Three-Day Fast there are forty genuflections after the noon prayer.`,
    `ഞായറാഴ്ചകളിലും മോറാനായ പെരുന്നാളുകളിലും ഉയിർപ്പു മുതൽ പെന്തിക്കോസ്തി വരെയും കുമ്പിടീൽ (മുട്ടുകുത്തൽ) ഇല്ല. വലിയ നോമ്പിലും മൂന്നു നോമ്പിലും ഉച്ചനമസ്കാരത്തിനു ശേഷം നാൽപ്പതു കുമ്പിടീൽ.`],
   [`Parts of prayer: Slooso (opening), Promeon (introduction), Sedra (chain of prayers), Hoosoyo (absolution), Ethro (incense prayer), Hoothomo (conclusion). Kukiliyon (cycle of prayers): Psalm → Shubaho… → Ekbo ("step") → Kolos → "Moriyo Rahem…".`,
    `പ്രാർത്ഥനയുടെ ഘടകങ്ങൾ: സ്ളൂസോ (ആരംഭ പ്രാർത്ഥന), പ്രൊമിയോൻ (ആമുഖം), സെദറാ (നിരനിരയായ പ്രാർത്ഥന), ഹൂസോയോ (പാപപരിഹാര പ്രാർത്ഥന), എത്രോ (ധൂപപ്രാർത്ഥന), ഹൂത്തോമോ (സമാപനം). കുക്കിലിയോൻ (പ്രാർത്ഥനാചക്രം): സങ്കീർത്തനം → ശുബഹോ… → എക്ബോ ("പടി") → കോലോകൾ → "മോറിയോ റാഹേം…".`],
   [`Sheema (common) prayer days: Sunday — Resurrection; Mon & Tue — repentance; Wed — St. Mary; Thu — Apostles; Fri — Passion; Sat — departed. Incense = total surrender to God (Exodus 30; Revelation 5:8).`,
    `ശ്ഹീമാ നമസ്കാര ദിവസങ്ങൾ: ഞായർ — ഉയിർപ്പ്; തിങ്കൾ, ചൊവ്വ — അനുതാപം; ബുധൻ — ദൈവമാതാവ്; വ്യാഴം — ശ്ലീഹന്മാർ; വെള്ളി — കഷ്ടാനുഭവം; ശനി — വാങ്ങിപ്പോയവർ. ധൂപം = ദൈവത്തിനു മുമ്പിലുള്ള പൂർണ്ണ സമർപ്പണം (പുറപ്പാട് 30; വെളിപ്പാട് 5:8).`]
  ],
  direct:[
   {n:15, q:[`The Psalm where David says, "Seven times a day I praise You because of Your righteous judgments".`,`"നിന്റെ നീതിയുള്ള വിധികൾ നിമിത്തം ഞാൻ ദിവസം ഏഴു പ്രാവശ്യം നിന്നെ സ്തുതിക്കുന്നു" എന്ന സങ്കീർത്തനഭാഗം?`],
    a:[`Psalm 119:164`,`സങ്കീർത്തനം 119:164`]},
   {n:16, q:[`All prayers begin with the recitation of ______.`,`എല്ലാ നമസ്കാരങ്ങളും ______ ചൊല്ലിക്കൊണ്ടാണ് ആരംഭിക്കുന്നത്.`],
    a:[`The Kauma`,`കൗമാ`],
    why:[`"Kauma" means standing up — we stand in God's presence.`,`"കൗമാ" = എഴുന്നേറ്റു നിൽക്കൽ — ദൈവസന്നിധിയിൽ നാം നിൽക്കുന്നു.`]},
   {n:42, q:[`The reason why the Malankara Church contacted the Antiochian Syrian Church.`,`മലങ്കരസഭ അന്ത്യോഖ്യൻ സുറിയാനി സഭയുമായി ബന്ധപ്പെടുവാൻ ഉണ്ടായ കാരണം?`],
    a:[`Both the given answers are correct (to overcome Portuguese resistance, and to keep priestly succession)`,`തന്നിരിക്കുന്ന രണ്ട് ഉത്തരങ്ങളും ശരിയാണ് (പോർച്ചുഗീസ് എതിർപ്പിനെ അതിജീവിക്കുവാനും പൗരോഹിത്യ പിന്തുടർച്ച നിലനിർത്തുവാനും)`],
    why:[`After the Koonan Cross Oath (1653), those who stood away from the Portuguese sought help from foreign churches to keep priestly succession, and finally joined with Antioch.`,`കൂനൻകുരിശ് സത്യത്തിനു (1653) ശേഷം പോർച്ചുഗീസുകാരിൽ നിന്ന് അകന്നുനിന്നവർ പൗരോഹിത്യ പിന്തുടർച്ചയ്ക്കായി വിദേശസഭകളുടെ സഹായം തേടി; ഒടുവിൽ അന്ത്യോഖ്യയുമായി ബന്ധം സ്ഥാപിച്ചു.`]},
   {q:[`Name the seven canonical hours.`,`ഏഴു യാമപ്രാർത്ഥനകളുടെ പേരെഴുതുക.`],
    a:[`Evening, Late Evening (Soothara), Midnight, Morning, Third hour, Sixth hour (Noon), Ninth hour.`,`സന്ധ്യ, സൂത്താറാ, രാത്രി, പ്രഭാതം, മൂന്നാം മണി, ആറാം മണി (ഉച്ച), ഒൻപതാം മണി.`]},
   {q:[`What does "Kukiliyon" mean, and what does "Ekbo" mean?`,`"കുക്കിലിയോൻ", "എക്ബോ" എന്നീ വാക്കുകളുടെ അർത്ഥം?`],
    a:[`Kukiliyon = cycle of prayers. Ekbo = step or stair.`,`കുക്കിലിയോൻ = പ്രാർത്ഥനാചക്രം. എക്ബോ = പടി.`]},
   {q:[`What is the meaning of "Hoosoyo" and "Hoothomo"?`,`"ഹൂസോയോ", "ഹൂത്തോമോ" എന്നിവയുടെ അർത്ഥം?`],
    a:[`Hoosoyo = prayer of absolution. Hoothomo = concluding prayer.`,`ഹൂസോയോ = പാപപരിഹാര പ്രാർത്ഥന. ഹൂത്തോമോ = സമാപന പ്രാർത്ഥന.`]},
   {q:[`Which day of the week commemorates St. Mary in the Sheema prayers?`,`ശ്ഹീമാ നമസ്കാരത്തിൽ ദൈവമാതാവിനെ ഓർക്കുന്ന ദിവസം?`],
    a:[`Wednesday.`,`ബുധനാഴ്ച.`]}
  ],
  indirect:[
   {q:[`Why is the Kauma prayed standing?`,`കൗമാ നിന്നുകൊണ്ട് ചൊല്ലുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Kauma means "standing up". In the Oriental tradition the body also takes part in worship, and we stand in God's presence.`,`കൗമാ എന്നാൽ "എഴുന്നേറ്റു നിൽക്കൽ". പൗരസ്ത്യ പാരമ്പര്യത്തിൽ ശരീരവും ആരാധനയിൽ പങ്കുചേരുന്നു; ദൈവസന്നിധിയിൽ നാം നിൽക്കുന്നു.`]},
   {q:[`When do we NOT genuflect?`,`ഏതു ദിവസങ്ങളിൽ കുമ്പിടീൽ ഇല്ല?`],
    a:[`Sundays, Moranaya feasts, from Easter to Pentecost, and on a day we receive Communion (till evening).`,`ഞായറാഴ്ചകൾ, മോറാനായ പെരുന്നാളുകൾ, ഉയിർപ്പു മുതൽ പെന്തിക്കോസ്തി വരെ, കുർബ്ബാന അനുഭവിക്കുന്ന ദിവസം (സന്ധ്യവരെ).`]},
   {q:[`What does burning incense symbolise?`,`ധൂപം അർപ്പിക്കുന്നതിന്റെ പ്രതീകാർത്ഥം?`],
    a:[`Total surrender to God; our life should be filled with love like fragrance fills the church; cleansing of time and space through worship.`,`ദൈവത്തിനു മുമ്പിലുള്ള പൂർണ്ണ സമർപ്പണം; സുഗന്ധം ദേവാലയം നിറയ്ക്കുന്നതുപോലെ നമ്മുടെ ജീവിതം സ്നേഹത്താൽ നിറയണം; ആരാധനയിലൂടെ കാലവും സ്ഥലവും ശുദ്ധീകരിക്കപ്പെടുന്നു.`]}
  ]
 },
 {
  id:`u3c4`, icon:`🌟`,
  title:[`Feasts of the Orthodox Church`,`ഓർത്തഡോക്സ് സഭയിലെ പെരുന്നാളുകൾ`],
  points:[
   [`"Feast" means "great day". All feasts connect with Christ — events of His life, the Church (e.g. the Cross), or the memory of apostles and saints.`,
    `"പെരുന്നാൾ" = "വലിയ ദിവസം". എല്ലാ പെരുന്നാളുകളും ക്രിസ്തുവുമായി ബന്ധപ്പെട്ടതാണ് — അവന്റെ ജീവിതസംഭവങ്ങൾ, സഭ (ഉദാ: സ്ലീബാ), ശ്ലീഹന്മാരുടെയും പരിശുദ്ധന്മാരുടെയും ഓർമ്മ.`],
   [`"Moranaya" means "of our Lord". All Sundays are Moranaya days. Moranaya feasts: Annunciation, Christmas, Presentation in the Temple, Baptism (Denha), Transfiguration; Shoonoyo (Dormition of St. Mary); June 29 (Peter & Paul) and July 3 (St. Thomas).`,
    `"മോറാനായ" = "നമ്മുടെ കർത്താവിന്റെ". എല്ലാ ഞായറാഴ്ചകളും മോറാനായ ദിവസങ്ങൾ. മോറാനായ പെരുന്നാളുകൾ: വചനിപ്പ്, ജനനം, ദേവാലയ പ്രവേശനം, മാമോദീസ (ദനഹാ), രൂപാന്തരം; ശൂനോയോ (ദൈവമാതാവിന്റെ വാങ്ങിപ്പ്); ജൂൺ 29 (പത്രോസ്, പൗലോസ്), ജൂലൈ 3 (മാർത്തോമ്മാ).`],
   [`The greatest feast is Easter — the Resurrection distinguishes Christianity from all religions. On Sundays: no fasting or genuflection; join the Qurbana, read the Bible, pray (Isaiah 58:13–14).`,
    `ഏറ്റവും വലിയ പെരുന്നാൾ ഉയിർപ്പ് — ഉയിർപ്പ് ക്രിസ്തുമതത്തെ മറ്റു മതങ്ങളിൽനിന്ന് വേർതിരിക്കുന്നു. ഞായറാഴ്ച: ഉപവാസവും കുമ്പിടീലും ഇല്ല; കുർബ്ബാന, വേദവായന, പ്രാർത്ഥന (യെശയ്യാവ് 58:13–14).`],
   [`Christmas: the fire (flame) service — the light seen by the shepherds; frankincense is put in the fire, done before the Angels' praise. Denha: blessing of water ("Denha" = rising/dawn, the Trinity revealed at Jordan). Easter: proclamation of the Resurrection.`,
    `ജനനപ്പെരുന്നാൾ: തീജ്വാല ശുശ്രൂഷ — ആട്ടിടയന്മാർ കണ്ട ദിവ്യപ്രകാശം; കുന്തുരുക്കം തീയിലിടുന്നു; മാലാഖമാരുടെ സ്തുതിപ്പിനു മുമ്പ്. ദനഹാ: വെള്ളം വാഴ്ത്തൽ ("ദനഹാ" = ഉദയം; യോർദ്ദാനിൽ ത്രിത്വം വെളിപ്പെട്ടു). ഉയിർപ്പ്: ഉയിർപ്പിന്റെ പ്രഖ്യാപനം.`],
   [`Pentecost service has three parts — addressed to the Father, the Son and the Holy Spirit; water is sprinkled on the faithful after each — a renewal of baptism.`,
    `പെന്തിക്കോസ്തി ശുശ്രൂഷയ്ക്ക് മൂന്നു ഭാഗങ്ങൾ — പിതാവിനെയും പുത്രനെയും പരിശുദ്ധാത്മാവിനെയും സംബോധന ചെയ്ത്; ഓരോന്നിനു ശേഷവും വിശ്വാസികളുടെ മേൽ വെള്ളം തളിക്കുന്നു — മാമോദീസായുടെ പുതുക്കം.`],
   [`"Hawd Maalakhe" — the celebration of the Cross (a solemn Kauma) with the nine choirs of angels; in all special services except Pentecost. Feasts of saints should not become occasions of luxury.`,
    `"ഹൗദ്മാലാഖെ" — ഒൻപതു മാലാഖവൃന്ദങ്ങളോടു ചേർന്നുള്ള സ്ലീബാ ആഘോഷം (ആഘോഷമായ കൗമാ); പെന്തിക്കോസ്തി ഒഴികെ എല്ലാ പ്രത്യേക ശുശ്രൂഷകളിലും. പരിശുദ്ധന്മാരുടെ പെരുന്നാളുകൾ ആർഭാടത്തിനുള്ള അവസരമാകരുത്.`]
  ],
  direct:[
   {n:17, q:[`Choose the INCORRECT pair.`,`തന്നിരിക്കുന്ന ജോഡികളിൽ ശരിയല്ലാത്തത്?`],
    a:[`"August 15 – Feast of the Nativity" (Eng. paper) / "ഓഗസ്റ്റ് 15 – സ്ലീബാ പെരുന്നാൾ" (Mal. paper)`,`"ഓഗസ്റ്റ് 15 – സ്ലീബാ പെരുന്നാൾ"`],
    why:[`August 15 is Shoonoyo (Dormition of St. Mary). The English and Malayalam papers print different feasts here, but both pairs are wrong.`,`ഓഗസ്റ്റ് 15 ശൂനോയോ (ദൈവമാതാവിന്റെ വാങ്ങിപ്പ്) ആണ്.`]},
   {n:18, q:[`Choose the one that is NOT correct about the observance of feasts.`,`പെരുന്നാൾ ആചരണത്തെ സംബന്ധിച്ച് ശരിയല്ലാത്തത്?`],
    a:[`"The water is blessed on the feast of Pentecost."`,`"പെന്തിക്കോസ്തി പെരുന്നാളിൽ വെള്ളം വാഴ്ത്തുന്നു."`],
    why:[`The water-blessing service belongs to Denha. (At Pentecost, water is sprinkled on the faithful as a renewal of baptism.)`,`വെള്ളം വാഴ്ത്തുന്ന ശുശ്രൂഷ ദനഹായിലാണ്. (പെന്തിക്കോസ്തിയിൽ മാമോദീസായുടെ പുതുക്കമായി വിശ്വാസികളുടെ മേൽ വെള്ളം തളിക്കുന്നു.)`]},
   {n:20, q:[`Which of the following is a feast of the Mother of God?`,`പരിശുദ്ധ ദൈവമാതാവിനോടു ബന്ധപ്പെട്ട പെരുന്നാൾ?`],
    a:[`Shoonoyo`,`ശൂനോയോ`]},
   {q:[`What does "Moranaya" mean?`,`"മോറാനായ" എന്ന വാക്കിന്റെ അർത്ഥം?`],
    a:[`"Of our Lord".`,`"നമ്മുടെ കർത്താവിന്റെ".`]},
   {q:[`Which is the greatest feast for a Christian?`,`ഒരു ക്രിസ്ത്യാനിയുടെ ഏറ്റവും വലിയ പെരുന്നാൾ?`],
    a:[`Easter (the Resurrection).`,`ഉയിർപ്പ് പെരുന്നാൾ.`]},
   {q:[`What is "Hawd Maalakhe"? In which special service is it NOT included?`,`"ഹൗദ്മാലാഖെ" എന്താണ്? ഏതു പ്രത്യേക ശുശ്രൂഷയിലാണ് ഇത് ഇല്ലാത്തത്?`],
    a:[`The celebration of the Holy Cross (a solemn Kauma). It is not in the Pentecost service.`,`വിശുദ്ധ സ്ലീബായുടെ ആഘോഷം (ആഘോഷമായ കൗമാ). പെന്തിക്കോസ്തി ശുശ്രൂഷയിൽ ഇതില്ല.`]}
  ],
  indirect:[
   {q:[`What does the fire service at Christmas symbolise?`,`ജനനപ്പെരുന്നാളിലെ തീജ്വാല ശുശ്രൂഷയുടെ പ്രതീകാർത്ഥം?`],
    a:[`The heavenly light the shepherds saw and the light that rose on a world in darkness. Putting frankincense in the fire recalls the gifts of the shepherds and wise men — and our own offering to God.`,`ആട്ടിടയന്മാർ കണ്ട ദിവ്യപ്രകാശവും ഇരുട്ടിലിരുന്ന ലോകത്തിന് ഉദിച്ച പ്രകാശവും. കുന്തുരുക്കം തീയിലിടുന്നത് ആട്ടിടയന്മാരുടെയും വിദ്വാന്മാരുടെയും കാഴ്ചകളെയും നമ്മുടെ സമർപ്പണത്തെയും ഓർമ്മിപ്പിക്കുന്നു.`]},
   {q:[`What is said at the proclamation of the Resurrection?`,`ഉയിർപ്പിന്റെ പ്രഖ്യാപനത്തിൽ എന്താണ് പറയുന്നത്?`],
    a:[`Priest: "Our Lord Jesus Christ has risen from the dead and defeated His enemies." People: "We believe and confess that He has truly risen."`,`പുരോഹിതൻ: "നമ്മുടെ കർത്താവ് ഉയിർത്തെഴുന്നേറ്റ് തന്റെ ശത്രുക്കളെ ആട്ടിയോടിച്ചിരിക്കുന്നു." ജനം: "സത്യമായും ഉയിർത്തെഴുന്നേറ്റു എന്നു ഞങ്ങൾ വിശ്വസിച്ചേറ്റു പറയുന്നു."`]},
   {q:[`How should we celebrate the feasts of saints?`,`പരിശുദ്ധന്മാരുടെ പെരുന്നാളുകൾ എങ്ങനെ ആചരിക്കണം?`],
    a:[`By glorifying Christ and imitating the saint's holy life — not with luxury and noise that have no connection with their lives.`,`ക്രിസ്തുവിനെ മഹത്വപ്പെടുത്തിയും ആ പരിശുദ്ധന്റെ വിശുദ്ധ ജീവിതം അനുകരിച്ചും — അവരുടെ ജീവിതവുമായി ബന്ധമില്ലാത്ത ആർഭാടങ്ങളും ബഹളങ്ങളും ഒഴിവാക്കി.`]}
  ]
 }
 ]
});

// UNIT 4 — Learning and Teaching in Sunday School
BOOK1.push({
 id:`u4`, title:[`Learning and Teaching in Sunday School`,`പഠനവും അദ്ധ്യാപനവും സൺഡേസ്കൂളിൽ`],
 chapters:[
 {
  id:`u4c1`, icon:`🎯`,
  title:[`Learning and Teaching in Sunday School`,`പഠനവും അദ്ധ്യാപനവും സൺഡേസ്കൂളിൽ`],
  points:[
   [`Learning is a permanent change in a person brought about by experiences. Two views: Behaviourism (change in behaviour) and Cognitivism (change in knowledge structure).`,
    `അനുഭവങ്ങളിലൂടെ ഒരു വ്യക്തിയിൽ ഉണ്ടാകുന്ന സ്ഥായിയായ മാറ്റമാണ് പഠനം. രണ്ടു വീക്ഷണങ്ങൾ: ബിഹേവിയറിസം (സ്വഭാവത്തിലെ മാറ്റം), കോഗ്നിറ്റിവിസം (അറിവിന്റെ ഘടനയിലെ മാറ്റം).`],
   [`Environment: natural (not created by anyone) and artificial/formal (created by us — Sunday School, school, training centres). Learning needs a conducive environment.`,
    `പരിസ്ഥിതി: സ്വാഭാവികം (ആരും സൃഷ്ടിക്കാത്തത്), കൃത്രിമം/ഔപചാരികം (നാം സൃഷ്ടിക്കുന്നത് — സൺഡേസ്കൂൾ, സ്കൂൾ, പരിശീലനകേന്ദ്രങ്ങൾ). പഠനത്തിന് അനുകൂലമായ പരിസ്ഥിതി വേണം.`],
   [`Five components of learning: genuine interest, right attitude, readiness to learn, aptitude, motivation. A good teacher kindles interest.`,
    `പഠനത്തിന്റെ അഞ്ച് ഘടകങ്ങൾ: യഥാർത്ഥ താൽപര്യം, ശരിയായ മനോഭാവം, പഠനസന്നദ്ധത, അഭിരുചി, പ്രചോദനം. നല്ല അധ്യാപകൻ താൽപര്യം ഉണർത്തുന്നു.`],
   [`Teaching is a systematic process that enables right learning. Four components: teacher, student, subject, environment. Goal: all-round development (Gandhi: body, mind and spirit).`,
    `ശരിയായ പഠനം സാധ്യമാക്കുന്ന ചിട്ടയായ പ്രക്രിയയാണ് അദ്ധ്യാപനം. നാലു ഘടകങ്ങൾ: അധ്യാപകൻ, വിദ്യാർത്ഥി, പാഠ്യവിഷയം, പരിസ്ഥിതി. ലക്ഷ്യം: സർവ്വതോമുഖ വികാസം (ഗാന്ധിജി: ശരീരം, മനസ്സ്, ആത്മാവ്).`],
   [`Ultimate goal of Sunday School: that students become God's children and inherit eternal life. Long-term goals include: Orthodox faith and ideal Christian life, good character in society, fruits of the Spirit (Gal 5:22), staying in true faith and worship.`,
    `സൺഡേസ്കൂളിന്റെ പരമലക്ഷ്യം: വിദ്യാർത്ഥികൾ ദൈവമക്കളായി നിത്യജീവൻ അവകാശമാക്കുക. ദീർഘകാല ലക്ഷ്യങ്ങൾ: ഓർത്തഡോക്സ് വിശ്വാസവും മാതൃകാ ക്രിസ്തീയ ജീവിതവും, സമൂഹത്തിൽ സൽസ്വഭാവികളായി ജീവിക്കുക, ആത്മാവിന്റെ ഫലങ്ങൾ (ഗലാത്യർ 5:22), സത്യവിശ്വാസത്തിലും സത്യാരാധനയിലും നിലനിൽക്കുക.`],
   [`Short-term goals: learn Bible truths, read the Bible daily, pray the canonical hours (at least twice), learn prayers, hymns, sacraments, Fathers and Church history. The aim is not exams or competition.`,
    `ഹ്രസ്വകാല ലക്ഷ്യങ്ങൾ: വേദസത്യങ്ങൾ പഠിക്കുക, ദിവസവും വേദം വായിക്കുക, യാമപ്രാർത്ഥനകൾ (കുറഞ്ഞത് രണ്ടു നേരം), പ്രാർത്ഥനകൾ, ഗീതങ്ങൾ, കൂദാശകൾ, പിതാക്കന്മാർ, സഭാചരിത്രം എന്നിവ പഠിക്കുക. ലക്ഷ്യം പരീക്ഷയോ മത്സരമോ അല്ല.`]
  ],
  direct:[
   {n:21, q:[`Choose the most appropriate quality that students should have in relation to learning.`,`പഠനവുമായി ബന്ധപ്പെട്ട് വിദ്യാർത്ഥികളിൽ ഉണ്ടാകേണ്ട ഏറ്റവും അനുയോജ്യമായ ഗുണം?`],
    a:[`All answers are correct (attitude, willingness to learn, right interest)`,`എല്ലാ ഉത്തരങ്ങളും ശരിയാണ് (മനോഭാവം, പഠനസന്നദ്ധത, ശരിയായ താൽപര്യം)`],
    why:[`All are listed among the components of learning.`,`ഇവയെല്ലാം പഠനത്തിന്റെ ഘടകങ്ങളാണ്.`]},
   {n:22, q:[`Choose the long-term goals of Sunday School learning.`,`സൺഡേസ്കൂൾ പഠനത്തിന്റെ ദീർഘകാല ലക്ഷ്യങ്ങളിൽ ഉൾപ്പെടുന്നത്?`],
    a:[`All answers are correct`,`എല്ലാ ഉത്തരങ്ങളും ശരിയാണ്`],
    why:[`Good character in society, true faith and worship, living by Bible truths — all are long-term goals.`,`സൽസ്വഭാവം, സത്യവിശ്വാസവും ആരാധനയും, വേദാനുസൃത ജീവിതം — എല്ലാം ദീർഘകാല ലക്ഷ്യങ്ങൾ.`]},
   {q:[`What is learning?`,`പഠനം എന്നാൽ എന്ത്?`],
    a:[`A permanent change in a person brought about by experiences and insights from the surroundings.`,`ചുറ്റുപാടുകളിൽനിന്നുള്ള അനുഭവങ്ങളിലൂടെ ഒരു വ്യക്തിയിൽ ഉണ്ടാകുന്ന സ്ഥായിയായ മാറ്റം.`]},
   {q:[`What are the four components of teaching?`,`അദ്ധ്യാപനത്തിന്റെ നാലു ഘടകങ്ങൾ?`],
    a:[`Teacher, student, subject, environment.`,`അധ്യാപകൻ, വിദ്യാർത്ഥി, പാഠ്യവിഷയം, പരിസ്ഥിതി.`]},
   {q:[`What is the ultimate goal of Sunday School teaching?`,`സൺഡേസ്കൂൾ അദ്ധ്യാപനത്തിന്റെ പരമലക്ഷ്യം?`],
    a:[`That students become God's children and inherit eternal life / the Kingdom of Heaven.`,`വിദ്യാർത്ഥികൾ ദൈവമക്കളായി നിത്യജീവൻ / സ്വർഗ്ഗരാജ്യം അവകാശമാക്കുക.`]}
  ],
  indirect:[
   {q:[`Why may some students lose interest in studies?`,`ചില വിദ്യാർത്ഥികൾക്ക് പഠനത്തിൽ താൽപര്യം നഷ്ടപ്പെടുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Faulty teaching, the teacher's wrong attitude, harsh punishment, lack of suitable activities, and problems at home.`,`തെറ്റായ ബോധനരീതി, അധ്യാപകന്റെ തെറ്റായ മനോഭാവം, കഠിനശിക്ഷ, അനുയോജ്യമായ പ്രവർത്തനങ്ങളുടെ കുറവ്, വീട്ടിലെ പ്രശ്നങ്ങൾ.`]},
   {q:[`Is a Sunday School "artificial" or "natural" environment? Why?`,`സൺഡേസ്കൂൾ "കൃത്രിമ" പരിസ്ഥിതിയോ "സ്വാഭാവിക" പരിസ്ഥിതിയോ? എന്തുകൊണ്ട്?`],
    a:[`Artificial (formal) — it is specially created by us for learning.`,`കൃത്രിമം (ഔപചാരികം) — പഠനത്തിനായി നാം പ്രത്യേകം സൃഷ്ടിച്ചതാണ്.`]}
  ]
 },
 {
  id:`u4c2`, icon:`🧑‍🏫`,
  title:[`Teaching Methods`,`ബോധന രീതികൾ`],
  points:[
   [`"How to teach" is as important as "what to teach". The teacher chooses a method by students' previous knowledge, the lesson, objectives, aids, time and interests.`,
    `"എന്തു പഠിപ്പിക്കണം" എന്നതുപോലെ പ്രധാനമാണ് "എങ്ങനെ പഠിപ്പിക്കണം". വിദ്യാർത്ഥികളുടെ മുന്നറിവ്, പാഠം, ലക്ഷ്യങ്ങൾ, പഠനസഹായികൾ, സമയം, താൽപര്യം എന്നിവ നോക്കി അധ്യാപകൻ രീതി തെരഞ്ഞെടുക്കുന്നു.`],
   [`Multi Methodology Approach: blending several methods in one lesson (e.g. lecture, then discussion).`,
    `ബഹുരീതി സമീപനം (Multi Methodology Approach): ഒരു പാഠത്തിൽ പല രീതികൾ കൂട്ടിച്ചേർക്കുക (ഉദാ: പ്രഭാഷണം, തുടർന്ന് ചർച്ച).`],
   [`Teacher-centred (traditional): Lecture, Story telling, Demonstration, Narration, Textbook. Students become mere listeners; little scope for independent thinking.`,
    `അധ്യാപകകേന്ദ്രീകൃതം (പരമ്പരാഗതം): പ്രഭാഷണം, കഥപറച്ചിൽ, പ്രദർശനം, വിവരണം, പാഠപുസ്തക രീതി. വിദ്യാർത്ഥികൾ കേൾവിക്കാർ മാത്രം; സ്വതന്ത്രചിന്തയ്ക്ക് കുറഞ്ഞ സാധ്യത.`],
   [`Learner-centred: Discussion, Cooperative learning, Inquiry, Project, Problem solving, Observation, Dramatization. The teacher prepares and guides; students learn by doing.`,
    `പഠിതാകേന്ദ്രീകൃതം: ചർച്ച, സഹകരണ പഠനം, അന്വേഷണം, പ്രോജക്ട്, പ്രശ്നപരിഹാരം, നിരീക്ഷണം, നാടകീകരണം. അധ്യാപകൻ ഒരുക്കുകയും നയിക്കുകയും ചെയ്യുന്നു; വിദ്യാർത്ഥികൾ ചെയ്തു പഠിക്കുന്നു.`],
   [`Discussion method from class 5 upward (group cards, group leader presents). Story telling suits lower classes. Lecture should be used sparingly in lower classes.`,
    `ചർച്ചാരീതി 5-ാം ക്ലാസ് മുതൽ (ഗ്രൂപ്പ് കാർഡുകൾ, ഗ്രൂപ്പ് ലീഡർ അവതരിപ്പിക്കുന്നു). കഥപറച്ചിൽ താഴ്ന്ന ക്ലാസുകൾക്ക് യോജിച്ചത്. താഴ്ന്ന ക്ലാസുകളിൽ പ്രഭാഷണരീതി കുറച്ചേ ഉപയോഗിക്കാവൂ.`],
   [`Thinking Skills Development: apply concepts to a new situation — e.g. write a letter to a Protestant friend defending prayer for the departed from the Bible. Resource book: "At the Teacher's Feet" (Gurupadantike).`,
    `ചിന്താശേഷി വികസന രീതി: പഠിച്ച ആശയങ്ങൾ പുതിയ സാഹചര്യത്തിൽ പ്രയോഗിക്കുക — ഉദാ: വാങ്ങിപ്പോയവർക്കുവേണ്ടിയുള്ള പ്രാർത്ഥനയെ വേദാടിസ്ഥാനത്തിൽ ന്യായീകരിച്ച് ഒരു പ്രൊട്ടസ്റ്റന്റ് സുഹൃത്തിന് കത്തെഴുതുക. സഹായഗ്രന്ഥം: "ഗുരുപാദാന്തികേ".`]
  ],
  direct:[
   {q:[`What is the Multi Methodology Approach?`,`ബഹുരീതി സമീപനം (Multi Methodology Approach) എന്നാൽ എന്ത്?`],
    a:[`Blending several teaching methods in one lesson to make the presentation attractive.`,`അവതരണം ആകർഷകമാക്കാൻ ഒരു പാഠത്തിൽ പല ബോധനരീതികൾ കൂട്ടിച്ചേർക്കുന്നത്.`]},
   {q:[`Name three teacher-centred methods.`,`മൂന്ന് അധ്യാപകകേന്ദ്രീകൃത രീതികൾ?`],
    a:[`Lecture, story telling, demonstration (also narration, textbook).`,`പ്രഭാഷണം, കഥപറച്ചിൽ, പ്രദർശനം (വിവരണം, പാഠപുസ്തക രീതി എന്നിവയും).`]},
   {q:[`Name three learner-centred methods.`,`മൂന്ന് പഠിതാകേന്ദ്രീകൃത രീതികൾ?`],
    a:[`Discussion, project, dramatization (also cooperative learning, inquiry, problem solving, observation).`,`ചർച്ച, പ്രോജക്ട്, നാടകീകരണം (സഹകരണ പഠനം, അന്വേഷണം, പ്രശ്നപരിഹാരം, നിരീക്ഷണം എന്നിവയും).`]},
   {q:[`From which class can the discussion method be used?`,`ഏതു ക്ലാസ് മുതൽ ചർച്ചാരീതി ഉപയോഗിക്കാം?`],
    a:[`From class 5 onwards.`,`5-ാം ക്ലാസ് മുതൽ.`]},
   {q:[`What is the OSSAE teachers' resource book mentioned in this lesson?`,`ഈ പാഠത്തിൽ പറയുന്ന OSSAE അധ്യാപക സഹായഗ്രന്ഥം?`],
    a:[`"At the Teacher's Feet" (Gurupadantike).`,`"ഗുരുപാദാന്തികേ" (At the Teacher's Feet).`]}
  ],
  indirect:[
   {q:[`How could you teach the parable of the Good Samaritan using different methods?`,`നല്ല ശമര്യക്കാരന്റെ ഉപമ വിവിധ രീതികളിൽ എങ്ങനെ പഠിപ്പിക്കാം?`],
    a:[`As a story, as a description, by question–answer or discussion, or by dramatization followed by discussion.`,`കഥയായി, വിവരണമായി, ചോദ്യോത്തര രീതിയിൽ, ചർച്ചയായി, അല്ലെങ്കിൽ നാടകീകരിച്ച ശേഷം ചർച്ച ചെയ്ത്.`]},
   {q:[`Why are learner-centred methods preferred in the new curriculum?`,`പുതിയ പാഠ്യപദ്ധതിയിൽ പഠിതാകേന്ദ്രീകൃത രീതികൾക്ക് മുൻഗണന നൽകുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Students learn actively, think independently, and learn to apply knowledge in life instead of learning mechanically.`,`വിദ്യാർത്ഥികൾ യാന്ത്രികമായല്ലാതെ സജീവമായി പഠിക്കുന്നു, സ്വതന്ത്രമായി ചിന്തിക്കുന്നു, അറിവ് ജീവിതത്തിൽ പ്രയോഗിക്കാൻ പഠിക്കുന്നു.`]}
  ]
 },
 {
  id:`u4c3`, icon:`🖼`,
  title:[`Learning Aids`,`പഠന സഹായികൾ`],
  points:[
   [`Our senses are the doors of learning. Joseph Weber: 40% of learning is through seeing, 25% through hearing, 35% through the other senses.`,
    `ഇന്ദ്രിയങ്ങളാണ് പഠനത്തിന്റെ വാതിലുകൾ. ജോസഫ് വെബർ: 40% പഠനം കാഴ്ചയിലൂടെ, 25% കേൾവിയിലൂടെ, 35% മറ്റ് ഇന്ദ്രിയങ്ങളിലൂടെ.`],
   [`Eric Ashby's four revolutions in education: from home to school; written documents; printing; electronic media.`,
    `എറിക് ആഷ്ബിയുടെ വിദ്യാഭ്യാസത്തിലെ നാലു വിപ്ലവങ്ങൾ: വീട്ടിൽ നിന്ന് വിദ്യാലയത്തിലേക്ക്; എഴുത്തു രേഖകൾ; അച്ചടി; ഇലക്ട്രോണിക് മാധ്യമങ്ങൾ.`],
   [`"I hear, I forget; I see, I remember; I do, I understand." Aids give variety, save time, avoid boredom — "a good picture is better than a thousand words".`,
    `"ഞാൻ കേൾക്കുന്നു, മറക്കുന്നു; കാണുന്നു, ഓർക്കുന്നു; ചെയ്യുന്നു, മനസ്സിലാക്കുന്നു." പഠനസഹായികൾ വൈവിധ്യം നൽകുന്നു, സമയം ലാഭിക്കുന്നു, മടുപ്പ് ഒഴിവാക്കുന്നു — "ഒരു നല്ല ചിത്രം ആയിരം വാക്കുകളെക്കാൾ നല്ലത്".`],
   [`Four types: Printed (textbook, workbook, magazines, journals, newspaper); Audio (radio, tape recorder, language lab); Visual (board, charts, pictures, maps, models, flash cards); Audio-visual (TV, films, documentaries, video CDs, computer).`,
    `നാലു തരം: അച്ചടിച്ചവ (പാഠപുസ്തകം, വർക്ക്ബുക്ക്, മാസികകൾ, ജേണലുകൾ, പത്രം); ശ്രാവ്യം (റേഡിയോ, ടേപ്പ് റെക്കോർഡർ, ഭാഷാ ലാബ്); ദൃശ്യം (ബോർഡ്, ചാർട്ട്, ചിത്രം, മാപ്പ്, മോഡൽ, ഫ്ലാഷ് കാർഡ്); ദൃശ്യ-ശ്രാവ്യം (ടിവി, സിനിമ, ഡോക്യുമെന്ററി, വീഡിയോ സിഡി, കമ്പ്യൂട്ടർ).`],
   [`Desiderius Erasmus (1466–1536) first suggested learning aids; Rousseau and Pestalozzi supported it. Models (3D) influence more than pictures (2D); icons are more meaningful than pictures.`,
    `ഡെസിഡേരിയസ് ഇറാസ്മസ് (1466–1536) ആണ് ആദ്യമായി പഠനസഹായികൾ നിർദ്ദേശിച്ചത്; റൂസോയും പെസ്റ്റലോസിയും പിന്തുണച്ചു. മോഡലുകൾ (ത്രിമാനം) ചിത്രങ്ങളെക്കാൾ (ദ്വിമാനം) സ്വാധീനം ചെലുത്തുന്നു; ഐക്കണുകൾ ചിത്രങ്ങളെക്കാൾ അർത്ഥവത്താണ്.`],
   [`A learning aid, however good, is never a substitute for an efficient teacher.`,
    `എത്ര നല്ലതായാലും ഒരു പഠനസഹായിയും സമർത്ഥനായ അധ്യാപകന് പകരമാവില്ല.`]
  ],
  direct:[
   {n:25, q:[`Which of the following is NOT an audio-visual learning aid?`,`ദൃശ്യ-ശ്രാവ്യ പഠനസഹായികളിൽ ഉൾപ്പെടാത്തത്?`],
    a:[`Magazines`,`മാസികകൾ`],
    why:[`Magazines are printed aids. Videos and documentaries are audio-visual.`,`മാസികകൾ അച്ചടിച്ച പഠനസഹായികളാണ്. വീഡിയോ, ഡോക്യുമെന്ററി എന്നിവ ദൃശ്യ-ശ്രാവ്യം.`]},
   {q:[`According to Joseph Weber, what percentage of learning happens through seeing?`,`ജോസഫ് വെബറിന്റെ അഭിപ്രായത്തിൽ എത്ര ശതമാനം പഠനം കാഴ്ചയിലൂടെ നടക്കുന്നു?`],
    a:[`40% (hearing 25%, other senses 35%).`,`40% (കേൾവി 25%, മറ്റ് ഇന്ദ്രിയങ്ങൾ 35%).`]},
   {q:[`Who first suggested using learning aids?`,`പഠനസഹായികൾ ഉപയോഗിക്കാമെന്ന് ആദ്യമായി നിർദ്ദേശിച്ചത് ആര്?`],
    a:[`Desiderius Erasmus (1466–1536), Dutch theologian.`,`ഡച്ച് ദൈവശാസ്ത്രജ്ഞനായ ഡെസിഡേരിയസ് ഇറാസ്മസ് (1466–1536).`]},
   {q:[`Name the four categories of learning aids.`,`പഠനസഹായികളുടെ നാലു വിഭാഗങ്ങൾ?`],
    a:[`Printed, audio, visual and audio-visual.`,`അച്ചടിച്ചവ, ശ്രാവ്യം, ദൃശ്യം, ദൃശ്യ-ശ്രാവ്യം.`]},
   {q:[`What is the fourth revolution in education according to Eric Ashby?`,`എറിക് ആഷ്ബിയുടെ അഭിപ്രായത്തിൽ വിദ്യാഭ്യാസത്തിലെ നാലാമത്തെ വിപ്ലവം?`],
    a:[`The use of electronic media.`,`ഇലക്ട്രോണിക് മാധ്യമങ്ങളുടെ ഉപയോഗം.`]}
  ],
  indirect:[
   {q:[`Why can a model be better than a picture?`,`മോഡൽ ചിത്രത്തെക്കാൾ നല്ലതാകുന്നത് എന്തുകൊണ്ട്?`],
    a:[`A model is a three-dimensional form of the real object; a picture is only two-dimensional.`,`മോഡൽ യഥാർത്ഥ വസ്തുവിന്റെ ത്രിമാന രൂപമാണ്; ചിത്രം ദ്വിമാനം മാത്രം.`]},
   {q:[`List four points to remember while using learning aids.`,`പഠനസഹായികൾ ഉപയോഗിക്കുമ്പോൾ ശ്രദ്ധിക്കേണ്ട നാലു കാര്യങ്ങൾ?`],
    a:[`Most suitable and related to the subject; right size and clarity; used at the right time; handled with care (also: teacher knows how to use them, maximum participation).`,`ഏറ്റവും അനുയോജ്യവും വിഷയവുമായി ബന്ധപ്പെട്ടതും; ശരിയായ വലിപ്പവും വ്യക്തതയും; ശരിയായ സമയത്ത് ഉപയോഗിക്കുക; ശ്രദ്ധയോടെ കൈകാര്യം ചെയ്യുക (അധ്യാപകന് ഉപയോഗിക്കാൻ അറിയണം, പരമാവധി പങ്കാളിത്തം).`]}
  ]
 },
 {
  id:`u4c4`, icon:`🌱`,
  title:[`Sunday School Teacher — Talents and Preparations`,`സൺഡേസ്കൂൾ അദ്ധ്യാപകൻ — കഴിവുകളും മുന്നൊരുക്കവും`],
  points:[
   [`H.G. Wells: "The teacher is the real maker of history." The teacher is like a gardener; students are budding plants.`,
    `എച്ച്. ജി. വെൽസ്: "അദ്ധ്യാപകനാണ് ചരിത്രം നിർമ്മിക്കുന്നവൻ." അധ്യാപകൻ ഒരു തോട്ടക്കാരനെപ്പോലെ; വിദ്യാർത്ഥികൾ മൊട്ടിടുന്ന ചെടികൾ.`],
   [`The teacher is like the director of a play — behind the curtain but in control. So the teacher is a facilitator, preserver of culture, and mediator between student and learning material.`,
    `അധ്യാപകൻ ഒരു നാടകത്തിന്റെ സംവിധായകനെപ്പോലെ — തിരശ്ശീലയ്ക്കു പിന്നിൽ, എന്നാൽ എല്ലാം നിയന്ത്രിച്ച്. അതിനാൽ അധ്യാപകൻ ഫെസിലിറ്റേറ്റർ, സംസ്കാരത്തിന്റെ സംരക്ഷകൻ, വിദ്യാർത്ഥിക്കും പാഠവസ്തുവിനും ഇടയിലെ മധ്യവർത്തി.`],
   [`Three groups of qualities: Teacher qualities (subject knowledge, methods, presentation); Leadership qualities (democratic, good shepherd — Jesus the model teacher); Personal qualities (love, patience, humility, kindness, self-control, pleasant face, humour).`,
    `മൂന്നു വിഭാഗം ഗുണങ്ങൾ: അധ്യാപക ഗുണങ്ങൾ (വിഷയജ്ഞാനം, ബോധനരീതികൾ, അവതരണം); നേതൃഗുണങ്ങൾ (ജനാധിപത്യപരം, നല്ല ഇടയൻ — യേശു മാതൃകാ അധ്യാപകൻ); വ്യക്തിഗുണങ്ങൾ (സ്നേഹം, ക്ഷമ, വിനയം, ദയ, ആത്മനിയന്ത്രണം, പ്രസന്നമുഖം, നർമ്മബോധം).`],
   [`Responsibilities: strong faith and prayer life, regular worship, Divyabodhanam courses, basic computer skills, study tours and camps, training programmes, loyalty to the Church; TTC or B.Ed is also good.`,
    `ഉത്തരവാദിത്വങ്ങൾ: ശക്തമായ വിശ്വാസവും പ്രാർത്ഥനാജീവിതവും, മുടങ്ങാത്ത ആരാധന, ദിവ്യബോധനം കോഴ്സുകൾ, അടിസ്ഥാന കമ്പ്യൂട്ടർ പരിജ്ഞാനം, പഠനയാത്രകളും ക്യാമ്പുകളും, പരിശീലന പരിപാടികൾ, സഭയോടുള്ള കൂറ്; ടിടിസി, ബി.എഡ് എന്നിവയും നല്ലത്.`]
  ],
  direct:[
   {n:26, q:[`The reason why a teacher is called a facilitator.`,`അധ്യാപകനെ ഫെസിലിറ്റേറ്റർ എന്നു വിളിക്കുവാൻ കാരണം?`],
    a:[`Because he/she provides all the necessary help for the student to learn best`,`വിദ്യാർത്ഥി ഏറ്റവും നന്നായി പഠിക്കുവാൻ ആവശ്യമായ എല്ലാ സഹായങ്ങളും ചെയ്തുകൊടുക്കുന്നതുകൊണ്ട്`],
    why:[`"A teacher equips students to learn, extending all possible help. Thus the teacher becomes the facilitator."`,`"വിദ്യാർത്ഥികളെ പഠിക്കാൻ സജ്ജരാക്കി സാധ്യമായ എല്ലാ സഹായവും നൽകുന്നു; അങ്ങനെ അധ്യാപകൻ ഫെസിലിറ്റേറ്റർ ആകുന്നു."`]},
   {q:[`Who said "The teacher is the real maker of history"?`,`"അദ്ധ്യാപകനാണ് യഥാർത്ഥത്തിൽ ചരിത്രം നിർമ്മിക്കുന്നവൻ" എന്നു പറഞ്ഞത് ആര്?`],
    a:[`H.G. Wells.`,`എച്ച്. ജി. വെൽസ്.`]},
   {q:[`Into which three groups are a teacher's qualities classified?`,`ഒരു അധ്യാപകന്റെ ഗുണങ്ങളെ ഏതെല്ലാം മൂന്നു വിഭാഗങ്ങളായി തിരിക്കാം?`],
    a:[`Teacher qualities, leadership qualities, personal qualities.`,`അധ്യാപക ഗുണങ്ങൾ, നേതൃഗുണങ്ങൾ, വ്യക്തിഗുണങ്ങൾ.`]},
   {q:[`Who is the model teacher we should follow?`,`നാം അനുകരിക്കേണ്ട മാതൃകാ അധ്യാപകൻ?`],
    a:[`Jesus Christ — the Good Shepherd.`,`യേശുക്രിസ്തു — നല്ല ഇടയൻ.`]}
  ],
  indirect:[
   {q:[`Explain the comparison of a teacher with a stage director.`,`അധ്യാപകനെ നാടക സംവിധായകനോട് ഉപമിക്കുന്നത് വിശദീകരിക്കുക.`],
    a:[`The director never acts on stage but controls everything from behind the curtain; likewise the teacher prepares and guides students so that they learn and "perform".`,`സംവിധായകൻ വേദിയിൽ അഭിനയിക്കുന്നില്ല, എങ്കിലും തിരശ്ശീലയ്ക്കു പിന്നിൽ നിന്ന് എല്ലാം നിയന്ത്രിക്കുന്നു; അതുപോലെ അധ്യാപകൻ വിദ്യാർത്ഥികളെ ഒരുക്കി നയിക്കുന്നു.`]},
   {q:[`Would you like to become a Sunday School teacher? What should you do to prepare?`,`ഒരു സൺഡേസ്കൂൾ അധ്യാപകനാകാൻ ആഗ്രഹമുണ്ടോ? എങ്ങനെ ഒരുങ്ങണം?`],
    a:[`Pray for the call; grow in faith and worship; read widely; take Divyabodhanam courses; learn teaching methods and aids; attend training programmes.`,`ദൈവവിളിക്കായി പ്രാർത്ഥിക്കുക; വിശ്വാസത്തിലും ആരാധനയിലും വളരുക; ധാരാളം വായിക്കുക; ദിവ്യബോധനം കോഴ്സുകൾ ചെയ്യുക; ബോധനരീതികളും പഠനസഹായികളും പഠിക്കുക; പരിശീലന പരിപാടികളിൽ പങ്കെടുക്കുക.`]}
  ]
 }

// UNIT 5 — Christian Education
BOOK1.push({
 id:`u5`, title:[`Christian Education`,`ക്രിസ്തീയ വിദ്യാഭ്യാസം`],
 chapters:[
 {
  id:`u5c1`, icon:`📚`,
  title:[`Christian Education`,`ക്രിസ്തീയ വിദ്യാഭ്യാസം`],
  points:[
   [`Earlier, education meant gaining knowledge. Today it means skills, concept formation, freedom and human rights. The teacher no longer just "gives" knowledge — both teacher and students keep learning.`,
    `മുൻകാലത്ത് വിദ്യാഭ്യാസം = അറിവു നേടൽ. ഇന്ന് നൈപുണ്യങ്ങൾ, ആശയരൂപീകരണം, സ്വാതന്ത്ര്യം, മനുഷ്യാവകാശങ്ങൾ എന്നിവ ഉൾപ്പെടുന്നു. അധ്യാപകൻ അറിവ് "നൽകുന്നവൻ" മാത്രമല്ല — അധ്യാപകനും വിദ്യാർത്ഥികളും ഒരുപോലെ പഠിക്കുന്നു.`],
   [`Modern education: create a suitable learning environment, let learners analyse things in their own way, develop learning skills and guide personality growth.`,
    `ആധുനിക വിദ്യാഭ്യാസം: അനുയോജ്യമായ പഠനാന്തരീക്ഷം ഒരുക്കുക; പഠിതാക്കൾ സ്വന്തം രീതിയിൽ കാര്യങ്ങൾ അപഗ്രഥിക്കട്ടെ; പഠനനൈപുണ്യങ്ങളും വ്യക്തിത്വ വികാസവും വളർത്തുക.`],
   [`Plato: education develops the hidden goodness of a child. "The fear (devotion) of the Lord is the beginning of wisdom" (Proverbs 1:7; 9:10).`,
    `പ്ലേറ്റോ: കുട്ടിയിലെ മറഞ്ഞിരിക്കുന്ന നന്മയെ വളർത്തുന്നതാണ് വിദ്യാഭ്യാസം. "യഹോവാഭക്തി ജ്ഞാനത്തിന്റെ ആരംഭം" (സദൃശവാക്യങ്ങൾ 1:7; 9:10).`],
   [`The ultimate aim of Christian life and education is Theosis — growing into God's image and likeness, focused on Christ. The two great commandments sum up all.`,
    `ക്രിസ്തീയ ജീവിതത്തിന്റെയും വിദ്യാഭ്യാസത്തിന്റെയും പരമലക്ഷ്യം തിയോസിസ് (ദൈവീകരണം) — ക്രിസ്തുവിനെ ലക്ഷ്യമാക്കി ദൈവഛായയിലും സാദൃശ്യത്തിലും വളരുക. രണ്ടു വലിയ കല്പനകളിൽ എല്ലാം അടങ്ങിയിരിക്കുന്നു.`],
   [`"Let the children come to me" (Matthew 19:14) and "Go into all the world" (Mark 16:15) show the need to teach. Christian education is not something the Church "gives" — it happens in children as they share the Church's spiritual life.`,
    `"ശിശുക്കളെ എന്റെ അടുക്കൽ വരുവാൻ വിടുവിൻ" (മത്തായി 19:14), "സർവ്വലോകത്തിലും പോയി" (മർക്കൊസ് 16:15) — ഇവ വിദ്യാഭ്യാസത്തിന്റെ ആവശ്യം കാണിക്കുന്നു. ക്രിസ്തീയ വിദ്യാഭ്യാസം സഭ "നൽകുന്ന" ഒന്നല്ല — സഭയുടെ ആത്മീയ ജീവിതത്തിൽ പങ്കുചേരുമ്പോൾ കുട്ടികളിൽ നടക്കുന്ന പ്രക്രിയയാണ്.`],
   [`Children should never be taught as if they were adults — St. Gregory of Nyssa pointed this out in the 4th century. Education is a life-long process.`,
    `കുട്ടികളെ മുതിർന്നവരെന്നപോലെ പഠിപ്പിക്കരുത് — നാലാം നൂറ്റാണ്ടിൽ നിസ്സായിലെ വി. ഗ്രീഗോറിയോസ് ഇതു ചൂണ്ടിക്കാണിച്ചു. വിദ്യാഭ്യാസം ആജീവനാന്ത പ്രക്രിയയാണ്.`]
  ],
  direct:[
   {n:27, q:[`Choose the statement that best fits the modern educational process.`,`ആധുനിക വിദ്യാഭ്യാസ പ്രക്രിയയോട് ഏറ്റവും യോജിക്കുന്ന പരാമർശം?`],
    a:[`Students analyse things on their own in a suitable learning environment and acquire skills`,`അനുയോജ്യമായ പഠന അന്തരീക്ഷം സൃഷ്ടിച്ച്, സ്വന്തം നിലയിൽ വിദ്യാർത്ഥി കാര്യങ്ങൾ അപഗ്രഥിക്കുകയും നൈപുണ്യം നേടുകയും ചെയ്യുക`],
    why:[`This is exactly how the textbook describes modern education.`,`ആധുനിക വിദ്യാഭ്യാസത്തെ പാഠപുസ്തകം ഇങ്ങനെയാണ് വിവരിക്കുന്നത്.`]},
   {q:[`What is the ultimate aim of Christian life and education?`,`ക്രിസ്തീയ ജീവിതത്തിന്റെയും വിദ്യാഭ്യാസത്തിന്റെയും പരമലക്ഷ്യം?`],
    a:[`Divinization (Theosis).`,`ദൈവീകരണം (തിയോസിസ്).`]},
   {q:[`According to Plato, what is education?`,`പ്ലേറ്റോയുടെ അഭിപ്രായത്തിൽ വിദ്യാഭ്യാസം എന്താണ്?`],
    a:[`An exercise that develops the hidden goodness in a child to a permanent stature.`,`കുട്ടിയിൽ മറഞ്ഞിരിക്കുന്ന നന്മയെ സ്ഥായിയായ നിലയിലേക്ക് വളർത്തുന്ന പ്രക്രിയ.`]},
   {q:[`Which Church Father warned that children should not be taught like adults?`,`കുട്ടികളെ മുതിർന്നവരെപ്പോലെ പഠിപ്പിക്കരുത് എന്ന് മുന്നറിയിപ്പ് നൽകിയ സഭാപിതാവ്?`],
    a:[`St. Gregory of Nyssa (4th century).`,`നിസ്സായിലെ വി. ഗ്രീഗോറിയോസ് (4-ാം നൂറ്റാണ്ട്).`]}
  ],
  indirect:[
   {q:[`Why is Christian education needed even though schools teach morals?`,`വിദ്യാലയങ്ങൾ സന്മാർഗ്ഗം പഠിപ്പിക്കുന്നുണ്ടെങ്കിലും ക്രിസ്തീയ വിദ്യാഭ്യാസം എന്തിന്?`],
    a:[`To help each person grow into the stature of Christ, especially amid changing life situations, the effects of science and technology, and falling moral standards.`,`ഓരോരുത്തരെയും ക്രിസ്തുവിന്റെ വളർച്ചയുടെ അളവിലേക്ക് വളർത്താൻ — പ്രത്യേകിച്ച് മാറുന്ന ജീവിതസാഹചര്യങ്ങൾ, ശാസ്ത്ര-സാങ്കേതിക സ്വാധീനം, ധാർമ്മിക തകർച്ച എന്നിവയ്ക്കിടയിൽ.`]},
   {q:[`How has the role of the teacher changed in modern education?`,`ആധുനിക വിദ്യാഭ്യാസത്തിൽ അധ്യാപകന്റെ പങ്ക് എങ്ങനെ മാറി?`],
    a:[`From one who "gives" knowledge from a high pedestal to one who creates a learning environment and guides learners — and keeps learning too.`,`ഉയർന്ന പീഠത്തിലിരുന്ന് അറിവ് "നൽകുന്നവനിൽ" നിന്ന്, പഠനാന്തരീക്ഷം ഒരുക്കി പഠിതാക്കളെ നയിക്കുന്നവനായി — അധ്യാപകനും പഠിച്ചുകൊണ്ടിരിക്കുന്നു.`]}
  ]

 {
  id:`u5c2`, icon:`🏛`,
  title:[`Christian Education — Historical Background`,`ക്രിസ്തീയ വിദ്യാഭ്യാസം — ചരിത്രപശ്ചാത്തലം`],
  points:[
   [`Christian education grew from the Jewish tradition. Jewish education was based on the Law of Moses; at first it was informal and the family was the school — mother first, then the father.`,
    `ക്രിസ്തീയ വിദ്യാഭ്യാസം യെഹൂദ പാരമ്പര്യത്തിൽ നിന്ന് വളർന്നു. മോശയുടെ ന്യായപ്രമാണമായിരുന്നു യെഹൂദ വിദ്യാഭ്യാസത്തിന്റെ അടിസ്ഥാനം; ആദ്യം അനൗപചാരികം — കുടുംബമായിരുന്നു വിദ്യാലയം; ആദ്യം അമ്മ, പിന്നീട് അപ്പൻ.`],
   [`At age four a child was taught the Creed — the "Shema" (Deuteronomy 6:4–9): "Hear, O Israel: the Lord our God is one Lord…"`,
    `നാലാം വയസ്സിൽ കുട്ടിയെ വിശ്വാസപ്രമാണം — "ഷെമ" (ആവർത്തനം 6:4–9) — പഠിപ്പിച്ചിരുന്നു: "യിസ്രായേലേ, കേൾക്ക; നമ്മുടെ ദൈവമായ യഹോവ ഏകൻ…"`],
   [`Formal schools (75 BC–AD 64): "Beth Hazepher" (House of Books, age 6–10) and "Beth Hamidrash" (House of Learning, Mishna, age 10–15).`,
    `ഔപചാരിക വിദ്യാലയങ്ങൾ (ബി.സി. 75–എ.ഡി. 64): "ബേത്ത് ഹസേഫർ" (പുസ്തകഭവനം, 6–10 വയസ്സ്), "ബേത്ത് ഹമിദ്രാഷ്" (പഠനഭവനം, മിഷ്ന, 10–15 വയസ്സ്).`],
   [`Teachers: priests (had to read the whole Law to the people every seven years — Deut 31:10–13) and prophets (conveyed God's message, called people to repentance).`,
    `അധ്യാപകർ: പുരോഹിതന്മാർ (ഏഴു വർഷത്തിലൊരിക്കൽ ന്യായപ്രമാണം മുഴുവൻ ജനത്തെ വായിച്ചു കേൾപ്പിക്കണം — ആവർത്തനം 31:10–13), പ്രവാചകന്മാർ (ദൈവസന്ദേശം അറിയിച്ചു, മാനസാന്തരത്തിലേക്കു വിളിച്ചു).`],
   [`Jesus was called "Rabbi" (teacher) and taught in parables. The apostolic Church was a teaching Church — 3000 joined at Pentecost (Acts 2:41). "Fathers… bring them up in the instruction of the Lord" (Ephesians 6:4). Catechumens attended only part of the Qurbana.`,
    `യേശുവിനെ "റബ്ബി" (ഗുരു) എന്നു വിളിച്ചു; ഉപമകളിലൂടെ പഠിപ്പിച്ചു. അപ്പോസ്തോലിക സഭ ഒരു പഠിപ്പിക്കുന്ന സഭയായിരുന്നു — പെന്തിക്കോസ്തിയിൽ 3000 പേർ ചേർന്നു (അപ്പൊ. 2:41). "പിതാക്കന്മാരേ… കർത്താവിന്റെ ഉപദേശത്തിൽ അവരെ വളർത്തുവിൻ" (എഫെസ്യർ 6:4). മാമോദീസാർത്ഥികൾ കുർബ്ബാനയുടെ ഒരു ഭാഗത്തിൽ മാത്രം പങ്കെടുത്തു.`]
  ],
  direct:[
   {n:28, q:[`What is the Shema?`,`ഷെമ എന്നാൽ എന്ത്?`],
    a:[`The Jewish Creed`,`യെഹൂദന്മാരുടെ വിശ്വാസപ്രമാണം`],
    why:[`Deuteronomy 6:4–9, taught to Jewish children at age four.`,`ആവർത്തനം 6:4–9 — യെഹൂദ കുട്ടികളെ നാലാം വയസ്സിൽ പഠിപ്പിച്ചിരുന്നു.`]},
   {n:29, q:[`Scripture that refers to the life of faith in the apostolic age.`,`അപ്പോസ്തോല കാലഘട്ടത്തിലെ വിശ്വാസജീവിതത്തെക്കുറിച്ച് പരാമർശിക്കുന്ന വേദഭാഗം?`],
    a:[`Acts 2:42`,`അപ്പോസ്തോല പ്രവൃത്തികൾ 2:42`],
    why:[`The early Church continued in the apostles' teaching, fellowship, breaking of bread and prayers.`,`ആദിമസഭ അപ്പോസ്തോലന്മാരുടെ ഉപദേശം, കൂട്ടായ്മ, അപ്പം നുറുക്കൽ, പ്രാർത്ഥന എന്നിവയിൽ ഉറച്ചുനിന്നു.`]},
   {q:[`At what age were Jewish children taught the Shema?`,`ഏതു പ്രായത്തിലാണ് യെഹൂദ കുട്ടികളെ ഷെമ പഠിപ്പിച്ചിരുന്നത്?`],
    a:[`At age four.`,`നാലാം വയസ്സിൽ.`]},
   {q:[`What do "Beth Hazepher" and "Beth Hamidrash" mean?`,`"ബേത്ത് ഹസേഫർ", "ബേത്ത് ഹമിദ്രാഷ്" എന്നിവയുടെ അർത്ഥം?`],
    a:[`Beth Hazepher = House of Books (age 6–10). Beth Hamidrash = House of Learning (age 10–15).`,`ബേത്ത് ഹസേഫർ = പുസ്തകഭവനം (6–10 വയസ്സ്). ബേത്ത് ഹമിദ്രാഷ് = പഠനഭവനം (10–15 വയസ്സ്).`]},
   {q:[`How often did priests have to recite the whole Mosaic Law to the people?`,`പുരോഹിതന്മാർ എത്ര വർഷത്തിലൊരിക്കൽ ന്യായപ്രമാണം മുഴുവൻ ജനത്തെ വായിച്ചു കേൾപ്പിക്കണമായിരുന്നു?`],
    a:[`Once every seven years (Deuteronomy 31:10–13).`,`ഏഴു വർഷത്തിലൊരിക്കൽ (ആവർത്തനം 31:10–13).`]},
   {q:[`Which verse tells parents to bring up children in the instruction of the Lord?`,`കുട്ടികളെ കർത്താവിന്റെ ഉപദേശത്തിൽ വളർത്താൻ മാതാപിതാക്കളോട് പറയുന്ന വാക്യം?`],
    a:[`Ephesians 6:4.`,`എഫെസ്യർ 6:4.`]}
  ],
  indirect:[
   {q:[`Who was the first teacher of a Jewish child and where?`,`ഒരു യെഹൂദ കുട്ടിയുടെ ആദ്യ അധ്യാപകൻ ആര്? എവിടെ?`],
    a:[`The family was the first school; the mother gave the first lessons, then the father took the main responsibility.`,`കുടുംബമായിരുന്നു ആദ്യ വിദ്യാലയം; അമ്മ ആദ്യപാഠങ്ങൾ നൽകി, പിന്നീട് അപ്പൻ പ്രധാന ഉത്തരവാദിത്വം ഏറ്റെടുത്തു.`]},
   {q:[`How did the prophets act as teachers?`,`പ്രവാചകന്മാർ അധ്യാപകരായി പ്രവർത്തിച്ചത് എങ്ങനെ?`],
    a:[`They conveyed God's message, called people away from sin, taught God's holiness and covenant, and counselled rulers and people to live morally.`,`ദൈവസന്ദേശം അറിയിച്ചു, പാപത്തിൽ നിന്ന് പിന്തിരിയാൻ വിളിച്ചു, ദൈവത്തിന്റെ വിശുദ്ധിയും ഉടമ്പടിയും പഠിപ്പിച്ചു, ജനത്തെയും ഭരണാധികാരികളെയും സന്മാർഗ്ഗജീവിതത്തിന് ഉപദേശിച്ചു.`]}
  ]
 },
 {
  id:`u5c3`, icon:`🏫`,
  title:[`Christian Education and the Sunday School`,`ക്രിസ്തീയ വിദ്യാഭ്യാസവും സൺഡേസ്കൂളും`],
  points:[
   [`The "charter" of Sunday School: "Let the children come to me… for to such belongs the kingdom of heaven" (Matthew 19:14). Also Matthew 28:19–20 (baptising and teaching) and Jude 3.`,
    `സൺഡേസ്കൂളിന്റെ "ആധാരപ്രമാണം": "ശിശുക്കളെ എന്റെ അടുക്കൽ വരുവാൻ വിടുവിൻ… സ്വർഗ്ഗരാജ്യം ഇങ്ങനെയുള്ളവരുടേതല്ലോ" (മത്തായി 19:14). മത്തായി 28:19–20 (സ്നാനം കഴിപ്പിച്ചും പഠിപ്പിച്ചും), യൂദാ 3.`],
   [`Robert Raikes (1735–1811), a journalist, began the Sunday School movement in England in 1780 for street children of the Industrial Revolution. When he died there were 5000 children in Sunday Schools.`,
    `പത്രപ്രവർത്തകനായ റോബർട്ട് റെയ്ക്സ് (1735–1811) 1780-ൽ ഇംഗ്ലണ്ടിൽ വ്യവസായ വിപ്ലവകാലത്തെ തെരുവുകുട്ടികൾക്കായി സൺഡേസ്കൂൾ പ്രസ്ഥാനം ആരംഭിച്ചു. അദ്ദേഹം മരിക്കുമ്പോൾ 5000 കുട്ടികൾ സൺഡേസ്കൂളിൽ ഉണ്ടായിരുന്നു.`],
   [`India: Carey, Marshman and Ward (Kolkata, 1800); India Sunday School Union (ISSU) formed in 1876 at Jabalpur (moved to Coonoor 1927); first Indian head Mr. Rallaram. OSSAE works with AISSA from 2007.`,
    `ഇന്ത്യ: കേരി, മാർഷ്മാൻ, വാർഡ് (കൊൽക്കത്ത, 1800); 1876-ൽ ജബൽപൂരിൽ ഇന്ത്യ സൺഡേസ്കൂൾ യൂണിയൻ (ISSU) (1927-ൽ കൂനൂരിലേക്ക്); ആദ്യ ഇന്ത്യൻ അധ്യക്ഷൻ റല്ലാറാം. 2007 മുതൽ OSSAE, AISSA-യുമായി സഹകരിക്കുന്നു.`],
   [`Malankara: religious education began under Mar Thoma VI (Mar Dionysius the Great). Kandanad assembly (1809) decided to teach children prayers and sacraments. Old Seminary — first "Paditha Veedu" (1815).`,
    `മലങ്കര: ആറാം മാർത്തോമ്മാ (വലിയ മാർ ദിവന്നാസിയോസ്) കാലത്ത് മതബോധനം ആരംഭിച്ചു. കണ്ടനാട് പള്ളിയോഗം (1809) കുട്ടികളെ പ്രാർത്ഥനകളും കൂദാശകളും പഠിപ്പിക്കാൻ തീരുമാനിച്ചു. പഴയസെമിനാരി — ആദ്യത്തെ "പഠിത്തവീട്" (1815).`],
   [`Under Vattasseril Thirumeni the "Malankara Sunday School Samajam" was organised (Fr. K. David, secretary). In 1930 Puthenkavil Geevarghese Mar Philoxenos became president.`,
    `വട്ടശ്ശേരിൽ തിരുമേനിയുടെ കാലത്ത് "മലങ്കര സൺഡേസ്കൂൾ സമാജം" രൂപീകരിച്ചു (ഫാ. കെ. ഡേവിഡ് സെക്രട്ടറി). 1930-ൽ പുത്തൻകാവിൽ ഗീവർഗീസ് മാർ പീലക്സീനോസ് പ്രസിഡന്റായി.`],
   [`OSSAE was reorganised in 1964 (Synod approved 20 January 1964) under Catholicos Augen I: President Vayaliparambil Geevarghese Mar Gregorios, Director General Kaniyamparambil Kurian Cor-Episcopa. New curriculum from 2015; Fr. Dr. Varghese Varghese Director General from 2019.`,
    `1964-ൽ ഔഗേൻ ഒന്നാമൻ ബാവായുടെ അധ്യക്ഷതയിൽ OSSAE പുനഃസംഘടിപ്പിച്ചു (സുന്നഹദോസ് അംഗീകാരം 1964 ജനുവരി 20): പ്രസിഡന്റ് വയലിപ്പറമ്പിൽ ഗീവർഗീസ് മാർ ഗ്രീഗോറിയോസ്, ഡയറക്ടർ ജനറൽ കണിയാമ്പറമ്പിൽ കുര്യൻ കോർ-എപ്പിസ്കോപ്പാ. 2015 മുതൽ പുതിയ പാഠ്യപദ്ധതി; 2019 മുതൽ ഫാ. ഡോ. വർഗീസ് വർഗീസ് ഡയറക്ടർ ജനറൽ.`]
  ],
  direct:[
   {n:30, q:[`Name before the Malankara Sunday School was renamed OSSAE in 1964.`,`1964-ൽ OSSAE എന്ന പേരിൽ ആകുന്നതിനു മുമ്പുള്ള പേര്?`],
    a:[`Malankara Sunday School Samajam`,`മലങ്കര സൺഡേസ്കൂൾ സമാജം`]},
   {q:[`What is called the "charter" of Sunday School education?`,`സൺഡേസ്കൂൾ വിദ്യാഭ്യാസത്തിന്റെ "ആധാരപ്രമാണം" ഏത്?`],
    a:[`Matthew 19:14 — "Let the children come to me, and do not hinder them…"`,`മത്തായി 19:14 — "ശിശുക്കളെ എന്റെ അടുക്കൽ വരുവാൻ വിടുവിൻ; അവരെ തടയരുത്…"`]},
   {q:[`Who started the Sunday School movement, where and when?`,`സൺഡേസ്കൂൾ പ്രസ്ഥാനം ആരംഭിച്ചത് ആര്, എവിടെ, എപ്പോൾ?`],
    a:[`Robert Raikes, a journalist, in England in 1780.`,`പത്രപ്രവർത്തകനായ റോബർട്ട് റെയ്ക്സ്, ഇംഗ്ലണ്ടിൽ, 1780-ൽ.`]},
   {q:[`When and where was the India Sunday School Union formed?`,`ഇന്ത്യ സൺഡേസ്കൂൾ യൂണിയൻ രൂപീകരിച്ചത് എപ്പോൾ, എവിടെ?`],
    a:[`In 1876 at Jabalpur (moved to Coonoor in 1927).`,`1876-ൽ ജബൽപൂരിൽ (1927-ൽ കൂനൂരിലേക്ക് മാറ്റി).`]},
   {q:[`Which assembly decided in 1809 to teach children prayers and sacraments?`,`കുട്ടികളെ പ്രാർത്ഥനകളും കൂദാശകളും പഠിപ്പിക്കാൻ 1809-ൽ തീരുമാനിച്ച യോഗം?`],
    a:[`The assembly of parish representatives at Kandanad church.`,`കണ്ടനാട് പള്ളിയിൽ കൂടിയ പള്ളിപ്രതിപുരുഷ യോഗം.`]},
   {q:[`Who was the first President of the reorganised OSSAE in 1964?`,`1964-ൽ പുനഃസംഘടിപ്പിച്ച OSSAE-യുടെ ആദ്യ പ്രസിഡന്റ്?`],
    a:[`Vayaliparambil Geevarghese Mar Gregorios.`,`വയലിപ്പറമ്പിൽ ഗീവർഗീസ് മാർ ഗ്രീഗോറിയോസ്.`]}
  ],
  indirect:[
   {q:[`Why did Robert Raikes start Sunday Schools?`,`റോബർട്ട് റെയ്ക്സ് സൺഡേസ്കൂൾ ആരംഭിച്ചത് എന്തുകൊണ്ട്?`],
    a:[`Children working six days in factories during the Industrial Revolution were free on Sundays and fell into crime and drugs; he gathered them and taught reading, writing, the Bible and prayers.`,`വ്യവസായ വിപ്ലവകാലത്ത് ആറു ദിവസം ഫാക്ടറികളിൽ പണിയെടുത്ത കുട്ടികൾ ഞായറാഴ്ച കുറ്റകൃത്യങ്ങളിലേക്കും ലഹരിയിലേക്കും വഴുതിവീണു; അദ്ദേഹം അവരെ ഒരുമിച്ചുകൂട്ടി എഴുത്തും വായനയും വേദപുസ്തകവും പ്രാർത്ഥനയും പഠിപ്പിച്ചു.`]},
   {q:[`Why is childhood the best time for Christian education?`,`ക്രിസ്തീയ വിദ്യാഭ്യാസത്തിന് ബാല്യകാലം ഏറ്റവും അനുയോജ്യമാകുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Foundations of personality, character, moral values and learning to love are laid in the "impressionable" years of childhood and adolescence.`,`വ്യക്തിത്വം, സ്വഭാവം, ധാർമ്മിക മൂല്യങ്ങൾ, സ്നേഹിക്കാൻ പഠിക്കൽ എന്നിവയുടെ അടിത്തറ ബാല്യത്തിലും കൗമാരത്തിലുമാണ് ഇടുന്നത്.`]}

 {
  id:`u5c4`, icon:`♾`,
  title:[`Christian Continuing Education`,`ക്രിസ്തീയ തുടർവിദ്യാഭ്യാസം`],
  points:[
   [`Education is life-long. Church organisations help us stay in faith after Sunday School: OVBS, Youth Movement, MGOCSM, Prayer Groups, Martha Mariam Samajam, Divya Bodhanam.`,
    `വിദ്യാഭ്യാസം ആജീവനാന്തമാണ്. സൺഡേസ്കൂളിനു ശേഷവും വിശ്വാസത്തിൽ നിലനിൽക്കാൻ സഭയുടെ പ്രസ്ഥാനങ്ങൾ സഹായിക്കുന്നു: OVBS, യുവജനപ്രസ്ഥാനം, MGOCSM, പ്രാർത്ഥനായോഗങ്ങൾ, മർത്തമറിയം സമാജം, ദിവ്യബോധനം.`],
   [`OVBS: VBS came to India in the 1950s; in 1977 the Synod renamed it Orthodox Vacation Bible School as a wing of OSSAE; first Director Fr. J. Varghese Kayamkulam. Classes in six units.`,
    `OVBS: 1950-കളിൽ VBS ഇന്ത്യയിലെത്തി; 1977-ൽ സുന്നഹദോസ് അതിനെ OSSAE-യുടെ ഭാഗമായി ഓർത്തഡോക്സ് വെക്കേഷൻ ബൈബിൾ സ്കൂൾ എന്നു പേരിട്ടു; ആദ്യ ഡയറക്ടർ ഫാ. ജെ. വർഗീസ് കായംകുളം. ആറ് യൂണിറ്റുകളായി ക്ലാസുകൾ.`],
   [`MGOCSM: started in 1908 in the name of St. Gregorios of Parumala, from Orthodox students in Madras colleges — worship, study, service. Head office: Kottayam Students' Centre.`,
    `MGOCSM: 1908-ൽ പരുമല മാർ ഗ്രീഗോറിയോസിന്റെ നാമത്തിൽ, മദ്രാസിലെ കോളേജുകളിലെ ഓർത്തഡോക്സ് വിദ്യാർത്ഥികളിൽ നിന്ന് ആരംഭിച്ചു — ആരാധന, പഠനം, സേവനം. ആസ്ഥാനം: കോട്ടയം സ്റ്റുഡന്റ്സ് സെന്റർ.`],
   [`Youth Movement (OCYM): organised in 1933 as "Syrian Yuvajana Sangham" — first President Puthenkavil Geevarghese Mar Philoxenos, secretary Fr. P. E. Daniel. Named OCYM at Puthuppally in 1958. Magazine: "Orthodox Yuvajanam".`,
    `യുവജനപ്രസ്ഥാനം (OCYM): 1933-ൽ "സിറിയൻ യുവജന സംഘം" ആയി — ആദ്യ പ്രസിഡന്റ് പുത്തൻകാവിൽ ഗീവർഗീസ് മാർ പീലക്സീനോസ്, സെക്രട്ടറി ഫാ. പി. ഇ. ദാനിയേൽ. 1958-ൽ പുതുപ്പള്ളിയിൽ OCYM എന്ന പേര്. മാസിക: "ഓർത്തഡോക്സ് യുവജനം".`],
   [`Martha Mariam Vanitha Samajam: founded 1928 (M. C. Kuriakose Ramban, K. M. Annamma). Motto: "Pray, work and shine".`,
    `മർത്തമറിയം വനിതാസമാജം: 1928-ൽ സ്ഥാപിച്ചു (എം. സി. കുര്യാക്കോസ് റമ്പാൻ, കെ. എം. അന്നമ്മ). ആപ്തവാക്യം: "പ്രാർത്ഥിക്കുക, പ്രവർത്തിക്കുക, പ്രകാശിക്കുക".`],
   [`Divya Bodhanam ("Sacred Teaching"): theological education for lay adults, begun in the closing decades of the 20th century with Dr. Paulose Mar Gregorios' support — certificate, diploma and degree courses.`,
    `ദിവ്യബോധനം: അൽമായർക്കുള്ള ദൈവശാസ്ത്ര പഠന പദ്ധതി; 20-ാം നൂറ്റാണ്ടിന്റെ അവസാന ദശകങ്ങളിൽ ഡോ. പൗലോസ് മാർ ഗ്രീഗോറിയോസിന്റെ പ്രോത്സാഹനത്തോടെ ആരംഭിച്ചു — സർട്ടിഫിക്കറ്റ്, ഡിപ്ലോമ, ഡിഗ്രി കോഴ്സുകൾ.`]

   {n:31, q:[`Select the INCORRECT year related to the formation of spiritual movements of the Malankara Church.`,`മലങ്കര സഭയുടെ ആദ്ധ്യാത്മിക പ്രസ്ഥാനങ്ങളുടെ രൂപീകരണ വർഷങ്ങളിൽ ശരിയല്ലാത്തത്?`],
    a:[`St. Joseph Elders Forum – 2020`,`സെന്റ് ജോസഫ് എൽഡേഴ്സ് ഫോറം – 2020`],
    why:[`MGOCSM 1908 and Youth Movement 1933 are in the textbook; Divya Bodhanam 1984 is accepted in the paper.`,`MGOCSM 1908, യുവജനപ്രസ്ഥാനം 1933 എന്നിവ പാഠപുസ്തകത്തിൽ; ദിവ്യബോധനം 1984 ചോദ്യപേപ്പർ ശരിയായി കണക്കാക്കുന്നു.`]},
   {q:[`When and in whose name was the MGOCSM started?`,`MGOCSM ആരംഭിച്ചത് എപ്പോൾ, ആരുടെ നാമത്തിൽ?`],
    a:[`In 1908, in the name of St. Gregorios of Parumala.`,`1908-ൽ, പരുമല മാർ ഗ്രീഗോറിയോസിന്റെ നാമത്തിൽ.`]},
   {q:[`Who was the first President of the Youth Movement (1933)?`,`യുവജനപ്രസ്ഥാനത്തിന്റെ (1933) ആദ്യ പ്രസിഡന്റ്?`],

   {q:[`What is the motto of the Martha Mariam Samajam? When was it founded?`,`മർത്തമറിയം സമാജത്തിന്റെ ആപ്തവാക്യം? സ്ഥാപിച്ച വർഷം?`],
    a:[`"Pray, work and shine" — founded in 1928.`,`"പ്രാർത്ഥിക്കുക, പ്രവർത്തിക്കുക, പ്രകാശിക്കുക" — 1928.`]},
   {q:[`When was OVBS made a wing of OSSAE, and who was its first Director?`,`OVBS, OSSAE-യുടെ ഭാഗമാക്കിയത് എപ്പോൾ? ആദ്യ ഡയറക്ടർ?`],
    a:[`In 1977; Fr. J. Varghese Kayamkulam.`,`1977-ൽ; ഫാ. ജെ. വർഗീസ് കായംകുളം.`]}
  ],
  indirect:[
   {q:[`How does each organisation keep young people in the Church after Sunday School?`,`സൺഡേസ്കൂളിനു ശേഷം യുവാക്കളെ സഭയിൽ നിലനിർത്താൻ ഈ പ്രസ്ഥാനങ്ങൾ എങ്ങനെ സഹായിക്കുന്നു?`],
    a:[`MGOCSM for students (worship, study, service); OCYM for youth (Bible study, arts, sports, service); Divya Bodhanam for adults (theology courses); OVBS reaches even children who rarely come to Sunday School.`,`വിദ്യാർത്ഥികൾക്ക് MGOCSM (ആരാധന, പഠനം, സേവനം); യുവാക്കൾക്ക് OCYM (വേദപഠനം, കല, കായികം, സേവനം); മുതിർന്നവർക്ക് ദിവ്യബോധനം (ദൈവശാസ്ത്ര കോഴ്സുകൾ); സൺഡേസ്കൂളിൽ വരാത്ത കുട്ടികളെയും OVBS എത്തിപ്പിടിക്കുന്നു.`]},
   {q:[`Why was Divya Bodhanam started?`,`ദിവ്യബോധനം ആരംഭിച്ചത് എന്തിന്?`],
    a:[`Because basic theological and biblical knowledge is needed not only by clergy but by all lay men and women.`,`അടിസ്ഥാന ദൈവശാസ്ത്ര-വേദപുസ്തക ജ്ഞാനം വൈദികർക്കു മാത്രമല്ല, എല്ലാ അൽമായർക്കും ആവശ്യമായതുകൊണ്ട്.`]}

BOOK1.push({
 id:`u6`, title:[`Environment, Science and Health`,`പരിസ്ഥിതി, ശാസ്ത്രം, ആരോഗ്യം`],
 chapters:[
 {
  id:`u6c1`, icon:`🌿`,
  title:[`Eco-Spirituality: Meaning and Significance`,`പാരിസ്ഥിതിക ആദ്ധ്യാത്മികത — അർത്ഥവും പ്രാധാന്യവും`],
  points:[
   [`Ecology studies the relationship between humans and nature. A disturbance in one part of a bio-chain affects the whole chain — like waste dumped in a lily pond that kills all life in it.`,
    `മനുഷ്യനും പ്രകൃതിയും തമ്മിലുള്ള ബന്ധം പഠിക്കുന്ന ശാസ്ത്രമാണ് പരിസ്ഥിതിശാസ്ത്രം. ഒരു ജൈവശൃംഖലയുടെ ഒരു ഭാഗത്തുണ്ടാകുന്ന തകരാറ് ശൃംഖല മുഴുവനെയും ബാധിക്കുന്നു — ആമ്പൽക്കുളത്തിൽ തള്ളുന്ന മാലിന്യം അതിലെ ജീവനെല്ലാം നശിപ്പിക്കുന്നതുപോലെ.`],
   [`Problems: ozone depletion, global warming, acid rain, groundwater depletion, deforestation, loss of species. Science says the root cause is the unjustified exploitation of nature — so it is also a moral and spiritual problem.`,
    `പ്രശ്നങ്ങൾ: ഓസോൺ ശോഷണം, ആഗോളതാപനം, അമ്ലമഴ, ഭൂഗർഭജല ശോഷണം, വനനശീകരണം, ജീവിവർഗ്ഗങ്ങളുടെ നാശം. പ്രകൃതിയുടെ ന്യായീകരണമില്ലാത്ത ചൂഷണമാണ് അടിസ്ഥാന കാരണം — അതിനാൽ ഇത് ധാർമ്മികവും ആത്മീയവുമായ പ്രശ്നം കൂടിയാണ്.`],
   [`"The Lord God put the man in the garden to work it and take care of it" (Gen 2:15). "Adam" means "taken from the earth" (Gen 2:7). "Rule" (Gen 1:28) means caring, merciful governance — not exploitation.`,
    `"ഏദെൻതോട്ടത്തിൽ വേല ചെയ്യുവാനും അതിനെ കാക്കുവാനും ദൈവം മനുഷ്യനെ ആക്കി" (ഉൽപ. 2:15). "ആദം" = "മണ്ണിൽ നിന്ന് എടുത്തവൻ" (ഉൽപ. 2:7). "വാഴുക" (ഉൽപ. 1:28) = കരുണയോടെയുള്ള ഭരണം — ചൂഷണമല്ല.`],
   [`Noah's ark and the rainbow show God cares for all creatures; the rainbow-shaped arch of the Madbaha door shows God's grace. Psalms 8, 104, 148; Job 38–39; Leviticus 25.`,
    `നോഹയുടെ പെട്ടകവും മഴവില്ലും ദൈവം എല്ലാ സൃഷ്ടികളെയും കരുതുന്നു എന്നു കാണിക്കുന്നു; മദ്ബഹായുടെ വാതിലിന്റെ മഴവിൽ ആകൃതി ദൈവകൃപയുടെ അടയാളം. സങ്കീ. 8, 104, 148; ഇയ്യോബ് 38–39; ലേവ്യ 25.`],
   [`Christ's salvation is for the whole creation, not humans alone (Romans 8:18–25; Colossians 1:15–23). Eastern Fathers (Athanasius, Basil, Gregory Nazianzen) saw salvation as the liberation of all creation.`,
    `ക്രിസ്തുവിന്റെ രക്ഷ മനുഷ്യനു മാത്രമല്ല, സർവ്വസൃഷ്ടിക്കുമാണ് (റോമർ 8:18–25; കൊലൊസ്സ്യർ 1:15–23). പൗരസ്ത്യ പിതാക്കന്മാർ (അത്താനാസിയോസ്, ബസേലിയോസ്, നാസിയാൻസിലെ ഗ്രീഗോറിയോസ്) രക്ഷയെ സർവ്വസൃഷ്ടിയുടെയും വിമോചനമായി കണ്ടു.`],
   [`Eastern view: humans are one creature among many, placed as priests and mediators between God and the universe. The universe is a sacrament, not a consumer product. World Environment Day: June 5.`,
    `പൗരസ്ത്യ വീക്ഷണം: മനുഷ്യൻ അനേകം സൃഷ്ടികളിൽ ഒന്നാണ്; ദൈവത്തിനും പ്രപഞ്ചത്തിനും ഇടയിൽ പുരോഹിതനും മധ്യസ്ഥനുമായി നിയമിക്കപ്പെട്ടിരിക്കുന്നു. പ്രപഞ്ചം ഒരു കൂദാശയാണ്, ഉപഭോഗവസ്തുവല്ല. ലോക പരിസ്ഥിതി ദിനം: ജൂൺ 5.`]
  ],
  direct:[
   {n:32, q:[`Choose the most appropriate main cause of the environmental crisis.`,`പാരിസ്ഥിതിക പ്രതിസന്ധിക്ക് പ്രധാന കാരണമായി ഏറ്റവും അനുയോജ്യമായ ഉത്തരം?`],
    a:[`Human's unjust interference with nature`,`പ്രകൃതിക്കു നേരെ മനുഷ്യന്റെ അന്യായ ഇടപെടൽ`],
    why:[`Industrialisation and waste are results; the root cause is human exploitation of nature.`,`വ്യവസായവൽക്കരണവും മാലിന്യവും ഫലങ്ങളാണ്; അടിസ്ഥാന കാരണം മനുഷ്യന്റെ പ്രകൃതിചൂഷണം.`]},
   {n:33, q:[`The meaning of the word "Adam".`,`"ആദം" എന്ന വാക്കിന്റെ അർത്ഥം?`],
    a:[`One taken from the ground`,`മണ്ണിൽ നിന്നും എടുത്തവൻ`],
    why:[`Genesis 2:7 — a pointer to the bond between humans and nature.`,`ഉൽപത്തി 2:7 — മനുഷ്യനും പ്രകൃതിയും തമ്മിലുള്ള ബന്ധത്തിന്റെ സൂചന.`]},
   {n:34, q:[`The most appropriate statement about the ultimate goal of Christ's work of salvation.`,`ക്രിസ്തുവിന്റെ രക്ഷാപ്രവർത്തനത്തിന്റെ പരമലക്ഷ്യം?`],
    a:[`To restore all creation`,`സർവ്വ സൃഷ്ടികളെയും യഥാസ്ഥാനപ്പെടുത്തുക`],
    why:[`Romans 8:18–25; Colossians 1:15–23 — Christ reconciles all creation with God.`,`റോമർ 8:18–25; കൊലൊസ്സ്യർ 1:15–23 — ക്രിസ്തു സർവ്വസൃഷ്ടിയെയും ദൈവത്തോട് നിരപ്പിക്കുന്നു.`]},
   {q:[`What is ecology?`,`പരിസ്ഥിതിശാസ്ത്രം (ഇക്കോളജി) എന്നാൽ എന്ത്?`],
    a:[`The branch of science that studies the relationship between humans and nature.`,`മനുഷ്യനും പ്രകൃതിയും തമ്മിലുള്ള ബന്ധം പഠിക്കുന്ന ശാസ്ത്രശാഖ.`]},
   {q:[`What does the arch of the Madbaha door resemble and signify?`,`മദ്ബഹായുടെ വാതിലിന്റെ ആകൃതി എന്തിനെ സൂചിപ്പിക്കുന്നു?`],
    a:[`The rainbow — God's grace and mercy.`,`മഴവില്ലിനെ — ദൈവത്തിന്റെ കൃപയും കരുണയും.`]},
   {q:[`When is World Environment Day?`,`ലോക പരിസ്ഥിതി ദിനം എന്ന്?`],
    a:[`June 5.`,`ജൂൺ 5.`]}
  ],
  indirect:[
   {q:[`What is the real meaning of "rule" in Genesis 1:28?`,`ഉൽപത്തി 1:28-ലെ "വാഴുക" എന്നതിന്റെ യഥാർത്ഥ അർത്ഥം?`],
    a:[`Governance filled with mercy and care that brings abundance and peace — a responsibility, not a licence to exploit.`,`കരുണയും കരുതലും നിറഞ്ഞ, സമൃദ്ധിയും സമാധാനവും കൊണ്ടുവരുന്ന ഭരണം — ചൂഷണത്തിനുള്ള അനുവാദമല്ല, ഉത്തരവാദിത്വമാണ്.`]},
   {q:[`Why do we say humans are "priests of creation"?`,`മനുഷ്യൻ "സൃഷ്ടിയുടെ പുരോഹിതൻ" ആണെന്നു പറയുന്നത് എന്തുകൊണ്ട്?`],
    a:[`If the universe is a sacrament, humans stand between God and the universe as mediators — to care for creation, help it grow to fullness, and offer it to God.`,`പ്രപഞ്ചം ഒരു കൂദാശയെങ്കിൽ, മനുഷ്യൻ ദൈവത്തിനും പ്രപഞ്ചത്തിനും ഇടയിലെ മധ്യസ്ഥനാണ് — സൃഷ്ടിയെ കരുതി, പൂർണ്ണതയിലേക്കു വളർത്തി, ദൈവത്തിനു സമർപ്പിക്കാൻ.`]},
   {q:[`How does the Western view of salvation differ from the Eastern view in this lesson?`,`രക്ഷയെക്കുറിച്ച് പാശ്ചാത്യ, പൗരസ്ത്യ വീക്ഷണങ്ങൾ തമ്മിലുള്ള വ്യത്യാസം (ഈ പാഠം അനുസരിച്ച്)?`],
    a:[`The West stressed individual salvation; the Eastern Fathers saw salvation as the liberation of the entire creation.`,`പാശ്ചാത്യ സഭ വ്യക്തിഗത രക്ഷയ്ക്ക് ഊന്നൽ നൽകി; പൗരസ്ത്യ പിതാക്കന്മാർ രക്ഷയെ സർവ്വസൃഷ്ടിയുടെയും വിമോചനമായി കണ്ടു.`]}
  ]

 {
  id:`u6c2`, icon:`💻`,
  title:[`Information Technology: Problems and Prospects`,`ഇൻഫർമേഷൻ ടെക്നോളജി — സാധ്യതകൾക്കൊപ്പം പ്രശ്നങ്ങളും`],
  points:[
   [`IT = collecting data with computers, storing and processing it for use. It has made the world a "global village".`,
    `കമ്പ്യൂട്ടറുകളുടെ സഹായത്തോടെ വിവരങ്ങൾ ശേഖരിച്ച് സൂക്ഷിച്ച് ആവശ്യാനുസരണം ഉപയോഗിക്കുന്നതാണ് ഐ.ടി. ലോകത്തെ ഒരു "ആഗോള ഗ്രാമം" ആക്കി.`],
   [`Uses: communication, travel bookings, banking (ATM, net banking), bill payments, information and education (online libraries, courses, exams), health care, e-governance, Bible references.`,
    `ഉപയോഗങ്ങൾ: ആശയവിനിമയം, യാത്രാ ബുക്കിംഗ്, ബാങ്കിംഗ് (എടിഎം, നെറ്റ് ബാങ്കിംഗ്), ബിൽ അടയ്ക്കൽ, വിവരശേഖരണവും വിദ്യാഭ്യാസവും (ഓൺലൈൻ ലൈബ്രറി, കോഴ്സുകൾ, പരീക്ഷകൾ), ആരോഗ്യരംഗം, ഇ-ഗവേണൻസ്, വേദപുസ്തക റഫറൻസുകൾ.`],
   [`Misuse: viruses, hacking bank passwords, fake lottery e-mails, obscene websites, fake travel sites, fake profiles and blackmail, film piracy, morphing of photos (even leading to suicides), hate messages.`,
    `ദുരുപയോഗം: വൈറസ്, ബാങ്ക് പാസ്‌വേഡ് ഹാക്കിംഗ്, വ്യാജ ലോട്ടറി ഇ-മെയിലുകൾ, അശ്ലീല വെബ്സൈറ്റുകൾ, വ്യാജ യാത്രാ സൈറ്റുകൾ, വ്യാജ പ്രൊഫൈലുകളും ഭീഷണിപ്പെടുത്തലും, സിനിമാ പൈറസി, ഫോട്ടോ മോർഫിങ് (ആത്മഹത്യകൾക്കു വരെ കാരണമായി), വിദ്വേഷ സന്ദേശങ്ങൾ.`],
   [`Overuse of games and social networks makes many good students lag behind. We must use IT's positives wisely and stay alert to its dangers.`,
    `ഗെയിമുകളുടെയും സോഷ്യൽ നെറ്റ്‌വർക്കുകളുടെയും അമിത ഉപയോഗം പല നല്ല വിദ്യാർത്ഥികളെയും പിന്നോട്ടാക്കുന്നു. ഐ.ടി.യുടെ നല്ല വശങ്ങൾ വിവേകത്തോടെ ഉപയോഗിക്കുകയും അപകടങ്ങൾക്കെതിരെ ജാഗ്രത പാലിക്കുകയും വേണം.`],
   [`Today's frauds also include "digital arrest" — fraudsters pose as police on a video call and demand money. Real police never arrest anyone by video call; never share OTPs or passwords.`,
    `ഇന്നത്തെ തട്ടിപ്പുകളിൽ "ഡിജിറ്റൽ അറസ്റ്റ്" ഉം ഉണ്ട് — പോലീസ് എന്ന വ്യാജേന വീഡിയോ കോളിൽ പണം ആവശ്യപ്പെടുന്നു. യഥാർത്ഥ പോലീസ് വീഡിയോ കോളിലൂടെ ആരെയും അറസ്റ്റ് ചെയ്യില്ല; OTP-യും പാസ്‌വേഡും ആരുമായും പങ്കിടരുത്.`]
  ],
  direct:[
   {n:36, q:[`Choose the most appropriate answer about what to be careful of in the field of IT.`,`ഇൻഫർമേഷൻ ടെക്നോളജി മേഖലയിൽ ശ്രദ്ധിക്കേണ്ട കാര്യങ്ങളിൽ ഏറ്റവും അനുയോജ്യമായ ഉത്തരം?`],
    a:[`All answers are correct (digital-arrest extortion, fake websites, morphing)`,`എല്ലാ ഉത്തരങ്ങളും ശരിയാണ് (ഡിജിറ്റൽ അറസ്റ്റ് തട്ടിപ്പ്, വ്യാജ വെബ്സൈറ്റുകൾ, മോർഫിങ്)`]},
   {n:37, q:[`Choose the most useful application of IT in the academic field.`,`അക്കാദമിക് രംഗത്ത് ഐ.ടി. ഏറ്റവും പ്രയോജനപ്പെടുന്നത്?`],
    a:[`All answers are correct (academic websites, online courses, smart classrooms)`,`എല്ലാ ഉത്തരങ്ങളും ശരിയാണ് (അക്കാദമിക് വെബ്സൈറ്റുകൾ, ഓൺലൈൻ കോഴ്സുകൾ, സ്മാർട്ട് ക്ലാസ്റൂം)`]},
   {q:[`What is Information Technology?`,`ഇൻഫർമേഷൻ ടെക്നോളജി എന്നാൽ എന്ത്?`],
    a:[`Collecting data with the help of computers and storing it to be processed and used when needed.`,`കമ്പ്യൂട്ടറുകളുടെ സഹായത്തോടെ വിവരങ്ങൾ ശേഖരിച്ച് സൂക്ഷിച്ച് ആവശ്യമുള്ളപ്പോൾ പ്രോസസ്സ് ചെയ്ത് ഉപയോഗിക്കുന്നത്.`]},
   {q:[`What is "morphing"?`,`"മോർഫിങ്" എന്നാൽ എന്ത്?`],
    a:[`Digitally altering someone's photo to create a fake, often harmful, image.`,`ഒരാളുടെ ഫോട്ടോ ഡിജിറ്റലായി മാറ്റം വരുത്തി വ്യാജവും പലപ്പോഴും ദോഷകരവുമായ ചിത്രം ഉണ്ടാക്കുന്നത്.`]}
  ],
  indirect:[
   {q:[`How can the Church use IT for its mission?`,`സഭയ്ക്ക് തന്റെ ദൗത്യത്തിനായി ഐ.ടി. എങ്ങനെ ഉപയോഗിക്കാം?`],
    a:[`Websites, online Sunday School and exams, live-streamed worship, quick Bible references, spreading good spiritual content, and raising funds for charity.`,`വെബ്സൈറ്റുകൾ, ഓൺലൈൻ സൺഡേസ്കൂളും പരീക്ഷകളും, ആരാധനയുടെ തത്സമയ സംപ്രേഷണം, വേദപുസ്തക റഫറൻസുകൾ, നല്ല ആത്മീയ ഉള്ളടക്കം പ്രചരിപ്പിക്കൽ, ജീവകാരുണ്യത്തിനായി ധനസമാഹരണം.`]},
   {q:[`Why can relationships formed only on social networks be harmful?`,`സോഷ്യൽ നെറ്റ്‌വർക്കുകളിലൂടെ മാത്രം രൂപപ്പെടുന്ന ബന്ധങ്ങൾ ദോഷകരമാകുന്നത് എന്തുകൊണ്ട്?`],
    a:[`They can alienate people from the mainstream of society and expose them to fake profiles, blackmail and cheating.`,`അവ ആളുകളെ സമൂഹത്തിന്റെ മുഖ്യധാരയിൽ നിന്ന് അകറ്റുകയും വ്യാജ പ്രൊഫൈലുകൾ, ഭീഷണി, വഞ്ചന എന്നിവയ്ക്ക് ഇരയാക്കുകയും ചെയ്യാം.`]}
  ]

 {
  id:`u6c3`, icon:`🔬`,
  title:[`Science and Technology`,`ശാസ്ത്രവും സാങ്കേതികവിദ്യയും`],
  points:[
   [`Science and technology help in the household, communication, knowledge (digital libraries, smart classrooms), space travel, medicine, banking, agriculture and more.`,
    `ശാസ്ത്രവും സാങ്കേതികവിദ്യയും വീട്ടുജോലി, ആശയവിനിമയം, അറിവ് (ഡിജിറ്റൽ ലൈബ്രറി, സ്മാർട്ട് ക്ലാസ്റൂം), ബഹിരാകാശ യാത്ര, ചികിത്സ, ബാങ്കിംഗ്, കൃഷി തുടങ്ങിയ മേഖലകളിൽ സഹായിക്കുന്നു.`],
   [`Negatives (7): consumer society; "use and throw" culture; simple lifestyle and prayer life give way; God-given intelligence under-used (memory, calculation); less physical exercise; weaker social relations; declining faith in God.`,
    `ദോഷവശങ്ങൾ (7): ഉപഭോഗ സംസ്കാരം; "ഉപയോഗിച്ച് വലിച്ചെറിയൽ" സംസ്കാരം; ലളിതജീവിതവും പ്രാർത്ഥനാജീവിതവും നഷ്ടപ്പെടുന്നു; ദൈവദത്തമായ ബുദ്ധി ഉപയോഗിക്കാതെ പോകുന്നു (ഓർമ്മ, കണക്കുകൂട്ടൽ); വ്യായാമക്കുറവ്; സാമൂഹിക ബന്ധങ്ങൾ ദുർബലമാകുന്നു; ദൈവവിശ്വാസം കുറയുന്നു.`],
   [`Technology can never replace faith in God. Used for God's purposes, science can build a society rich in love and goodness.`,
    `സാങ്കേതികവിദ്യയ്ക്ക് ഒരിക്കലും ദൈവവിശ്വാസത്തിനു പകരമാകാൻ കഴിയില്ല. ദൈവോദ്ദേശ്യത്തിനായി ഉപയോഗിച്ചാൽ ശാസ്ത്രത്തിന് സ്നേഹവും നന്മയും നിറഞ്ഞ സമൂഹം കെട്ടിപ്പടുക്കാം.`],
   [`Artificial Intelligence (from the 2025 exam): use AI as an assistant to human work — not to replace humans or our own thinking.`,
    `നിർമ്മിതബുദ്ധി (2025 പരീക്ഷയിൽ നിന്ന്): AI-യെ മനുഷ്യന്റെ പ്രവർത്തനങ്ങൾക്ക് ഒരു സഹായിയായി ഉപയോഗിക്കുക — മനുഷ്യനെയോ നമ്മുടെ ചിന്തയെയോ മാറ്റിനിർത്താനല്ല.`]
  ],
  direct:[
   {n:35, q:[`Which statement best describes the effective use of artificial intelligence?`,`ആർട്ടിഫിഷ്യൽ ഇന്റലിജൻസിനെ ഫലപ്രദമായി ഉപയോഗിക്കുവാൻ ഏറ്റവും യോജിക്കുന്ന പ്രസ്താവന?`],
    a:[`Do not replace humans; consider AI as an assistant to human activities`,`മനുഷ്യനെ മാറ്റിനിർത്തുകയല്ല, മറിച്ച് മനുഷ്യന്റെ പ്രവർത്തനങ്ങൾക്ക് ഒരു സഹായിയായി AI-യെ പരിഗണിക്കുക`],
    why:[`This lesson warns that over-reliance on technology leaves our God-given intelligence unused.`,`സാങ്കേതികവിദ്യയെ അമിതമായി ആശ്രയിക്കുന്നത് ദൈവദത്തമായ ബുദ്ധി ഉപയോഗിക്കാതെ പോകാൻ കാരണമാകുമെന്ന് ഈ പാഠം മുന്നറിയിപ്പ് നൽകുന്നു.`]},
   {q:[`What is meant by "use and throw" culture?`,`"ഉപയോഗിച്ച് വലിച്ചെറിയൽ" സംസ്കാരം എന്നാൽ എന്ത്?`],
    a:[`Using things briefly and discarding them for new fashionable products — even household goods — which can also cause financial problems.`,`വസ്തുക്കൾ കുറച്ചുകാലം ഉപയോഗിച്ച് പുതിയ ഫാഷൻ ഉൽപ്പന്നങ്ങൾക്കായി വലിച്ചെറിയുന്നത് — സാമ്പത്തിക പ്രശ്നങ്ങൾക്കും കാരണമാകുന്നു.`]},
   {q:[`Give one example of God-given intelligence being under-used because of technology.`,`സാങ്കേതികവിദ്യ കാരണം ദൈവദത്തമായ ബുദ്ധി ഉപയോഗിക്കാതെ പോകുന്നതിന് ഒരു ഉദാഹരണം?`],
    a:[`We no longer remember phone numbers, and use calculators even for simple sums.`,`ഫോൺ നമ്പറുകൾ ഓർക്കാതിരിക്കുന്നു; ലളിതമായ കണക്കുകൾക്കു പോലും കാൽക്കുലേറ്റർ ഉപയോഗിക്കുന്നു.`]}
  ],
  indirect:[
   {q:[`How does technology affect spiritual life?`,`സാങ്കേതികവിദ്യ ആത്മീയ ജീവിതത്തെ എങ്ങനെ ബാധിക്കുന്നു?`],
    a:[`More time before TV and computers leaves little time for family prayer; reliance on science and self can weaken faith in God.`,`ടിവിക്കും കമ്പ്യൂട്ടറിനും മുമ്പിൽ കൂടുതൽ സമയം ചെലവഴിക്കുന്നതുകൊണ്ട് കുടുംബപ്രാർത്ഥനയ്ക്ക് സമയമില്ലാതാകുന്നു; ശാസ്ത്രത്തെയും തന്നെത്തന്നെയും ആശ്രയിക്കുന്നത് ദൈവവിശ്വാസം ദുർബലമാക്കുന്നു.`]},
   {q:[`Give one good way and one wrong way to use AI for studies.`,`പഠനത്തിനായി AI ഉപയോഗിക്കുന്നതിന്റെ ഒരു നല്ല രീതിയും ഒരു തെറ്റായ രീതിയും?`],
    a:[`Good: asking it to explain a topic you don't understand. Wrong: copying its answers without thinking or learning.`,`നല്ലത്: മനസ്സിലാകാത്ത വിഷയം വിശദീകരിക്കാൻ ചോദിക്കുന്നത്. തെറ്റ്: ചിന്തിക്കാതെയും പഠിക്കാതെയും ഉത്തരങ്ങൾ പകർത്തുന്നത്.`]}
  ]
 },
 {
  id:`u6c4`, icon:`🛡`,
  title:[`Drug Abuse and the Threat to Healthy Living`,`ആരോഗ്യസംരക്ഷണവും മദ്യം-മയക്കുമരുന്ന് ദുരുപയോഗവും`],
  points:[
   [`Health = a healthy mind and a healthy body — physical, mental, social and spiritual health. Smoking, drinking and drugs usually begin in adolescence through bad friends and media.`,
    `ആരോഗ്യം = ആരോഗ്യമുള്ള മനസ്സും ശരീരവും — ശാരീരിക, മാനസിക, സാമൂഹിക, ആത്മീയ ആരോഗ്യം. പുകവലി, മദ്യപാനം, മയക്കുമരുന്ന് എന്നിവ സാധാരണയായി കൗമാരത്തിൽ മോശം കൂട്ടുകെട്ടിലൂടെയും മാധ്യമങ്ങളിലൂടെയും ആരംഭിക്കുന്നു.`],
   [`Causes: wanting to look adult, fashion, escaping personal problems, seeking thrill, peer pressure, grief, wrong belief that alcohol gives strength, parties and celebrations.`,
    `കാരണങ്ങൾ: മുതിർന്നവരാണെന്നു കാണിക്കാനുള്ള ആഗ്രഹം, ഫാഷൻ, വ്യക്തിപരമായ പ്രശ്നങ്ങളിൽ നിന്നുള്ള ഒളിച്ചോട്ടം, ത്രില്ല്, കൂട്ടുകാരുടെ സമ്മർദ്ദം, ദുഃഖം, മദ്യം ശക്തി നൽകുമെന്ന തെറ്റിദ്ധാരണ, പാർട്ടികളും ആഘോഷങ്ങളും.`],
   [`Effects: liver disease, cancer, poverty, crime, broken families, lost purpose, suicide, loss of faith and prayer life, HIV through shared syringes, failure in studies.`,
    `ഫലങ്ങൾ: കരൾരോഗം, കാൻസർ, ദാരിദ്ര്യം, കുറ്റകൃത്യം, തകരുന്ന കുടുംബങ്ങൾ, ജീവിതലക്ഷ്യം നഷ്ടപ്പെടൽ, ആത്മഹത്യ, വിശ്വാസവും പ്രാർത്ഥനാജീവിതവും നഷ്ടപ്പെടൽ, സിറിഞ്ച് പങ്കിടുന്നതിലൂടെ എച്ച്.ഐ.വി., പഠനത്തിൽ പരാജയം.`],
   [`Remedy: treat it as an illness — de-addiction centres, Alcoholics Anonymous meetings, the person's own firm decision. Report drug trade to the police. Choose friends carefully; prevention is better than cure.`,
    `പരിഹാരം: ഒരു രോഗമായി കണ്ട് ചികിത്സിക്കുക — ലഹരിമുക്തി കേന്ദ്രങ്ങൾ, ആൽക്കഹോളിക്സ് അനോനിമസ് യോഗങ്ങൾ, വ്യക്തിയുടെ സ്വന്തം ഉറച്ച തീരുമാനം. മയക്കുമരുന്ന് കച്ചവടം പോലീസിനെ അറിയിക്കുക. കൂട്ടുകാരെ ശ്രദ്ധിച്ചു തെരഞ്ഞെടുക്കുക; ചികിത്സയെക്കാൾ നല്ലത് പ്രതിരോധം.`],
   [`Bible: Noah's drunkenness (Genesis 9:21–23); "drunkards will not inherit the Kingdom of God" (1 Corinthians 6:10). Sugathakumari compared drugs to a cruel devil that makes you a slave.`,
    `വേദപുസ്തകം: നോഹയുടെ ലഹരി (ഉൽപത്തി 9:21–23); "മദ്യപന്മാർ ദൈവരാജ്യം അവകാശമാക്കുകയില്ല" (1 കൊരിന്ത്യർ 6:10). ലഹരിയെ അടിമയാക്കുന്ന ക്രൂരപിശാചിനോട് സുഗതകുമാരി ഉപമിച്ചു.`]
  ],
  direct:[
   {n:38, q:[`How can you help teenagers who are addicted to drugs?`,`കൗമാരപ്രായത്തിൽ മയക്കുമരുന്ന് ഉപയോഗത്തിൽ അകപ്പെടുന്നവരെ എങ്ങനെ സഹായിക്കാം?`],
    a:[`All answers are correct`,`എല്ലാ ഉത്തരങ്ങളും ശരിയാണ്`],
    why:[`Leaving bad friends, making good decisions and attending support meetings all help. ("AI meetings" in the paper means AA — Alcoholics Anonymous — as in the textbook.)`,`തെറ്റായ സൗഹൃദം ഉപേക്ഷിക്കൽ, നല്ല തീരുമാനങ്ങൾ, പിന്തുണാ യോഗങ്ങൾ — എല്ലാം സഹായിക്കും. (ചോദ്യത്തിലെ "AI മീറ്റിങ്" പാഠപുസ്തകത്തിലെ AA — ആൽക്കഹോളിക്സ് അനോനിമസ് — ആണ്.)`]},
   {q:[`Which Bible verse warns that drunkards will not inherit the Kingdom of God?`,`മദ്യപന്മാർ ദൈവരാജ്യം അവകാശമാക്കുകയില്ല എന്നു മുന്നറിയിപ്പു നൽകുന്ന വാക്യം?`],
    a:[`1 Corinthians 6:10.`,`1 കൊരിന്ത്യർ 6:10.`]},
   {q:[`Which Bible passage shows the consequences of Noah's drunkenness?`,`നോഹയുടെ ലഹരിയുടെ ഫലങ്ങൾ കാണിക്കുന്ന വേദഭാഗം?`],
    a:[`Genesis 9:21–23.`,`ഉൽപത്തി 9:21–23.`]},
   {q:[`What are the four aspects of health?`,`ആരോഗ്യത്തിന്റെ നാലു തലങ്ങൾ?`],
    a:[`Physical, mental, community (social) and spiritual health.`,`ശാരീരികം, മാനസികം, സാമൂഹികം, ആത്മീയം.`]}
  ],
  indirect:[
   {q:[`Why is peer pressure dangerous for teenagers?`,`കൗമാരക്കാർക്ക് കൂട്ടുകാരുടെ സമ്മർദ്ദം അപകടകരമാകുന്നത് എന്തുകൊണ്ട്?`],
    a:[`To avoid looking "small" or being left out, many accept their first smoke or drink — which leads to addiction.`,`"ചെറുതായി" കാണപ്പെടാതിരിക്കാനോ ഒറ്റപ്പെടാതിരിക്കാനോ പലരും ആദ്യത്തെ പുകയോ മദ്യമോ സ്വീകരിക്കുന്നു — അത് അടിമത്തത്തിലേക്കു നയിക്കുന്നു.`]},
   {q:[`If a senior offers you drugs, what should you do?`,`ഒരു മുതിർന്ന വിദ്യാർത്ഥി നിനക്ക് മയക്കുമരുന്ന് നൽകിയാൽ എന്തു ചെയ്യണം?`],
    a:[`Refuse firmly, avoid that company, and tell parents and teachers immediately; drug trade should be reported to the police.`,`ഉറച്ചു നിരസിക്കുക, ആ കൂട്ടുകെട്ട് ഒഴിവാക്കുക, ഉടനെ മാതാപിതാക്കളെയും അധ്യാപകരെയും അറിയിക്കുക; മയക്കുമരുന്ന് കച്ചവടം പോലീസിനെ അറിയിക്കണം.`]}

 {

  points:[
   [`Three forms of prayer: common prayers, communal prayers (with the congregation, led by the celebrant), and private meditative prayers (e.g. the Pampakuda Namaskaram).`,
    `മൂന്നു തരം പ്രാർത്ഥനകൾ: സാധാരണ (ശ്ഹീമാ) പ്രാർത്ഥനകൾ, സമൂഹപ്രാർത്ഥനകൾ (കാർമ്മികന്റെ നേതൃത്വത്തിൽ സഭയോടൊപ്പം), സ്വകാര്യ ധ്യാനപ്രാർത്ഥനകൾ (ഉദാ: പാമ്പാക്കുട നമസ്കാരം).`],
   [`Common prayers are called "Sh'himo" prayers; the book is the Sh'himo Namaskaram — seven offices for each day of the week. The day begins in the evening (Genesis 1:5).`,

   [`Prayers to memorise: Prayer of Mar Severios; Praise of the Cherubim; Prayer to the Holy Trinity; Angelic Hymn; Maneesa of Mar Severios; the Creed.`,
    `ഹൃദിസ്ഥമാക്കേണ്ട പ്രാർത്ഥനകൾ: മാർ സേവേറിയോസിന്റെ അപേക്ഷ; ക്രോബേന്മാരുടെ സ്തുതിപ്പ്; ത്രിത്വത്തോടുള്ള അപേക്ഷ; മാലാഖമാരുടെ സ്തുതിപ്പ്; മാർ സേവേറിയോസിന്റെ മാനീസാ; വിശ്വാസപ്രമാണം.`],
   [`Morning praise (Psalm 92:1–2): it is good to give thanks to the Lord… to declare His grace (lovingkindness) in the morning and His faithfulness at night.`,
