  ],
  direct:[
   {n:49, q:[`Fill in the morning hymn: "It is good to give thanks to the Lord… to make known His ______ in the morning and His ______ at night."`,`പ്രഭാത സ്തുതിപ്പിലെ വിട്ടുപോയ ഭാഗം: "…പ്രഭാതകാലത്ത് തന്റെ ______ രാത്രികാലത്ത് തന്റെ ______ അറിയിക്കുന്നതും നല്ലതാകുന്നു."`],
    a:[`Grace and faith(fulness)`,`കൃപയും, വിശ്വാസവും (വിശ്വസ്തതയും)`],
    why:[`Psalm 92:2.`,`സങ്കീർത്തനം 92:2.`]},
   {q:[`What are common prayers called in Syriac tradition?`,`സുറിയാനി പാരമ്പര്യത്തിൽ സാധാരണ പ്രാർത്ഥനകളെ എന്തു വിളിക്കുന്നു?`],
    a:[`Sh'himo (common) prayers.`,`ശ്ഹീമോ (സാധാരണ) പ്രാർത്ഥനകൾ.`]},
   {q:[`Which verse shows that the day begins in the evening?`,`ദിവസം സന്ധ്യയോടെ ആരംഭിക്കുന്നു എന്നു കാണിക്കുന്ന വാക്യം?`],
    a:[`Genesis 1:5 — "And there was evening and there was morning, the first day."`,`ഉൽപത്തി 1:5 — "സന്ധ്യയായി ഉഷസ്സുമായി; ഒന്നാം ദിവസം."`]},
   {q:[`At what time is Ramsho (evening prayer) observed?`,`റംശോ (സന്ധ്യാനമസ്കാരം) ഏതു സമയത്താണ്?`],
    a:[`6 p.m.`,`വൈകിട്ട് 6 മണിക്ക്.`]},
   {q:[`Which prayer book contains many private meditative prayers?`,`അനേകം സ്വകാര്യ ധ്യാനപ്രാർത്ഥനകൾ അടങ്ങിയ പ്രാർത്ഥനാഗ്രന്ഥം?`],
    a:[`The Pampakuda Namaskaram.`,`പാമ്പാക്കുട നമസ്കാരം.`]}
  ],
  indirect:[
   {q:[`What is the difference between communal and private meditative prayer?`,`സമൂഹപ്രാർത്ഥനയും സ്വകാര്യ ധ്യാനപ്രാർത്ഥനയും തമ്മിലുള്ള വ്യത്യാസം?`],
    a:[`Communal prayer is with the congregation, led by the celebrant with responses and hymns; private meditative prayer is for one's own spiritual growth.`,`സമൂഹപ്രാർത്ഥന കാർമ്മികന്റെ നേതൃത്വത്തിൽ പ്രതിവാക്യങ്ങളോടും ഗീതങ്ങളോടും കൂടി സഭയോടൊപ്പം; സ്വകാര്യ ധ്യാനപ്രാർത്ഥന വ്യക്തിയുടെ ആത്മീയ വളർച്ചയ്ക്കായി.`]},
   {q:[`Name the six prayers of this lesson.`,`ഈ പാഠത്തിലെ ആറു പ്രാർത്ഥനകളുടെ പേരെഴുതുക.`],
    a:[`Prayer of Mar Severios, Praise of the Cherubim, Prayer to the Holy Trinity, Angelic Hymn, Maneesa of Mar Severios, the Creed.`,`മാർ സേവേറിയോസിന്റെ അപേക്ഷ, ക്രോബേന്മാരുടെ സ്തുതിപ്പ്, ത്രിത്വത്തോടുള്ള അപേക്ഷ, മാലാഖമാരുടെ സ്തുതിപ്പ്, മാർ സേവേറിയോസിന്റെ മാനീസാ, വിശ്വാസപ്രമാണം.`]}
  ]
 },
 {
  id:`u7c2`, icon:`☩`,
  title:[`Trinitarian Prayers in the Holy Qurbana`,`വി. കുർബ്ബാനയിലെ ത്രിത്വ പ്രാർത്ഥനകൾ`],
  points:[
   [`Most prayers of the Qurbana are addressed to the Holy Trinity and end with the doxology "Glory to the Father, the Son and the Holy Spirit" (Shubaho…).`,
    `കുർബ്ബാനയിലെ മിക്ക പ്രാർത്ഥനകളും പരിശുദ്ധ ത്രിത്വത്തെ സംബോധന ചെയ്യുന്നു; "പിതാവിനും പുത്രനും പരിശുദ്ധറൂഹായ്ക്കും സ്തുതി" (ശുബഹോ…) എന്ന ത്രിത്വസ്തുതിയോടെ അവസാനിക്കുന്നു.`],
   [`Elevation of the Paten — priest: "Holy things to the holy and pure." People: "The One Holy Father, the One Holy Son and the One Holy Spirit alone is holy. Amen." We confess that we are not holy.`,
    `പീലാസാ ഉയർത്തുമ്പോൾ — പുരോഹിതൻ: "ഈ വിശുദ്ധതകൾ വിശുദ്ധിയുള്ളവർക്കും വെടിപ്പുള്ളവർക്കും." ജനം: "പരിശുദ്ധനായ ഏക പിതാവും പരിശുദ്ധനായ ഏക പുത്രനും പരിശുദ്ധനായ ഏക റൂഹായും അല്ലാതെ പരിശുദ്ധൻ ഇല്ല. ആമ്മീൻ." നാം വിശുദ്ധരല്ലെന്ന് ഏറ്റുപറയുന്നു.`],
   [`Elevation of the Chalice — people: "Glory be to the Father, and to the Son, and to the living Holy Spirit, One God forever. Amen."`,
    `കാസാ ഉയർത്തുമ്പോൾ — ജനം: "ഒന്നായിരിക്കുന്ന പിതാവിനും പുത്രനും ജീവനുള്ള പരിശുദ്ധറൂഹായ്ക്കും എന്നേക്കും സ്തുതി. ആമ്മീൻ."`],
   [`Before the Anaphora the deacon holds the censer chains together and proclaims "Sthaumen kalos" — all present are true believers (catechumens once left at this point). Then the priest proclaims that the Holy Trinity is with the believers — this makes us worthy.`,
    `അനാഫൊറയ്ക്കു മുമ്പ് ശുശ്രൂഷകൻ ധൂപക്കുറ്റിയുടെ ചങ്ങലകൾ ഒരുമിച്ചുപിടിച്ച് "സ്തൗമെൻ കാലോസ്" എന്നു പ്രഖ്യാപിക്കുന്നു — ഉള്ളവരെല്ലാം സത്യവിശ്വാസികൾ (പണ്ട് മാമോദീസാർത്ഥികൾ ഈ സമയം പുറത്തുപോയിരുന്നു). തുടർന്ന് പരിശുദ്ധ ത്രിത്വം വിശ്വാസികളോടുകൂടെ എന്നു പുരോഹിതൻ പ്രഖ്യാപിക്കുന്നു — അതാണ് നമ്മെ യോഗ്യരാക്കുന്നത്.`],
   [`Before the procession of the Mysteries ("cry we aloud and say"): "Praised and adored is He who is Father, Son and Holy Spirit; to HIM be praise…" — "Him" (singular) shows the oneness of the Triune God.`,
    `രഹസ്യങ്ങൾ ജനത്തിലേക്ക് കൊണ്ടുവരുന്നതിനു മുമ്പ് ("നാം അട്ടഹസിച്ചു പറയണം"): "പിതാവും പുത്രനും പരിശുദ്ധറൂഹായുമായവൻ… തനിക്കു സ്തുതി" — "തനിക്കു" (ഏകവചനം) ത്രിയേക ദൈവത്തിന്റെ ഏകത്വം കാണിക്കുന്നു.`]
  ],
  direct:[
   {n:39, q:[`In Holy Communion we say only the Father, Son and Holy Spirit are holy. How do we say we qualify to receive Holy Communion?`,`പിതാവും പുത്രനും പരിശുദ്ധ റൂഹായും മാത്രമേ പരിശുദ്ധരായുള്ളൂ എന്നു പറയുമ്പോൾ, വിശുദ്ധരല്ലാത്ത നാം വി. കുർബ്ബാന അനുഭവിക്കാൻ യോഗ്യരാകുന്നത് എങ്ങനെ?`],
    a:[`By declaring that the Holy Trinity is with us`,`"വിശുദ്ധ ത്രിത്വം നമ്മോടുകൂടെ" എന്ന പ്രഖ്യാപനത്തോടെ`],
    why:[`The textbook: the priest proclaims the Holy Trinity is with the believers — by this the believers become worthy of fellowship with the Trinity.`,`പാഠപുസ്തകം: പരിശുദ്ധ ത്രിത്വം വിശ്വാസികളോടുകൂടെ എന്ന് പുരോഹിതൻ പ്രഖ്യാപിക്കുന്നു — ഇതിലൂടെയാണ് നാം യോഗ്യരാകുന്നത്.`]},
   {q:[`What does the priest say when he elevates the Paten?`,`പീലാസാ ഉയർത്തുമ്പോൾ പുരോഹിതൻ എന്തു പറയുന്നു?`],
    a:[`"Holy things to the holy and pure."`,`"ഈ വിശുദ്ധതകൾ വിശുദ്ധിയുള്ളവർക്കും വെടിപ്പുള്ളവർക്കും."`]},
   {q:[`What is the people's response at the elevation of the Paten?`,`പീലാസാ ഉയർത്തുമ്പോൾ ജനത്തിന്റെ പ്രതിവാക്യം?`],
    a:[`"The One Holy Father, the One Holy Son and the One Holy Spirit alone is holy. Amen."`,`"പരിശുദ്ധനായ ഏക പിതാവും പരിശുദ്ധനായ ഏക പുത്രനും പരിശുദ്ധനായ ഏക റൂഹായും അല്ലാതെ പരിശുദ്ധൻ ഇല്ല. ആമ്മീൻ."`]},
   {q:[`What is the meaning of the deacon's proclamation "Sthaumen kalos"?`,`"സ്തൗമെൻ കാലോസ്" എന്ന പ്രഖ്യാപനത്തിന്റെ അർത്ഥം?`],
    a:[`"Let us stand well (befittingly)" — it signifies that all in the church are true believers.`,`"നമുക്ക് നന്നായി (യോഗ്യമായി) നിൽക്കാം" — പള്ളിയിലുള്ളവരെല്ലാം സത്യവിശ്വാസികൾ എന്നു സൂചിപ്പിക്കുന്നു.`]}
  ],
  indirect:[
   {q:[`Why does the hymn "to Him be praise" use the singular for Father, Son and Holy Spirit?`,`പിതാവിനെയും പുത്രനെയും പരിശുദ്ധറൂഹായെയും കുറിച്ച് "തനിക്കു സ്തുതി" എന്ന് ഏകവചനം ഉപയോഗിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`To proclaim that the Triune God is One.`,`ത്രിയേക ദൈവം ഏകനാണെന്ന് പ്രഖ്യാപിക്കാൻ.`]},
   {q:[`What did catechumens do in the early Church at "Sthaumen kalos"?`,`ആദിമസഭയിൽ "സ്തൗമെൻ കാലോസ്" സമയത്ത് മാമോദീസാർത്ഥികൾ എന്തു ചെയ്തിരുന്നു?`],
    a:[`They left the church; the rest of the liturgy was only for the baptised faithful.`,`അവർ പള്ളിയിൽ നിന്ന് പുറത്തുപോയിരുന്നു; തുടർന്നുള്ള ആരാധന മാമോദീസ ഏറ്റ വിശ്വാസികൾക്കു മാത്രമായിരുന്നു.`]}
  ]
 },
 {
  id:`u7c3`, icon:`🎶`,
  title:[`Liturgical Hymns (Kyamtha Evening Prayer)`,`ആരാധനാഗീതങ്ങൾ — ക്യംതാ സന്ധ്യാനമസ്കാരം`],
  points:[
   [`The Qurbana book has two orders of common prayer: Sleeba Namaskaram (used from the Feast of the Cross) and Kyamtha Namaskaram (used from Easter). The main theme of Kyamtha hymns is the Resurrection.`,
    `കുർബ്ബാനക്രമത്തിൽ രണ്ടു നമസ്കാരക്രമങ്ങൾ: സ്ലീബാ നമസ്കാരം (സ്ലീബാപ്പെരുന്നാൾ മുതൽ), ക്യംതാ നമസ്കാരം (ഉയിർപ്പുപെരുന്നാൾ മുതൽ). ക്യംതാ ഗീതങ്ങളുടെ പ്രധാന വിഷയം കർത്താവിന്റെ ഉയിർപ്പ്.`],
   [`"Ee ninn udhanathin naal…": on the day of Your Resurrection, Adam, head of our race, rejoices — Christ's death and resurrection restored Adam to Paradise.`,
    `"ഈ നിൻ ഉത്ഥാനത്തിൻ നാൾ…": നിന്റെ ഉയിർപ്പിന്റെ ദിനത്തിൽ വംശത്തലവനായ ആദാം ആനന്ദിക്കുന്നു — ക്രിസ്തുവിന്റെ മരണവും ഉയിർപ്പും ആദാമിന് പറുദീസ തിരികെ നൽകി.`],
   [`"En nadhanin krupa ninne…": Your grace brought You down to us sinners; have mercy on the Church that clings to the wings of Your Cross. Gregory the Theologian: "Let us become like Christ, since Christ became like us."`,
    `"എൻ നാഥാ നിൻ കൃപ നിന്നെ…": നിന്റെ കൃപ നിന്നെ പാപികളിലേക്ക് ഇറക്കി; നിന്റെ സ്ലീബാച്ചിറകിൽ തൂങ്ങുന്ന സഭമേൽ കൃപ തോന്നണമേ. വേദശാസ്ത്രിയായ ഗ്രീഗോറിയോസ്: "ക്രിസ്തു നമ്മെപ്പോലെയായതിനാൽ നാം ക്രിസ്തുവിനെപ്പോലെയാകാം."`],
   [`"Naadhan mrutharidayil…": among the dead Christ consoled Adam — "I was beaten for your sin (Mt 27:30), drank the bitter drink for the fruit you ate (Mt 27:34), hung naked for your nakedness (Mt 27:35); My blood removed the Father's anger." This is the theology of salvation (soteriology).`,
    `"നാഥൻ മൃതരിടയിലുറപ്പിച്ചാദത്തെ…": മരിച്ചവരുടെ ഇടയിൽ ക്രിസ്തു ആദാമിനെ ആശ്വസിപ്പിക്കുന്നു — "നിന്റെ കുറ്റത്തിനു ഞാൻ അടി കൊണ്ടു (മത്താ. 27:30), നീ കനി തിന്നതിനു ഞാൻ കയ്പ്പു കുടിച്ചു (27:34), നിന്റെ നഗ്നതയ്ക്കു ഞാൻ നഗ്നനായി തൂങ്ങി (27:35); എന്റെ രക്തത്താൽ പിതാവിന്റെ കോപം മാറി." ഇതാണ് രക്ഷയുടെ വേദശാസ്ത്രം.`],
   [`"Nin murivukalinettein mooron…": sung by the Church, the Bride, who finds her Bridegroom Christ on the Cross at Golgotha. "Your lips are like a scarlet thread" — Song of Songs 4:3; Christ and the Church as Bridegroom and Bride (Ephesians 5:32).`,
    `"നിൻ മുറിവുകളീന്നേറ്റേൻ മൂറോൻ മണം…": മണവാട്ടിയായ സഭ, ഗോഗുൽത്തായിൽ കുരിശിൽ മണവാളനായ ക്രിസ്തുവിനെ കണ്ടെത്തുന്നു. "നിന്റെ അധരങ്ങൾ ചുവപ്പുനൂൽ പോലെ" — ഉത്തമഗീതം 4:3; ക്രിസ്തുവും സഭയും മണവാളനും മണവാട്ടിയും (എഫെസ്യർ 5:32).`]
  ],
  direct:[
   {n:50, q:[`Meaning of "Koottathalayay" in the hymn "Pathivin padi nin koottathalayay prarthikka…".`,`"പതിവിൻ പടി നിൻ കൂട്ടത്തലയായ് പ്രാർത്ഥിക്ക" എന്നതിലെ "കൂട്ടത്തലയായ്" എന്ന പ്രയോഗത്തിന്റെ അർത്ഥം?`],
    a:[`Standing as the leader of the congregation`,`കൂട്ടത്തിന്റെ തലവനായി നിന്നുകൊണ്ട്`],
    why:[`"Koottam" = congregation, "thala" = head.`,`"കൂട്ടം" = സമൂഹം, "തല" = തലവൻ.`]},
   {q:[`From which feast do we use the Kyamtha Namaskaram?`,`ഏതു പെരുന്നാൾ മുതലാണ് ക്യംതാ നമസ്കാരം ഉപയോഗിക്കുന്നത്?`],
    a:[`From the Feast of the Resurrection (Easter).`,`ഉയിർപ്പുപെരുന്നാൾ മുതൽ.`]},
   {q:[`What is the main theme of the hymns of Kyamtha Namaskaram?`,`ക്യംതാ നമസ്കാരത്തിലെ ഗീതങ്ങളുടെ പ്രധാന വിഷയം?`],
    a:[`The Resurrection of our Lord.`,`കർത്താവിന്റെ ഉയിർപ്പ്.`]},
   {q:[`From which book is "Your lips are like a scarlet thread" taken?`,`"നിന്റെ അധരങ്ങൾ ചുവപ്പുനൂൽ പോലെ" എന്ന ഭാഗം ഏതു പുസ്തകത്തിൽ നിന്ന്?`],
    a:[`Song of Songs (Song of Solomon) 4:3.`,`ഉത്തമഗീതം 4:3.`]},
   {q:[`Who comforted Adam "in the house of death" in the Kyamtha hymn?`,`ക്യംതാ ഗീതത്തിൽ "മരിച്ചവരുടെ ഇടയിൽ" ആദാമിനെ ആശ്വസിപ്പിച്ചത് ആര്?`],
    a:[`Our Lord Jesus Christ.`,`നമ്മുടെ കർത്താവായ യേശുക്രിസ്തു.`]}
  ],
  indirect:[
   {q:[`Explain the "bride and bridegroom" image in the hymn "Nin murivukal…".`,`"നിൻ മുറിവുകൾ…" എന്ന ഗീതത്തിലെ "മണവാട്ടി-മണവാളൻ" ചിത്രം വിശദീകരിക്കുക.`],
    a:[`The Church is the bride who seeks Christ, her heavenly Bridegroom, and finds Him on the Cross giving His life for her; the Crucifixion is the perfection of this holy marriage.`,`സഭ തന്റെ സ്വർഗ്ഗീയ മണവാളനായ ക്രിസ്തുവിനെ അന്വേഷിക്കുന്ന മണവാട്ടിയാണ്; അവൾക്കുവേണ്ടി ജീവൻ നൽകുന്ന അവനെ കുരിശിൽ കണ്ടെത്തുന്നു; കുരിശുമരണം ഈ വിശുദ്ധ വിവാഹത്തിന്റെ പൂർണ്ണത.`]},
   {q:[`How does the hymn "Naadhan mrutharidayil" connect Adam's sin with Christ's passion?`,`"നാഥൻ മൃതരിടയിൽ" എന്ന ഗീതം ആദാമിന്റെ പാപത്തെ ക്രിസ്തുവിന്റെ കഷ്ടാനുഭവവുമായി ബന്ധിപ്പിക്കുന്നത് എങ്ങനെ?`],
    a:[`Each suffering of Christ answers Adam's fall: blows for his sin, bitter drink for the fruit, nakedness on the cross for Adam's nakedness — Christ's blood reconciles us to the Father.`,`ക്രിസ്തുവിന്റെ ഓരോ കഷ്ടതയും ആദാമിന്റെ വീഴ്ചയ്ക്കുള്ള മറുപടിയാണ്: പാപത്തിന് അടി, കനിക്ക് കയ്പ്പുള്ള പാനീയം, നഗ്നതയ്ക്ക് കുരിശിലെ നഗ്നത — ക്രിസ്തുവിന്റെ രക്തം നമ്മെ പിതാവിനോട് നിരപ്പിക്കുന്നു.`]}
  ]
 },
 {
  id:`u7c4`, icon:`🍷`,
  title:[`Post-Communion Hymns`,`കുർബ്ബാനാനന്തര ശുശ്രൂഷയിലെ ഗീതങ്ങൾ`],
  points:[
   [`The post-communion service begins after the final benediction; the Madbaha is veiled and the faithful sing hymns.`,
    `അവസാന ആശീർവാദത്തിനു ശേഷമാണ് കുർബ്ബാനാനന്തര ശുശ്രൂഷ; മദ്ബഹാ മറയ്ക്കുന്നു; വിശ്വാസികൾ ഗീതങ്ങൾ പാടുന്നു.`],
   [`"Ente kadangalashesham…": Lord, wipe away all my debts with the sponge of Your mercy. "Espoogo" is the Syriac word for sponge.`,
    `"എന്റെ കടങ്ങളശേഷം നിൻ…": കർത്താവേ, നിന്റെ കൃപയാകുന്ന എസ്പൂഗായാൽ എന്റെ കടങ്ങൾ മായ്ക്കണമേ. "എസ്പൂഗാ" = സ്പോഞ്ച് (സുറിയാനി).`],
   [`"Moran Yeshu Mashiha…": let the Body and Blood we received be not for judgment but for pardon of sins and to stand boldly at Your right hand. "Aaruka" = to be cooled / forgiven.`,
    `"മോറാനേശുമശിഹാ…": ഞങ്ങൾ സ്വീകരിച്ച നിന്റെ ശരീരരക്തങ്ങൾ ശിക്ഷയ്ക്കല്ല, കുറ്റങ്ങളുടെ പരിഹാരത്തിനും ധൈര്യത്തോടെ നിന്റെ വലത്തുഭാഗത്തു നിൽക്കുന്നതിനും ആകണമേ. "ആറുക" = തണുക്കുക / ക്ഷമിക്കപ്പെടുക.`],
   [`"Pathakanam Roobelinu…": if Moses gave life to sinful Reuben by animal sacrifice, how much more will the faithful departed receive through Christ's living sacrifice. Reuben's sin: Gen 35:22; curse: Gen 49:4; Moses' blessing: Deut 33:6.`,
    `"പാതകനാം റൂബേലിന്…": മോശ മൃഗബലിയാൽ പാപിയായ രൂബേന് ജീവൻ നൽകിയെങ്കിൽ, ക്രിസ്തുവിന്റെ ജീവനുള്ള ബലിയാൽ വിശ്വാസികളായ മരിച്ചവർക്ക് എത്രയധികം ഗുണം. രൂബേന്റെ പാപം: ഉൽപ. 35:22; ശാപം: ഉൽപ. 49:4; മോശയുടെ അനുഗ്രഹം: ആവ. 33:6.`]
  ],
  direct:[
   {q:[`What is the Syriac word for "sponge" used in the hymn "Ente kadangalashesham"?`,`"എന്റെ കടങ്ങളശേഷം" എന്ന ഗീതത്തിലെ "സ്പോഞ്ച്" എന്നതിന്റെ സുറിയാനി പദം?`],
    a:[`Espoogo (Espooga).`,`എസ്പൂഗാ.`]},
   {q:[`When does the post-communion service begin?`,`കുർബ്ബാനാനന്തര ശുശ്രൂഷ എപ്പോൾ ആരംഭിക്കുന്നു?`],
    a:[`After the final benediction, with the Madbaha veiled.`,`അവസാന ആശീർവാദത്തിനു ശേഷം, മദ്ബഹാ മറച്ച്.`]},
   {q:[`Where is Reuben's sin recorded, and where did Moses bless him?`,`രൂബേന്റെ പാപം എവിടെ രേഖപ്പെടുത്തിയിരിക്കുന്നു? മോശ അവനെ അനുഗ്രഹിച്ചത് എവിടെ?`],
    a:[`Sin: Genesis 35:22. Moses' blessing: Deuteronomy 33:6 ("Let Reuben live and not die").`,`പാപം: ഉൽപത്തി 35:22. മോശയുടെ അനുഗ്രഹം: ആവർത്തനം 33:6 ("രൂബേൻ മരിക്കാതെ ജീവിച്ചിരിക്കട്ടെ").`]}
  ],
  indirect:[
   {q:[`What hope does the hymn about Reuben give for the departed?`,`രൂബേനെക്കുറിച്ചുള്ള ഗീതം വാങ്ങിപ്പോയവരെക്കുറിച്ച് എന്തു പ്രത്യാശ നൽകുന്നു?`],
    a:[`If an animal sacrifice could give life to Reuben, Christ's living sacrifice gives far greater blessing and forgiveness to the faithful departed.`,`ഒരു മൃഗബലിക്ക് രൂബേന് ജീവൻ നൽകാനായെങ്കിൽ, ക്രിസ്തുവിന്റെ ജീവനുള്ള ബലി വിശ്വാസികളായ മരിച്ചവർക്ക് അതിലും എത്രയോ വലിയ അനുഗ്രഹവും പാപമോചനവും നൽകും.`]},
   {q:[`What do we ask in "Moran Yeshu Mashiha" after receiving Communion?`,`കുർബ്ബാന സ്വീകരിച്ചശേഷം "മോറാനേശുമശിഹാ" ഗീതത്തിൽ നാം എന്താണ് അപേക്ഷിക്കുന്നത്?`],
    a:[`That the Body and Blood be not for our judgment, but for forgiveness and to stand boldly at Christ's right hand.`,`ശരീരരക്തങ്ങൾ ഞങ്ങളുടെ ശിക്ഷയ്ക്കല്ല, പാപപരിഹാരത്തിനും ക്രിസ്തുവിന്റെ വലത്തുഭാഗത്ത് ധൈര്യത്തോടെ നിൽക്കുന്നതിനും ആകണമേ എന്ന്.`]}
  ]
 }
 ]

BOOK2.push(
 {
  id:`r1`, icon:`🙏`,
  title:[`The Divinity of Prayer`,`പ്രാർത്ഥനയുടെ ആദ്ധ്യാത്മികത`],
  points:[
   [`Public prayer is the Church gathered in prescribed prayer. The Church is the Body of Christ; like branches on the vine, a believer has no life apart from it — a lonely search for God apart from the Church is not Christian.`,
    `നിശ്ചിതവും അംഗീകൃതവുമായ പ്രാർത്ഥനയിൽ സഭ ഒന്നിച്ചുകൂടുന്നതാണ് പരസ്യപ്രാർത്ഥന. സഭ ക്രിസ്തുവിന്റെ ശരീരമാണ്; മുന്തിരിവള്ളിയിലെ ശാഖകൾ പോലെ സഭയിൽ നിന്നു വേർപെട്ട വിശ്വാസിക്ക് ജീവനില്ല — സഭയിൽ നിന്നു മാറിയുള്ള ഒറ്റയായ ദൈവാന്വേഷണം ക്രിസ്തീയമല്ല.`],
   [`Dew drops become a stream only when they join — so canonical hours should be prayed together. Family prayer morning and evening rebuilds the family. Private prayer is no substitute for public prayer.`,
    `മഞ്ഞുതുള്ളികൾ ചേരുമ്പോഴാണ് അരുവിയാകുന്നത് — അതിനാൽ യാമപ്രാർത്ഥനകൾ ഒന്നിച്ചു ചൊല്ലണം. രാവിലെയും വൈകിട്ടുമുള്ള കുടുംബപ്രാർത്ഥന കുടുംബത്തെ പുനർനിർമ്മിക്കുന്നു. സ്വകാര്യപ്രാർത്ഥന പരസ്യപ്രാർത്ഥനയ്ക്ക് പകരമല്ല.`],
   [`Jesus is our model of prayer (He prayed all night — Mark 6:46). St. Cyprian of Carthage: "If He, the sinless, prayed, how much more should sinners pray?" — often quoted by St. Gregorios of Pampady.`,
    `പ്രാർത്ഥനയിൽ യേശുവാണ് നമ്മുടെ മാതൃക (രാത്രി മുഴുവൻ പ്രാർത്ഥിച്ചു — മർക്കൊസ് 6:46). കാർത്തേജിലെ വി. കുപ്രിയാനോസ്: "പാപമില്ലാത്തവൻ പ്രാർത്ഥിച്ചെങ്കിൽ പാപികളായ നാം എത്ര പ്രാർത്ഥിക്കണം?" — പാമ്പാടി തിരുമേനി ഇത് പലപ്പോഴും ഉദ്ധരിച്ചിരുന്നു.`],
   [`Tertullian of Carthage: "The Lord pays no heed to the sound; what He listens to is the heart." Jonah's prayer reached God from the depth of the sea — not by loudness. Prayer needs solemnity, purity and secrecy (Matthew 6:5–18).`,
    `കാർത്തേജിലെ തെർത്തുല്യൻ: "ദൈവം ശബ്ദം ശ്രദ്ധിക്കുന്നില്ല; അവിടുന്ന് ശ്രവിക്കുന്നത് ഹൃദയമാണ്." യോനായുടെ പ്രാർത്ഥന ഉച്ചത്തിലല്ല, കടലിന്റെ ആഴത്തിൽ നിന്നാണ് ദൈവസന്നിധിയിലെത്തിയത്. പ്രാർത്ഥനയ്ക്ക് ഗൗരവം, വിശുദ്ധി, രഹസ്യത എന്നിവ വേണം (മത്തായി 6:5–18).`],
   [`We face east when praying: Christ's coming is from the east (Matthew 24:27); God's glory from the east (Ezekiel 10:19); the star in the east (Matthew 2:1).`,
    `പ്രാർത്ഥിക്കുമ്പോൾ നാം കിഴക്കോട്ടു തിരിയുന്നു: ക്രിസ്തുവിന്റെ വരവ് കിഴക്കു നിന്ന് (മത്തായി 24:27); ദൈവമഹത്വം കിഴക്കു നിന്ന് (യെഹെസ്കേൽ 10:19); കിഴക്ക് നക്ഷത്രം (മത്തായി 2:1).`],
   [`Purity of heart is needed for prayer to be heard (Matthew 5:8; Joshua 7). Humility is the soul of prayer — the tax collector was justified (Luke 18:9–14). Prayer with hatred is like filling a porous pot with water.`,
    `പ്രാർത്ഥന കേൾക്കപ്പെടാൻ ഹൃദയശുദ്ധി വേണം (മത്തായി 5:8; യോശുവ 7). വിനയമാണ് പ്രാർത്ഥനയുടെ ആത്മാവ് — ചുങ്കക്കാരൻ നീതീകരിക്കപ്പെട്ടു (ലൂക്കൊസ് 18:9–14). വിദ്വേഷത്തോടെയുള്ള പ്രാർത്ഥന ഓട്ടയുള്ള കുടത്തിൽ വെള്ളം നിറയ്ക്കുന്നതുപോലെ.`]
  ],
  direct:[
   {n:40, q:[`Choose Tertullian's opinion on prayer.`,`പ്രാർത്ഥനയെക്കുറിച്ചുള്ള തെർത്തുല്യന്റെ അഭിപ്രായം?`],
    a:[`God does not listen to the voice; He listens to and hears the heart.`,`ദൈവം ശബ്ദം ശ്രദ്ധിക്കുന്നില്ല; അവിടുന്ന് ശ്രദ്ധിക്കുന്നതും ശ്രവിക്കുന്നതും ഹൃദയമാണ്.`],
    why:[`Careful: "If the sinless Lord prayed, how much more should we sinners pray" is St. Cyprian's saying, not Tertullian's.`,`ശ്രദ്ധിക്കുക: "പാപമില്ലാത്ത കർത്താവ് പ്രാർത്ഥിച്ചെങ്കിൽ…" എന്നത് വി. കുപ്രിയാനോസിന്റെ വാക്കാണ്, തെർത്തുല്യന്റേതല്ല.`]},
   {q:[`Who said "If He, the sinless, prayed, how much more should the sinful pray?"`,`"പാപമില്ലാത്തവൻ പ്രാർത്ഥിച്ചെങ്കിൽ പാപികൾ എത്രയധികം പ്രാർത്ഥിക്കണം?" എന്നു പറഞ്ഞത് ആര്?`],
    a:[`St. Cyprian of Carthage (often quoted by St. Gregorios of Pampady).`,`കാർത്തേജിലെ വി. കുപ്രിയാനോസ് (പാമ്പാടി തിരുമേനി ഇത് പലപ്പോഴും ഉദ്ധരിച്ചിരുന്നു).`]},
   {q:[`Why do we face east while praying? Give one verse.`,`പ്രാർത്ഥിക്കുമ്പോൾ കിഴക്കോട്ടു തിരിയുന്നത് എന്തുകൊണ്ട്? ഒരു വാക്യം എഴുതുക.`],
    a:[`Christ's Second Coming will be from the east (Matthew 24:27); also Ezekiel 10:19 and Matthew 2:1.`,`ക്രിസ്തുവിന്റെ രണ്ടാം വരവ് കിഴക്കു നിന്നാണ് (മത്തായി 24:27); യെഹെസ്കേൽ 10:19, മത്തായി 2:1 എന്നിവയും.`]},
   {q:[`Which prayer is part of our Kauma?`,`നമ്മുടെ കൗമായുടെ ഭാഗമായ പ്രാർത്ഥന?`],
    a:[`The Lord's Prayer, taught by Jesus.`,`യേശു പഠിപ്പിച്ച കർത്തൃപ്രാർത്ഥന.`]},
   {q:[`What is the "soul" of prayer, according to this lesson?`,`ഈ പാഠമനുസരിച്ച് പ്രാർത്ഥനയുടെ "ആത്മാവ്" എന്താണ്?`],
    a:[`Humility.`,`വിനയം.`]}
  ],
  indirect:[
   {q:[`Why is private prayer not a substitute for public prayer?`,`സ്വകാര്യപ്രാർത്ഥന പരസ്യപ്രാർത്ഥനയ്ക്ക് പകരമാകാത്തത് എന്തുകൊണ്ട്?`],
    a:[`A believer prays through the Church, the Body of Christ. Prayers from many mouths rising together are strengthened — like dew drops that become a stream.`,`വിശ്വാസി ക്രിസ്തുശരീരമായ സഭയിലൂടെയാണ് പ്രാർത്ഥിക്കുന്നത്. അനേകരുടെ പ്രാർത്ഥന ഒന്നിച്ചുയരുമ്പോൾ അത് ശക്തിപ്പെടുന്നു — മഞ്ഞുതുള്ളികൾ ചേർന്ന് അരുവിയാകുന്നതുപോലെ.`]},
   {q:[`Why is loud, noisy prayer not necessary?`,`ഉച്ചത്തിലുള്ള ബഹളമയമായ പ്രാർത്ഥന ആവശ്യമില്ലാത്തത് എന്തുകൊണ്ട്?`],
    a:[`God listens to the heart, not the sound (Tertullian). Jonah was heard from the depths of the sea. Prayer should be solemn, pure and secret (Matthew 6).`,`ദൈവം ശബ്ദമല്ല, ഹൃദയമാണ് ശ്രദ്ധിക്കുന്നത് (തെർത്തുല്യൻ). കടലിന്റെ ആഴത്തിൽ നിന്ന് യോനാ കേൾക്കപ്പെട്ടു. പ്രാർത്ഥന ഗൗരവമുള്ളതും വിശുദ്ധവും രഹസ്യവുമാകണം (മത്തായി 6).`]},
   {q:[`Why are some prayers not answered? Give a Bible example.`,`ചില പ്രാർത്ഥനകൾക്ക് ഉത്തരം ലഭിക്കാത്തത് എന്തുകൊണ്ട്? ഒരു വേദപുസ്തക ഉദാഹരണം.`],
    a:[`Because of sin and an impure heart — Joshua's cry was unanswered due to the people's sin (Joshua 7); selfish prayers are not answered (James 4:3).`,`പാപവും അശുദ്ധ ഹൃദയവും കൊണ്ട് — ജനത്തിന്റെ പാപം നിമിത്തം യോശുവയുടെ നിലവിളിക്ക് ഉത്തരം ലഭിച്ചില്ല (യോശുവ 7); സ്വാർത്ഥ പ്രാർത്ഥനകൾക്ക് ഉത്തരമില്ല (യാക്കോബ് 4:3).`]}
  ]
 },
 {
  id:`r2`, icon:`💧`,
  title:[`Holy Baptism`,`വി. മാമോദീസാ`],
  points:[
   [`Baptism is the first sacrament that joins us to Christ — new birth through water and Spirit (John 3:3–5), in the name of the Holy Trinity. Anointing with Holy Mooron makes us adopted children of God.`,
    `ക്രിസ്തുവിനോടു ചേർക്കുന്ന ആദ്യ കൂദാശയാണ് മാമോദീസ — വെള്ളത്താലും ആത്മാവിനാലുമുള്ള പുതുജനനം (യോഹന്നാൻ 3:3–5), പരിശുദ്ധ ത്രിത്വനാമത്തിൽ. വി. മൂറോൻ അഭിഷേകം നമ്മെ ദൈവത്തിന്റെ ദത്തുമക്കളാക്കുന്നു.`],
   [`Infant baptism is biblical: John the Baptist responded in the womb (Luke 1:44); Jeremiah was called in the womb (Jer 1:5); the paralytic healed by others' faith (Mark 2:5); whole families were baptised — Lydia, Cornelius, the jailer (Acts 16:15, 33).`,
    `ശിശുസ്നാനം വേദാനുസൃതം: യോഹന്നാൻ സ്നാപകൻ ഗർഭത്തിൽ വെച്ചു പ്രതികരിച്ചു (ലൂക്കൊസ് 1:44); യിരെമ്യാവ് ഗർഭത്തിൽ വിളിക്കപ്പെട്ടു (യിരെ. 1:5); മറ്റുള്ളവരുടെ വിശ്വാസത്താൽ പക്ഷവാതക്കാരൻ സൗഖ്യമായി (മർക്കൊസ് 2:5); കുടുംബങ്ങൾ ഒന്നടങ്കം സ്നാനമേറ്റു — ലുദിയാ, കൊർന്നേല്യൊസ്, കാരാഗൃഹപ്രമാണി (അപ്പൊ. 16:15, 33).`],
   [`The baptised receives three sacraments together: Baptism, Holy Mooron and Holy Communion. Baptism and Mooron are never repeated. The order of service is that of Bar Hebraeus (13th century).`,
    `മാമോദീസ ഏൽക്കുന്നയാൾക്ക് മൂന്നു കൂദാശകൾ ഒന്നിച്ചു ലഭിക്കുന്നു: മാമോദീസ, വി. മൂറോൻ, വി. കുർബ്ബാന. മാമോദീസയും മൂറോനും ആവർത്തിക്കുന്നില്ല. ക്രമം ബാർ എബ്രായയുടേതാണ് (13-ാം നൂറ്റാണ്ട്).`],
   [`Preparatory service: Epistle Romans 5:20–6:4 (we share Christ's death, burial and resurrection); Gospel on the new baptism in fire and Spirit; the priest breathes on the candidate; he renounces Satan facing WEST and accepts Christ facing EAST; ends with the Nicene Creed.`,
    `ഒരുക്കശുശ്രൂഷ: ശ്ലീഹാവായന റോമർ 5:20–6:4 (ക്രിസ്തുവിന്റെ മരണം, കബറടക്കം, ഉയിർപ്പ് എന്നിവയിൽ പങ്കുചേരുന്നു); ഏവൻഗേലിയോൻ — അഗ്നിയാലും ആത്മാവിനാലുമുള്ള പുതിയ സ്നാനം; പുരോഹിതൻ ഊതുന്നു; പടിഞ്ഞാറോട്ടു തിരിഞ്ഞ് സാത്താനെ ഉപേക്ഷിക്കുന്നു, കിഴക്കോട്ടു തിരിഞ്ഞ് ക്രിസ്തുവിനെ സ്വീകരിക്കുന്നു; വിശ്വാസപ്രമാണത്തോടെ സമാപിക്കുന്നു.`],
   [`At the font: anointing with the "oil of joy"; warm and cold water mixed, covered with the veil (Sosafa); Holy Mooron poured into the water; water poured from four sides in the form of a cross. Then Mooron anointing, a crown (sign of the crown of glory), and Holy Communion — "the fruit of life untouched by Adam".`,
    `സ്നാനത്തൊട്ടിയിൽ: "ആനന്ദത്തിന്റെ എണ്ണ" കൊണ്ട് അഭിഷേകം; ചൂടുവെള്ളവും തണുത്ത വെള്ളവും കലർത്തി ശോശപ്പാ കൊണ്ട് മൂടുന്നു; വി. മൂറോൻ വെള്ളത്തിൽ ഒഴിക്കുന്നു; നാലു വശത്തുനിന്നും കുരിശാകൃതിയിൽ വെള്ളം ഒഴിക്കുന്നു. തുടർന്ന് മൂറോൻ അഭിഷേകം, കിരീടം (മഹത്വകിരീടത്തിന്റെ അടയാളം), വി. കുർബ്ബാന — "ആദാം പറുദീസയിൽ തൊടാത്ത ജീവന്റെ ഫലം".`]
  ],
  direct:[
   {n:41, q:[`The content of the Epistle during the sacrament of Baptism.`,`വി. മാമോദീസാ ക്രമത്തിലെ ശ്ലീഹാവായനയുടെ ഉള്ളടക്കം?`],
    a:[`Baptism is death, burial and resurrection with Christ`,`ക്രിസ്തുവിനോടുകൂടെയുള്ള മരണവും കബറടക്കവും ഉയിർത്തെഴുന്നേൽപ്പുമാണ് വി. മാമോദീസ`],
    why:[`The Epistle is Romans 5:20–6:4. "New baptism in fire and Spirit" is the theme of the Gospel reading, not the Epistle.`,`ശ്ലീഹാവായന റോമർ 5:20–6:4. "അഗ്നിയാലും ആത്മാവിനാലുമുള്ള പുതിയ സ്നാനം" ഏവൻഗേലിയോന്റെ വിഷയമാണ്, ശ്ലീഹാവായനയുടേതല്ല.`]},
   {q:[`Whose order of service is followed in Holy Baptism?`,`വി. മാമോദീസയിൽ ആരുടെ ക്രമമാണ് പിന്തുടരുന്നത്?`],
    a:[`Bar Hebraeus (13th century).`,`ബാർ എബ്രായ (13-ാം നൂറ്റാണ്ട്).`]},
   {q:[`Which three sacraments does a person receive at Baptism?`,`മാമോദീസയിൽ ഒരാൾക്ക് ലഭിക്കുന്ന മൂന്നു കൂദാശകൾ?`],
    a:[`Holy Baptism, Holy Mooron and Holy Communion.`,`വി. മാമോദീസ, വി. മൂറോൻ, വി. കുർബ്ബാന.`]},
   {q:[`Facing which direction does the candidate renounce Satan, and facing which direction accept Christ?`,`ഏതു ദിശയിലേക്കു തിരിഞ്ഞാണ് സാത്താനെ ഉപേക്ഷിക്കുന്നത്? ഏതു ദിശയിലേക്കു തിരിഞ്ഞാണ് ക്രിസ്തുവിനെ സ്വീകരിക്കുന്നത്?`],
    a:[`Renounces Satan facing west; accepts Christ facing east.`,`പടിഞ്ഞാറോട്ടു തിരിഞ്ഞ് സാത്താനെ ഉപേക്ഷിക്കുന്നു; കിഴക്കോട്ടു തിരിഞ്ഞ് ക്രിസ്തുവിനെ സ്വീകരിക്കുന്നു.`]},
   {q:[`What does the crown placed on the baptised signify?`,`മാമോദീസ ഏറ്റയാളുടെ തലയിൽ വയ്ക്കുന്ന കിരീടം എന്തിനെ സൂചിപ്പിക്കുന്നു?`],
    a:[`The crown of glory preserved in the heavenly kingdom.`,`സ്വർഗ്ഗരാജ്യത്തിൽ സൂക്ഷിച്ചിരിക്കുന്ന മഹത്വകിരീടം.`]}
  ],
  indirect:[
   {q:[`Someone says infants should not be baptised because they cannot confess faith. How do you answer from the Bible?`,`ശിശുക്കൾക്ക് വിശ്വാസം ഏറ്റുപറയാനാവില്ല, അതിനാൽ ശിശുസ്നാനം പാടില്ല എന്ന് ഒരാൾ പറയുന്നു. വേദപുസ്തകത്തിൽ നിന്ന് എങ്ങനെ മറുപടി നൽകാം?`],
    a:[`Children can receive grace (John in the womb, Luke 1:44; Jeremiah 1:5); others' faith can bring grace (Mark 2:5; Matthew 8:5–13); whole households were baptised (Acts 16:15, 33).`,`കുട്ടികൾക്ക് കൃപ സ്വീകരിക്കാനാകും (ഗർഭത്തിലെ യോഹന്നാൻ, ലൂക്കൊസ് 1:44; യിരെ. 1:5); മറ്റുള്ളവരുടെ വിശ്വാസം കൃപ കൊണ്ടുവരും (മർക്കൊസ് 2:5; മത്തായി 8:5–13); കുടുംബങ്ങൾ ഒന്നടങ്കം സ്നാനമേറ്റു (അപ്പൊ. 16:15, 33).`]},
   {q:[`How is Christian baptism different from John the Baptist's baptism?`,`ക്രിസ്തീയ മാമോദീസ യോഹന്നാൻ സ്നാപകന്റെ സ്നാനത്തിൽ നിന്ന് എങ്ങനെ വ്യത്യസ്തമാണ്?`],
    a:[`John's was only a baptism of repentance; Christian baptism is new birth by water and the Holy Spirit (Matthew 3:11; John 3:5).`,`യോഹന്നാന്റേത് മാനസാന്തരസ്നാനം മാത്രം; ക്രിസ്തീയ മാമോദീസ വെള്ളത്താലും പരിശുദ്ധാത്മാവിനാലുമുള്ള പുതുജനനമാണ് (മത്തായി 3:11; യോഹ. 3:5).`]}
  ]
 },
 {
  id:`r3`, icon:`💍`,
  title:[`Holy Matrimony`,`വി. വിവാഹകൂദാശ`],
  points:[
   [`Marriage was founded in Eden (Genesis 2:18). Jesus attended the wedding at Cana (John 2:1–2). In the Orthodox Church marriage is a sacrament, not a contract — "what God has joined, let no one separate" (Matthew 19:3–8).`,
    `വിവാഹം ഏദെനിൽ സ്ഥാപിക്കപ്പെട്ടു (ഉൽപത്തി 2:18). കാനാവിലെ കല്യാണത്തിൽ യേശു പങ്കെടുത്തു (യോഹ. 2:1–2). ഓർത്തഡോക്സ് സഭയിൽ വിവാഹം ഉടമ്പടിയല്ല, കൂദാശയാണ് — "ദൈവം യോജിപ്പിച്ചതിനെ മനുഷ്യൻ വേർപിരിക്കരുത്" (മത്തായി 19:3–8).`],
   [`Conditions: both members of the Church, eligible for Communion, proper distance of relationship (Lev 18), free will; only on Sundays and Mondays. Banns are announced in the parish beforehand.`,
    `നിബന്ധനകൾ: ഇരുവരും സഭാംഗങ്ങൾ, കുർബ്ബാനയ്ക്ക് യോഗ്യർ, കാനോനിക ബന്ധ അകലം (ലേവ്യ 18), സ്വമനസ്സാലെ; ഞായറും തിങ്കളും മാത്രം. മുൻകൂട്ടി ഇടവകയിൽ വിളംബരം (ബാന്ന്) നടത്തുന്നു.`],
   [`Two parts: blessing of the rings and blessing with the crowns. Epistle: Ephesians 5:20–6:3 (husband and wife like Christ and the Church — a "mysterion"). Gospel: Matthew 19:1–12.`,
    `രണ്ടു ഭാഗങ്ങൾ: മോതിരം വാഴ്വ്, കിരീടം വാഴ്വ്. ശ്ലീഹാവായന: എഫെസ്യർ 5:20–6:3 (ഭാര്യാഭർത്താക്കന്മാർ ക്രിസ്തുവും സഭയും പോലെ — "മർമ്മം"). ഏവൻഗേലിയോൻ: മത്തായി 19:1–12.`],
   [`The minnu (wedding locket) is a Christian form of the Hindu thali with a small cross — a custom adopted from Indian culture. The couple signs the register after the Kukiliyon.`,
    `മിന്ന് — ചെറിയ കുരിശുള്ള, ഹിന്ദു പാരമ്പര്യത്തിലെ താലിയുടെ ക്രിസ്തീയ രൂപം — ഭാരതീയ സംസ്കാരത്തിൽ നിന്ന് സ്വീകരിച്ച ആചാരം. കുക്കിലിയോനു ശേഷം വധൂവരന്മാർ രജിസ്റ്ററിൽ ഒപ്പിടുന്നു.`],
   [`Clergy may marry before becoming full deacons. Normally only one marriage; if a partner dies, remarriage is allowed but the sacrament is not repeated — a service of repentance is used instead.`,
    `പൂർണ്ണ ശെമ്മാശനാകുന്നതിനു മുമ്പ് വൈദികർക്ക് വിവാഹം ചെയ്യാം. സാധാരണ ഒരു വിവാഹം മാത്രം; ജീവിതപങ്കാളി മരിച്ചാൽ പുനർവിവാഹം അനുവദനീയം, എന്നാൽ കൂദാശ ആവർത്തിക്കുന്നില്ല — അനുതാപ ശുശ്രൂഷ നടത്തുന്നു.`]
  ],
  direct:[
   {q:[`What are the two parts of the sacrament of marriage?`,`വിവാഹകൂദാശയുടെ രണ്ടു ഭാഗങ്ങൾ?`],
    a:[`The blessing of the rings and the blessing with the crowns.`,`മോതിരം വാഴ്വ്, കിരീടം വാഴ്വ്.`]},
   {q:[`On which days can the sacrament of marriage be conducted?`,`ഏതു ദിവസങ്ങളിലാണ് വിവാഹകൂദാശ നടത്താവുന്നത്?`],
    a:[`Only on Sundays and Mondays.`,`ഞായറാഴ്ചയും തിങ്കളാഴ്ചയും മാത്രം.`]},
   {q:[`Which Gospel passage is read in the sacrament of marriage?`,`വിവാഹകൂദാശയിൽ വായിക്കുന്ന ഏവൻഗേലിയോൻ?`],
    a:[`Matthew 19:1–12.`,`മത്തായി 19:1–12.`]},
   {q:[`Which miracle shows that Jesus honoured marriage?`,`യേശു വിവാഹത്തെ മാനിച്ചു എന്നു കാണിക്കുന്ന സംഭവം?`],
    a:[`His presence at the wedding at Cana in Galilee (John 2:1–2).`,`ഗലീലയിലെ കാനാവിലെ കല്യാണത്തിൽ പങ്കെടുത്തത് (യോഹന്നാൻ 2:1–2).`]}
  ],
  indirect:[
   {q:[`Why is marriage a sacrament and not a contract?`,`വിവാഹം ഉടമ്പടിയല്ല, കൂദാശയാണെന്നു പറയുന്നത് എന്തുകൊണ്ട്?`],
    a:[`A contract can be broken, leading to divorce; in a sacrament God joins the couple, and what God joins must not be separated.`,`ഉടമ്പടി ലംഘിക്കാം, അത് വിവാഹമോചനത്തിലേക്കു നയിക്കും; കൂദാശയിൽ ദൈവമാണ് യോജിപ്പിക്കുന്നത്; ദൈവം യോജിപ്പിച്ചതിനെ വേർപിരിക്കരുത്.`]},
   {q:[`What should a Christian couple avoid in their wedding, according to this lesson?`,`ഈ പാഠമനുസരിച്ച് ക്രിസ്തീയ ദമ്പതികൾ വിവാഹത്തിൽ എന്ത് ഒഴിവാക്കണം?`],
    a:[`All luxury and show; a sacrament needs preparation and a spiritual atmosphere.`,`എല്ലാ ആർഭാടവും ആഡംബരവും; ഒരു കൂദാശയ്ക്ക് ഒരുക്കവും ആത്മീയാന്തരീക്ഷവും വേണം.`]}
  ]
 },
 {
  id:`r4`, icon:`✠`,
  title:[`Holy Ordination`,`വി. പട്ടംകൊട ശുശ്രൂഷ`],
  points:[
   [`Through ordination a person becomes Christ's representative to administer His mysteries. It is never repeated. Biblical basis: the Twelve (Luke 6:13); "Receive the Holy Spirit" (John 20:22–23); seven deacons (Acts 6:6); Saul and Barnabas (Acts 13:3); Timothy (2 Timothy 1:6).`,
    `പട്ടംകൊടയിലൂടെ ഒരാൾ ക്രിസ്തുവിന്റെ രഹസ്യങ്ങൾ നിർവ്വഹിക്കുന്ന അവന്റെ പ്രതിനിധിയാകുന്നു. ഇത് ആവർത്തിക്കുന്നില്ല. വേദാടിസ്ഥാനം: പന്ത്രണ്ടു പേർ (ലൂക്കൊസ് 6:13); "പരിശുദ്ധാത്മാവിനെ പ്രാപിപ്പിൻ" (യോഹ. 20:22–23); ഏഴു ശെമ്മാശന്മാർ (അപ്പൊ. 6:6); ശൗലും ബർന്നബാസും (അപ്പൊ. 13:3); തിമൊഥെയൊസ് (2 തിമൊ. 1:6).`],
   [`Three orders: Episcopa (bishop — all sacraments, consecrates churches and ordains; crozier = pastoral authority); Kasheesha (priest — "elder", Greek presbyter); Deacon (Greek diakonos = servant; St. Stephen was the chief deacon).`,
    `മൂന്നു പട്ടങ്ങൾ: എപ്പിസ്കോപ്പാ (മെത്രാൻ — എല്ലാ കൂദാശകളും, പള്ളികൂദാശ, പട്ടംകൊട; അംശവടി = ഇടയാധികാരം); കശീശാ (പുരോഹിതൻ — "മൂപ്പൻ", ഗ്രീക്കിൽ പ്രെസ്ബിറ്റർ); ശെമ്മാശൻ (ഗ്രീക്ക് ഡിയാക്കോനോസ് = ശുശ്രൂഷകൻ; വി. സ്തേഫാനോസ് ശെമ്മാശന്മാരിൽ പ്രധാനി).`],
   [`Cor-Episcopa = "bishop of a village", now an honour. Ramban (Rabo) is a monastic title, not an ordination; a deacon may be Ramban (Shervoyo Ramban) — e.g. Catholicos Augen. Bishops are first professed as Rambans.`,
    `കോർ-എപ്പിസ്കോപ്പാ = "ഗ്രാമത്തിന്റെ എപ്പിസ്കോപ്പാ", ഇന്ന് ബഹുമതിസ്ഥാനം. റമ്പാൻ (റാബോ) സന്യാസസ്ഥാനമാണ്, പട്ടമല്ല; ശെമ്മാശനും റമ്പാനാകാം (ശെർവോയോ റമ്പാൻ) — ഉദാ: ഔഗേൻ ബാവാ. മെത്രാന്മാരെ ആദ്യം റമ്പാന്മാരാക്കുന്നു.`],
   [`Full deacon (Mshamshono) wears the Oorara on the left shoulder. Lower orders: Yauppadyachno (sub-deacon), Koruyo (reader), Samrone (singer).`,
    `പൂർണ്ണ ശെമ്മാശൻ (മ്ശംശോനോ) ഇടത്തെ തോളിൽ ഊറാറാ ധരിക്കുന്നു. താഴ്ന്ന പട്ടങ്ങൾ: യൗപ്പദ്യക്നോ (ഉപശെമ്മാശൻ), കോറൂയോ (വായനക്കാരൻ), സമ്റോനോ (ഗായകൻ).`],
   [`Rite (within the Qurbana): Amalogiya (confession of faith — creed by Mar Jacob of Serugh/Meeppark), cropping of hair in the form of a cross (removing passions), Gospel placed on the shoulder, laying on of hands and invocation of the Spirit, sealing, vesting, authority given (crozier, censer, candle, Bible), kiss of peace.`,
    `ക്രമം (കുർബ്ബാനമധ്യേ): അമലോഗിയാ (വിശ്വാസ ഏറ്റുപറച്ചിൽ), കുരിശാകൃതിയിൽ മുടി മുറിക്കൽ (ജഡികവികാരങ്ങൾ നീക്കൽ), സുവിശേഷം തോളിൽ വയ്ക്കൽ, കൈവയ്പും റൂഹാക്ഷണവും, മുദ്രയിടൽ, തിരുവസ്ത്രം ധരിപ്പിക്കൽ, അധികാരം നൽകൽ (അംശവടി, ധൂപക്കുറ്റി, മെഴുകുതിരി, വേദപുസ്തകം), സമാധാന ചുംബനം.`]
  ],
  direct:[
   {q:[`What are the three main orders of priesthood?`,`പൗരോഹിത്യത്തിന്റെ മൂന്നു പ്രധാന പട്ടങ്ങൾ?`],
    a:[`Episcopa (bishop), Kasheesha (priest), Deacon.`,`എപ്പിസ്കോപ്പാ (മെത്രാൻ), കശീശാ (പുരോഹിതൻ), ശെമ്മാശൻ.`]},
   {q:[`What does "Kasheesha" mean? What is its Greek form?`,`"കശീശാ" എന്നതിന്റെ അർത്ഥം? ഗ്രീക്ക് രൂപം?`],
    a:[`"Elder" — Greek: Presbyter.`,`"മൂപ്പൻ" — ഗ്രീക്ക്: പ്രെസ്ബിറ്റർ.`]},
   {q:[`What does "Cor-Episcopa" mean?`,`"കോർ-എപ്പിസ്കോപ്പാ" എന്നതിന്റെ അർത്ഥം?`],
    a:[`"Bishop of a village".`,`"ഗ്രാമത്തിന്റെ എപ്പിസ്കോപ്പാ".`]},
   {q:[`Who was the chief among the deacons?`,`ശെമ്മാശന്മാരിൽ പ്രധാനി ആരായിരുന്നു?`],
    a:[`St. Stephen (Acts 6).`,`വി. സ്തേഫാനോസ് (അപ്പൊ. 6).`]},
   {q:[`What does the crozier symbolise?`,`അംശവടി എന്തിനെ സൂചിപ്പിക്കുന്നു?`],
    a:[`Pastoral authority and care.`,`ഇടയാധികാരവും പരിപാലനവും.`]}
  ],
  indirect:[
   {q:[`Why is the Gospel book placed on the candidate's shoulder at ordination?`,`പട്ടംകൊടയിൽ സുവിശേഷഗ്രന്ഥം സ്ഥാനാർത്ഥിയുടെ തോളിൽ വയ്ക്കുന്നത് എന്തിന്?`],
    a:[`It shows the call to carry the Gospel of Christ, and bowing the head is the candidate's response to that call.`,`ക്രിസ്തുവിന്റെ സുവിശേഷം വഹിക്കാനുള്ള വിളിയെ കാണിക്കുന്നു; തല കുനിക്കുന്നത് ആ വിളിയോടുള്ള പ്രതികരണം.`]},
   {q:[`Why is the sacrament of ordination not repeated?`,`പട്ടംകൊട ആവർത്തിക്കാത്തത് എന്തുകൊണ്ട്?`],
    a:[`Because the seal in the name of the Holy Trinity is permanent — the gift of priesthood is eternal.`,`പരിശുദ്ധ ത്രിത്വനാമത്തിലുള്ള മുദ്ര സ്ഥിരമായതുകൊണ്ട് — പൗരോഹിത്യവരം നിത്യമാണ്.`]}
  ]
 },
 {
  id:`r5`, icon:`🫒`,
  title:[`Anointing the Sick`,`വി. തൈലാഭിഷേകം`],
  points:[
   [`A sacrament for the healing of body, mind and spirit — the priest anoints the sick with oil and prays for health and forgiveness of sins.`,
    `ശരീരത്തിന്റെയും മനസ്സിന്റെയും ആത്മാവിന്റെയും സൗഖ്യത്തിനുള്ള കൂദാശ — പുരോഹിതൻ രോഗിയെ എണ്ണ പൂശി ആരോഗ്യത്തിനും പാപമോചനത്തിനുമായി പ്രാർത്ഥിക്കുന്നു.`],
   [`Biblical basis: the Twelve anointed many sick with oil (Mark 6:13); "Are any among you sick? Let them call the elders of the Church… anointing with oil" (James 5:14–15).`,
    `വേദാടിസ്ഥാനം: പന്ത്രണ്ടു പേർ അനേകം രോഗികളെ എണ്ണ പൂശി സൗഖ്യമാക്കി (മർക്കൊസ് 6:13); "നിങ്ങളിൽ ദീനമായി കിടക്കുന്നവൻ സഭയിലെ മൂപ്പന്മാരെ വരുത്തട്ടെ… എണ്ണ പൂശി" (യാക്കോബ് 5:14–15).`],
   [`Kantheela: an elaborate form with five parts; five wicks set in a cross on dough in olive oil, lit one by one (east, centre, west, north, south); the five senses are anointed. Ordinary (unconsecrated) oil is used in Kantheela; consecrated oil in ordinary anointing.`,
    `കന്തീല: അഞ്ചു ഭാഗങ്ങളുള്ള വിപുലമായ ശുശ്രൂഷ; ഒലിവെണ്ണയിൽ മാവിൽ കുരിശാകൃതിയിൽ അഞ്ചു തിരികൾ, ഓരോന്നായി കത്തിക്കുന്നു (കിഴക്ക്, മധ്യം, പടിഞ്ഞാറ്, വടക്ക്, തെക്ക്); അഞ്ച് ഇന്ദ്രിയങ്ങളിലും അഭിഷേകം. കന്തീലയ്ക്ക് വാഴ്ത്താത്ത സാധാരണ എണ്ണ; സാധാരണ തൈലാഭിഷേകത്തിന് മുൻകൂട്ടി വാഴ്ത്തിയ എണ്ണ.`],
   [`The central theme is penitence; disease and sin are signs of incompleteness. In ordinary anointing, oil is applied on the forehead, chest and knees, then the five senses.`,
    `കേന്ദ്രവിഷയം അനുതാപമാണ്; രോഗവും പാപവും അപൂർണ്ണതയുടെ അടയാളങ്ങൾ. സാധാരണ തൈലാഭിഷേകത്തിൽ നെറ്റി, നെഞ്ച്, മുട്ടുകൾ, തുടർന്ന് അഞ്ച് ഇന്ദ്രിയങ്ങൾ എന്നിവയിൽ എണ്ണ പൂശുന്നു.`],
   [`It is NOT the "last sacrament" for the dying (as "extreme unction" in the Roman Catholic Church). In the Orthodox Church it can be given any number of times, at any stage of illness.`,
    `ഇത് മരണാസന്നർക്കുള്ള "അന്ത്യകൂദാശ" അല്ല (റോമൻ കത്തോലിക്കാ സഭയിലെ "എക്സ്ട്രീം അങ്ഷൻ" പോലെ). ഓർത്തഡോക്സ് സഭയിൽ രോഗത്തിന്റെ ഏതു ഘട്ടത്തിലും എത്ര പ്രാവശ്യവും നൽകാം.`]
  ],
  direct:[
   {n:48, q:[`Choose the most appropriate statement regarding the anointing of the sick.`,`തൈലാഭിഷേകത്തെ സംബന്ധിച്ച് ഏറ്റവും അനുയോജ്യമായ പ്രസ്താവന?`],
    a:[`It is a sacrament given to the sick for healing and repentance`,`സൗഖ്യദാനത്തിനും അനുതാപത്തിനുമായി രോഗികൾക്ക് നൽകുന്ന കൂദാശയാണ് തൈലാഭിഷേകം`],
    why:[`It is not only for the elderly or dying, and Holy Mooron is not used (Mooron is for Baptism).`,`ഇത് പ്രായമായവർക്കോ മരണാസന്നർക്കോ മാത്രമല്ല; ഇതിൽ വി. മൂറോൻ ഉപയോഗിക്കുന്നില്ല (മൂറോൻ മാമോദീസയ്ക്ക്).`]},
   {q:[`Which verse gives the authority for anointing the sick to the elders (priests)?`,`രോഗികളെ അഭിഷേകം ചെയ്യാനുള്ള അധികാരം മൂപ്പന്മാർക്കു (പുരോഹിതന്മാർക്ക്) നൽകുന്ന വാക്യം?`],
    a:[`James 5:14–15.`,`യാക്കോബ് 5:14–15.`]},
   {q:[`How many wicks are used in Kantheela, and how are they arranged?`,`കന്തീലയിൽ എത്ര തിരികൾ? എങ്ങനെ ക്രമീകരിക്കുന്നു?`],
    a:[`Five wicks, arranged in the shape of a cross.`,`അഞ്ചു തിരികൾ, കുരിശാകൃതിയിൽ.`]},
   {q:[`Which oil is used in Kantheela?`,`കന്തീലയിൽ ഏതു എണ്ണയാണ് ഉപയോഗിക്കുന്നത്?`],
    a:[`Ordinary, unconsecrated olive oil.`,`വാഴ്ത്താത്ത സാധാരണ ഒലിവെണ്ണ.`]}
  ],
  indirect:[
   {q:[`Is anointing the sick only for those about to die? Explain.`,`തൈലാഭിഷേകം മരണാസന്നർക്കു മാത്രമാണോ? വിശദീകരിക്കുക.`],
    a:[`No. Unlike "extreme unction", in the Orthodox Church it is a sacrament of healing and penitence, given any number of times at any stage of illness.`,`അല്ല. "അന്ത്യകൂദാശ"യിൽ നിന്ന് വ്യത്യസ്തമായി ഓർത്തഡോക്സ് സഭയിൽ ഇത് സൗഖ്യത്തിന്റെയും അനുതാപത്തിന്റെയും കൂദാശയാണ്; രോഗത്തിന്റെ ഏതു ഘട്ടത്തിലും എത്ര പ്രാവശ്യവും നൽകാം.`]},
   {q:[`Why do the prayers of this sacrament ask for forgiveness of sins along with healing?`,`ഈ കൂദാശയിലെ പ്രാർത്ഥനകൾ സൗഖ്യത്തോടൊപ്പം പാപമോചനവും അപേക്ഷിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Disease and sin are both signs of incompleteness; Christ makes the whole person complete — body and soul.`,`രോഗവും പാപവും അപൂർണ്ണതയുടെ അടയാളങ്ങളാണ്; ക്രിസ്തു ശരീരത്തെയും ആത്മാവിനെയും — മുഴുവൻ വ്യക്തിയെയും — പൂർണ്ണനാക്കുന്നു.`]}
  ]
 },
 {
  id:`r6`, icon:`🕯`,
  title:[`Funeral Service`,`ശവസംസ്കാരം`],
  points:[
   [`For a Christian, death is a sleep; so the dead are called "departed" or those asleep. Only the body becomes still; the soul, not made of matter, does not perish (John 11:25–26).`,
    `ക്രിസ്ത്യാനിക്ക് മരണം ഒരു ഉറക്കമാണ്; അതിനാൽ മരിച്ചവരെ "വാങ്ങിപ്പോയവർ", "നിദ്രപ്രാപിച്ചവർ" എന്നു വിളിക്കുന്നു. ശരീരം മാത്രമാണ് നിശ്ചലമാകുന്നത്; പദാർത്ഥമല്ലാത്ത ആത്മാവ് നശിക്കുന്നില്ല (യോഹ. 11:25–26).`],
   [`The dead are buried facing the east, because Christ's Second Coming is from the east. Paul compares death-to-resurrection to a seed (1 Corinthians 15:35–38).`,
    `ക്രിസ്തുവിന്റെ രണ്ടാം വരവ് കിഴക്കു നിന്നായതിനാൽ മരിച്ചവരെ കിഴക്കോട്ടു തിരിച്ച് അടക്കുന്നു. മരണം മുതൽ ഉയിർപ്പുവരെയുള്ള കാലത്തെ പൗലോസ് വിത്തിനോട് ഉപമിക്കുന്നു (1 കൊരി. 15:35–38).`],
   [`Funeral of clergy (full deacon and above) has eight sections plus opening and closing; for laity and children four sections. Farewell to the Church: "Pushbaslomo" — reply "Sel beshlomo" (Go in peace).`,
    `വൈദികരുടെ (പൂർണ്ണ ശെമ്മാശൻ മുതൽ) ശവസംസ്കാരത്തിന് എട്ടു ഭാഗങ്ങളും ആരംഭ-സമാപന ശുശ്രൂഷകളും; അൽമായർക്കും കുട്ടികൾക്കും നാലു ഭാഗങ്ങൾ. സഭയോടുള്ള വിടവാങ്ങൽ: "പുശ്ബശ്ലോമോ" — മറുപടി "സെൽ ബ്ശ്ലോമോ" (സമാധാനത്തോടെ പോവുക).`],
   [`Readings: 1 Cor 15:34–53 (men), 1 Thess 4:13–18 (women), 1 Cor 15:12–19 (children); Gospel John 5:19–29. Olive oil is poured thrice in a cross; earth mixed with incense is placed: "dust you are and to dust you shall return".`,
    `വായനകൾ: 1 കൊരി. 15:34–53 (പുരുഷന്മാർ), 1 തെസ്സ. 4:13–18 (സ്ത്രീകൾ), 1 കൊരി. 15:12–19 (കുട്ടികൾ); ഏവൻഗേലിയോൻ യോഹ. 5:19–29. ഒലിവെണ്ണ കുരിശാകൃതിയിൽ മൂന്നു പ്രാവശ്യം ഒഴിക്കുന്നു; ധൂപം ചേർത്ത മണ്ണ് ഇടുന്നു: "മണ്ണിൽ നിന്ന് എടുക്കപ്പെട്ടത് മണ്ണിലേക്കു മടങ്ങട്ടെ".`],
   [`After the funeral: Holy Qurbana or remembrance with incense at the tomb on the 3rd, 9th, 30th and 40th days and on death anniversaries; charity in the name of the departed.`,
    `ശവസംസ്കാരത്തിനു ശേഷം: 3, 9, 30, 40 ദിവസങ്ങളിലും ചരമവാർഷികങ്ങളിലും വി. കുർബ്ബാന അല്ലെങ്കിൽ ഓർമ്മയും കബറിങ്കൽ ധൂപാർപ്പണവും; വാങ്ങിപ്പോയവരുടെ പേരിൽ ദാനധർമ്മം.`]
  ],
  direct:[
   {n:47, q:[`Why are the dead described as "departed"?`,`മരണമടഞ്ഞവരെ "വാങ്ങിപ്പോയവർ" എന്നു വിശേഷിപ്പിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`All answers are correct`,`എല്ലാ ഉത്തരങ്ങളും ശരിയാണ്`],
    why:[`Only the body is still; death is a temporary departure; the soul remains alive.`,`ശരീരം മാത്രം നിശ്ചലം; മരണം താൽക്കാലിക വിടവാങ്ങൽ; ആത്മാവ് സജീവം.`]},
   {q:[`Why are the dead buried facing east?`,`മരിച്ചവരെ കിഴക്കോട്ടു തിരിച്ച് അടക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Because Christ's Second Coming will be from the east.`,`ക്രിസ്തുവിന്റെ രണ്ടാം വരവ് കിഴക്കു നിന്നായതുകൊണ്ട്.`]},
   {q:[`On which days are prayers held for the departed after the funeral?`,`ശവസംസ്കാരത്തിനു ശേഷം ഏതെല്ലാം ദിവസങ്ങളിലാണ് വാങ്ങിപ്പോയവർക്കായി പ്രാർത്ഥന?`],
    a:[`The 3rd, 9th, 30th and 40th days, and death anniversaries.`,`3, 9, 30, 40 ദിവസങ്ങളും ചരമവാർഷികങ്ങളും.`]},
   {q:[`What Gospel passage is read at a funeral?`,`ശവസംസ്കാര ശുശ്രൂഷയിൽ വായിക്കുന്ന ഏവൻഗേലിയോൻ?`],
    a:[`John 5:19–29.`,`യോഹന്നാൻ 5:19–29.`]},
   {q:[`What is the people's reply to "Pushbaslomo" at a priest's funeral?`,`ഒരു വൈദികന്റെ ശവസംസ്കാരത്തിൽ "പുശ്ബശ്ലോമോ"യ്ക്ക് ജനത്തിന്റെ മറുപടി?`],
    a:[`"Sel beshlomo" — Go in peace.`,`"സെൽ ബ്ശ്ലോമോ" — സമാധാനത്തോടെ പോവുക.`]}
  ],
  indirect:[
   {q:[`How does Paul's image of a seed help us understand death?`,`വിത്തിനെക്കുറിച്ചുള്ള പൗലോസിന്റെ ഉപമ മരണം മനസ്സിലാക്കാൻ എങ്ങനെ സഹായിക്കുന്നു?`],
    a:[`As a plant grows out of a buried seed, the departed will rise with a spiritual, immortal body at the last trumpet (1 Cor 15:35–38).`,`കുഴിച്ചിട്ട വിത്തിൽ നിന്ന് ചെടി വളരുന്നതുപോലെ, അന്ത്യകാഹളത്തിൽ വാങ്ങിപ്പോയവർ ആത്മീയവും അമർത്യവുമായ ശരീരത്തോടെ ഉയിർക്കും (1 കൊരി. 15:35–38).`]},
   {q:[`What two main themes do the funeral prayers teach?`,`ശവസംസ്കാര പ്രാർത്ഥനകൾ പഠിപ്പിക്കുന്ന രണ്ടു പ്രധാന ആശയങ്ങൾ?`],
    a:[`The shortness of life in this world (so we must be watchful and faithful), and the hope of resurrection in Christ.`,`ഈ ലോകജീവിതത്തിന്റെ ക്ഷണികത (അതിനാൽ ജാഗ്രതയോടും വിശ്വസ്തതയോടും ജീവിക്കണം), ക്രിസ്തുവിലുള്ള ഉയിർപ്പിന്റെ പ്രത്യാശ.`]}
  ]
 },
 {
  id:`r7`, icon:`🏠`,
  title:[`Blessing and Dedication of Houses`,`ഭവനകൂദാശ`],
  points:[
   [`A home is a symbol of unity; selfless love is its basis. Blessing a house offers it to God and purifies it — a Christian home stands apart, marked with the cross.`,
    `ഭവനം ഐക്യത്തിന്റെ പ്രതീകമാണ്; നിസ്വാർത്ഥ സ്നേഹമാണ് അടിസ്ഥാനം. ഭവനകൂദാശയിലൂടെ വീട് ദൈവത്തിനു സമർപ്പിച്ച് ശുദ്ധീകരിക്കുന്നു — കുരിശടയാളമുള്ള ക്രിസ്തീയ ഭവനം വേറിട്ടു നിൽക്കുന്നു.`],
   [`The service: Kauma, Promeon, Sedra, Gospel, intercessions; water is blessed in the name of the Trinity and a cross is made on all door lintels.`,
    `ശുശ്രൂഷ: കൗമാ, പ്രൊമിയോൻ, സെദറാ, ഏവൻഗേലിയോൻ, മധ്യസ്ഥപ്രാർത്ഥന; ത്രിത്വനാമത്തിൽ വെള്ളം വാഴ്ത്തി എല്ലാ വാതിൽപ്പടികളിലും കുരിശടയാളം വരയ്ക്കുന്നു.`],
   [`Gospel: Luke 19:1–10 — the repentance, confession and salvation of Zacchaeus brought salvation to his whole household.`,
    `ഏവൻഗേലിയോൻ: ലൂക്കൊസ് 19:1–10 — സക്കായിയുടെ മാനസാന്തരവും ഏറ്റുപറച്ചിലും അവന്റെ കുടുംബത്തിനു മുഴുവൻ രക്ഷ കൊണ്ടുവന്നു.`],
   [`"Let the faces of the residents be illumined" — like Moses' shining face. We pray the home be protected as Noah (flood), Abraham (sword) and Lot (fire) were. The cross on the lintel recalls the Passover lamb's blood.`,
    `"ഈ ഭവനവാസികളുടെ മുഖങ്ങൾ പ്രകാശിക്കട്ടെ" — മോശയുടെ മുഖം പോലെ. നോഹ (ജലപ്രളയം), അബ്രഹാം (വാൾ), ലോത്ത് (അഗ്നി) എന്നിവരെ കാത്തതുപോലെ ഭവനത്തെ കാക്കണമേ എന്നു പ്രാർത്ഥിക്കുന്നു. വാതിൽപ്പടിയിലെ കുരിശ് പെസഹാ കുഞ്ഞാടിന്റെ രക്തത്തെ ഓർമ്മിപ്പിക്കുന്നു.`],
   [`Luxury and spirituality never go together. Prepare with prayer, charity and fasting. A building becomes a home only when love reigns in it.`,
    `ആർഭാടവും ആത്മീയതയും ഒരിക്കലും ഒന്നിച്ചുപോകില്ല. പ്രാർത്ഥന, ദാനധർമ്മം, ഉപവാസം എന്നിവയോടെ ഒരുങ്ങുക. സ്നേഹം വാഴുമ്പോഴാണ് ഒരു കെട്ടിടം ഭവനമാകുന്നത്.`]
  ],
  direct:[
   {n:46, q:[`The theme of the Evangelion in the blessing of the House.`,`ഭവനകൂദാശയിലെ ഏവൻഗേലിയോന്റെ പ്രമേയം?`],
    a:[`The repentance and confession of Zacchaeus`,`സക്കായിയുടെ മാനസാന്തരവും ഏറ്റുപറച്ചിലും`],
    why:[`Luke 19:1–10 — salvation came to his whole household.`,`ലൂക്കൊസ് 19:1–10 — അവന്റെ കുടുംബത്തിനു മുഴുവൻ രക്ഷ വന്നു.`]},
   {q:[`Where is the sign of the cross made with blessed water in house blessing?`,`ഭവനകൂദാശയിൽ വാഴ്ത്തിയ വെള്ളം കൊണ്ട് കുരിശടയാളം വരയ്ക്കുന്നത് എവിടെ?`],
    a:[`On all the lintels of the doors.`,`എല്ലാ വാതിൽപ്പടികളിലും.`]},
   {q:[`Which three Old Testament people are remembered in the intercession for protection of the home?`,`ഭവനസംരക്ഷണത്തിനുള്ള മധ്യസ്ഥപ്രാർത്ഥനയിൽ ഓർക്കുന്ന മൂന്നു പഴയനിയമ വ്യക്തികൾ?`],
    a:[`Noah (from the flood), Abraham (from the sword) and Lot (from fire).`,`നോഹ (ജലപ്രളയത്തിൽ നിന്ന്), അബ്രഹാം (വാളിൽ നിന്ന്), ലോത്ത് (അഗ്നിയിൽ നിന്ന്).`]}
  ],
  indirect:[
   {q:[`What does the prayer "Let the faces of the residents be illumined" mean?`,`"ഭവനവാസികളുടെ മുഖങ്ങൾ പ്രകാശിക്കട്ടെ" എന്ന പ്രാർത്ഥനയുടെ അർത്ഥം?`],
    a:[`A shining face shows a shining heart close to God — like Moses' face after meeting the Lord.`,`പ്രകാശിക്കുന്ന മുഖം ദൈവത്തോടടുത്ത പ്രകാശിക്കുന്ന ഹൃദയത്തെ കാണിക്കുന്നു — ദൈവത്തെ കണ്ട മോശയുടെ മുഖം പോലെ.`]},
   {q:[`How should a family prepare for the blessing of their house?`,`ഭവനകൂദാശയ്ക്കായി ഒരു കുടുംബം എങ്ങനെ ഒരുങ്ങണം?`],
    a:[`With prayer, charity and fasting; avoiding luxury; and sharing with the homeless poor.`,`പ്രാർത്ഥന, ദാനധർമ്മം, ഉപവാസം എന്നിവയോടെ; ആർഭാടം ഒഴിവാക്കി; ഭവനരഹിതരായ ദരിദ്രരോടു പങ്കുവച്ചുകൊണ്ട്.`]}
  ]
 },
 {
  id:`r8`, icon:`⭐`,
  title:[`Feast of Yeldho (Christmas)`,`യൽദോ പെരുന്നാൾ`],
  points:[
   [`"Yeldho" is the Syriac word for the Nativity (used in the West Syriac tradition). Moranaya ("of our Lord") feasts include Yeldho, Denha, Resurrection, Ascension and Pentecost.`,
    `"യൽദോ" = ജനനപ്പെരുന്നാളിന്റെ സുറിയാനി പദം (പശ്ചിമ സുറിയാനി പാരമ്പര്യം). മോറാനായ ("നമ്മുടെ കർത്താവിന്റെ") പെരുന്നാളുകൾ: യൽദോ, ദനഹാ, ഉയിർപ്പ്, സ്വർഗ്ഗാരോഹണം, പെന്തിക്കോസ്തി.`],
   [`The main services are the procession and the bonfire service after the incense prayer of the Nocturn. The Gospel Luke 2:1–20 is read at the fire; the priest lights it and goes round it thrice singing "Glory to God in the highest".`,
    `പ്രധാന ശുശ്രൂഷകൾ: രാത്രി നമസ്കാരത്തിലെ ധൂപപ്രാർത്ഥനയ്ക്കു ശേഷമുള്ള പ്രദക്ഷിണവും തീജ്വാല ശുശ്രൂഷയും. തീയുടെ അടുക്കൽ ലൂക്കൊസ് 2:1–20 വായിക്കുന്നു; പുരോഹിതൻ തീ കത്തിച്ച് "അത്യുന്നതങ്ങളിൽ ദൈവത്തിനു സ്തുതി" പാടി മൂന്നു പ്രാവശ്യം ചുറ്റുന്നു.`],
   [`The central theme of Yeldho prayers is the mystery of the Incarnation — how the Infinite became finite. The Vespers Sedra gathers prophecies and types (burning bush, Ezekiel's chariot, the stone cut without hands).`,
    `യൽദോ പ്രാർത്ഥനകളുടെ കേന്ദ്രവിഷയം മനുഷ്യാവതാര രഹസ്യം — അനന്തൻ പരിമിതനായതെങ്ങനെ. സന്ധ്യയിലെ സെദറാ പ്രവചനങ്ങളും പ്രതിരൂപങ്ങളും (എരിയുന്ന മുൾപ്പടർപ്പ്, യെഹെസ്കേലിന്റെ രഥം, കൈതൊടാതെ വെട്ടിയെടുത്ത കല്ല്) ചേർക്കുന്നു.`],
   [`The bonfire is made from the previous year's blessed Hosanna palms, in a cross-shaped pit on the west side. It symbolises Christ, "Light from Light" — "the people in darkness saw a great light" (Isaiah 9:2; Matthew 4:16).`,
    `കഴിഞ്ഞ വർഷത്തെ വാഴ്ത്തിയ ഓശാന കുരുത്തോലകൾ കൊണ്ട്, പടിഞ്ഞാറുവശത്ത് കുരിശാകൃതിയിലുള്ള കുഴിയിലാണ് തീ ഒരുക്കുന്നത്. അത് "പ്രകാശത്തിൽ നിന്നുള്ള പ്രകാശമായ" ക്രിസ്തുവിനെ സൂചിപ്പിക്കുന്നു — "ഇരുട്ടിൽ ഇരുന്ന ജനം വലിയ വെളിച്ചം കണ്ടു" (യെശയ്യാവ് 9:2; മത്തായി 4:16).`],
   [`Message: the self-emptying (condescension) of Christ (Philippians 2:6–8) — love shown through sacrifice.`,
    `സന്ദേശം: ക്രിസ്തുവിന്റെ സ്വയം ശൂന്യമാക്കൽ (ഫിലിപ്പിയർ 2:6–8) — ത്യാഗത്തിലൂടെ പ്രകടമാകുന്ന സ്നേഹം.`]
  ],
  direct:[
   {n:45, q:[`The main theme of the Promeon prayer of the Nativity services.`,`ജനനപ്പെരുന്നാൾ ശുശ്രൂഷകളുടെ പ്രൊമിയോനിലെ പ്രധാന പ്രമേയം?`],
    a:[`The description of the mystery of the Incarnation`,`മനുഷ്യാവതാര രഹസ്യത്തിന്റെ വർണ്ണന`],
    why:[`"The central theme of the prayers and hymns of Yeldho is the mystery of the Incarnation."`,`"യൽദോ പ്രാർത്ഥനകളുടെയും ഗീതങ്ങളുടെയും കേന്ദ്രവിഷയം മനുഷ്യാവതാര രഹസ്യമാണ്."`]},
   {q:[`What is the bonfire at Yeldho made from?`,`യൽദോ പെരുന്നാളിലെ തീജ്വാല എന്തുകൊണ്ടാണ് ഒരുക്കുന്നത്?`],
    a:[`The previous year's blessed Hosanna (Palm Sunday) palms.`,`കഴിഞ്ഞ വർഷത്തെ വാഴ്ത്തിയ ഓശാന കുരുത്തോലകൾ.`]},
   {q:[`Which Gospel is read at the bonfire service?`,`തീജ്വാല ശുശ്രൂഷയിൽ വായിക്കുന്ന ഏവൻഗേലിയോൻ?`],
    a:[`Luke 2:1–20.`,`ലൂക്കൊസ് 2:1–20.`]},
   {q:[`Which epistle describes the self-emptying of Christ celebrated at Yeldho?`,`യൽദോയിൽ ആഘോഷിക്കുന്ന ക്രിസ്തുവിന്റെ സ്വയം ശൂന്യമാക്കൽ വിവരിക്കുന്ന ലേഖനഭാഗം?`],
    a:[`Philippians 2:6–8.`,`ഫിലിപ്പിയർ 2:6–8.`]}
  ],
  indirect:[
   {q:[`What does the bonfire of Yeldho symbolise?`,`യൽദോയിലെ തീജ്വാല എന്തിനെ സൂചിപ്പിക്കുന്നു?`],
    a:[`The birth of Christ, the Light of the world, rising on people in darkness — the light seen by the shepherds at Bethlehem.`,`ഇരുട്ടിൽ ഇരുന്ന ജനത്തിന്മേൽ ഉദിച്ച ലോകത്തിന്റെ വെളിച്ചമായ ക്രിസ്തുവിന്റെ ജനനം — ബേത്ലഹേമിൽ ആട്ടിടയന്മാർ കണ്ട പ്രകാശം.`]},
   {q:[`What is the message of Yeldho for us today?`,`യൽദോയുടെ ഇന്നത്തെ സന്ദേശം?`],
    a:[`Like Christ who humbled Himself, we should show love through sacrifice and be peacemakers amid discrimination and unrest.`,`തന്നെത്താൻ താഴ്ത്തിയ ക്രിസ്തുവിനെപ്പോലെ ത്യാഗത്തിലൂടെ സ്നേഹം പ്രകടിപ്പിക്കുകയും വിവേചനത്തിനും അശാന്തിക്കും നടുവിൽ സമാധാനം സൃഷ്ടിക്കുകയും വേണം.`]}
  ]
 },
 {
  id:`r9`, icon:`🌊`,
  title:[`Feast of Danaho (Epiphany)`,`ദനഹാ പെരുന്നാൾ`],
  points:[
   [`"Danaho" (Syriac) means "arising" (dawn); Greek: Epiphany. It commemorates the revelation of the Holy Trinity at Christ's baptism; a major feast since the 3rd century, on January 6.`,
    `"ദനഹാ" (സുറിയാനി) = "ഉദയം"; ഗ്രീക്കിൽ എപ്പിഫനി. ക്രിസ്തുവിന്റെ മാമോദീസയിൽ പരിശുദ്ധ ത്രിത്വം വെളിപ്പെട്ടതിന്റെ ഓർമ്മ; 3-ാം നൂറ്റാണ്ടു മുതൽ പ്രധാന പെരുന്നാൾ, ജനുവരി 6.`],
   [`It is called the feast of light — light dawned at the Jordan. Prayers ask God to remove the darkness of ignorance and make us children of light.`,
    `ഇതിനെ പ്രകാശത്തിന്റെ പെരുന്നാൾ എന്നു വിളിക്കുന്നു — യോർദ്ദാനിൽ പ്രകാശം ഉദിച്ചു. അജ്ഞതയുടെ അന്ധകാരം നീക്കി നമ്മെ പ്രകാശത്തിന്റെ മക്കളാക്കണമേ എന്നു പ്രാർത്ഥിക്കുന്നു.`],
   [`The unique service is the blessing of water (since the 4th century). Water in a jar with a cross and veil is carried in procession, blessed in the name of the Trinity and raised in four directions; three drops are poured into the baptismal font. The faithful partake of the blessed water.`,
    `ദനഹായുടെ പ്രത്യേകത വെള്ളം വാഴ്ത്തൽ ശുശ്രൂഷയാണ് (4-ാം നൂറ്റാണ്ടു മുതൽ). കുരിശും മൂടുപടവുമുള്ള പാത്രത്തിലെ വെള്ളം പ്രദക്ഷിണമായി കൊണ്ടുവന്ന് ത്രിത്വനാമത്തിൽ വാഴ്ത്തി നാലു ദിക്കിലേക്കും ഉയർത്തുന്നു; മൂന്നു തുള്ളി സ്നാനത്തൊട്ടിയിൽ ഒഴിക്കുന്നു. വിശ്വാസികൾ വാഴ്ത്തിയ വെള്ളം സ്വീകരിക്കുന്നു.`],
   [`Kerala customs (especially Kunnamkulam): lamps on plantain stems — "Pindi Perunnal"; a night bath on the eve — "Rakkuli Perunnal".`,
    `കേരളത്തിലെ ആചാരങ്ങൾ (പ്രത്യേകിച്ച് കുന്നംകുളം): വാഴപ്പിണ്ടിയിൽ ദീപങ്ങൾ — "പിണ്ടിപ്പെരുന്നാൾ"; തലേന്നു രാത്രിയിലെ കുളി — "രാക്കുളിപ്പെരുന്നാൾ".`]
  ],
  direct:[
   {n:44, q:[`The meaning of the word "Danaha".`,`"ദനഹാ" എന്ന വാക്കിന്റെ അർത്ഥം?`],
    a:[`Dawn (arising)`,`ഉദയം`],
    why:[`The textbook gives "arising"; its Greek equivalent is Epiphany.`,`പാഠപുസ്തകം: "ഉദയം"; ഗ്രീക്ക് തുല്യപദം എപ്പിഫനി.`]},
   {q:[`What is the unique service of the feast of Danaho?`,`ദനഹാ പെരുന്നാളിന്റെ പ്രത്യേക ശുശ്രൂഷ?`],
    a:[`The blessing of water.`,`വെള്ളം വാഴ്ത്തൽ.`]},
   {q:[`What is the Greek equivalent of "Danaho"?`,`"ദനഹാ"യുടെ ഗ്രീക്ക് തുല്യപദം?`],
    a:[`Epiphany.`,`എപ്പിഫനി.`]},
   {q:[`Why is Danaho also called "Pindi Perunnal"?`,`ദനഹായെ "പിണ്ടിപ്പെരുന്നാൾ" എന്നു വിളിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Because lamps are lit on plantain stems (pindi) and carried in procession.`,`വാഴപ്പിണ്ടിയിൽ ദീപങ്ങൾ കത്തിച്ച് പ്രദക്ഷിണമായി കൊണ്ടുപോകുന്നതുകൊണ്ട്.`]}
  ],
  indirect:[
   {q:[`Why is Danaho called the "feast of light"?`,`ദനഹായെ "പ്രകാശത്തിന്റെ പെരുന്നാൾ" എന്നു വിളിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Because the light of the Holy Trinity dawned at the Jordan at Christ's baptism; we pray to be illumined and become children of light.`,`ക്രിസ്തുവിന്റെ മാമോദീസയിൽ യോർദ്ദാനിൽ പരിശുദ്ധ ത്രിത്വത്തിന്റെ പ്രകാശം ഉദിച്ചതുകൊണ്ട്; നാം പ്രകാശിതരായി പ്രകാശത്തിന്റെ മക്കളാകാൻ പ്രാർത്ഥിക്കുന്നു.`]},
   {q:[`Why are three drops of the blessed water poured into the baptismal font?`,`വാഴ്ത്തിയ വെള്ളത്തിൽ നിന്ന് മൂന്നു തുള്ളി സ്നാനത്തൊട്ടിയിൽ ഒഴിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`To link the feast with baptism — in the name of the Holy Trinity, revealed at Christ's baptism.`,`പെരുന്നാളിനെ മാമോദീസയുമായി ബന്ധിപ്പിക്കാൻ — ക്രിസ്തുവിന്റെ മാമോദീസയിൽ വെളിപ്പെട്ട പരിശുദ്ധ ത്രിത്വത്തിന്റെ നാമത്തിൽ.`]}
  ]
 },
 {
  id:`r10`, icon:`🔥`,
  title:[`Feast of Pentecost`,`പെന്തിക്കോസ്തി പെരുന്നാൾ`],
  points:[
   [`A Moranaya feast commemorating the descent of the Holy Spirit on the apostles in St. Mark's house (Acts 2) — as a mighty wind and tongues of fire. "Pentecost" means "fiftieth".`,
    `വി. മർക്കോസിന്റെ ഭവനത്തിൽ കൂടിയിരുന്ന ശ്ലീഹന്മാരുടെ മേൽ പരിശുദ്ധാത്മാവ് ഇറങ്ങിയതിന്റെ ഓർമ്മയായ മോറാനായ പെരുന്നാൾ (അപ്പൊ. 2) — കൊടുങ്കാറ്റുപോലെയും അഗ്നിനാവുകളായും. "പെന്തിക്കോസ്തി" = "അമ്പതാമത്തേത്".`],
   [`In the Old Testament it was the feast of First fruits / feast of Weeks (Leviticus 23), 50 days after Passover; later it commemorated the Law given on Sinai.`,
    `പഴയനിയമത്തിൽ ആദ്യഫലപ്പെരുന്നാൾ / വാരോത്സവം (ലേവ്യ 23), പെസഹായ്ക്കു ശേഷം 50-ാം ദിവസം; പിന്നീട് സീനായിൽ ന്യായപ്രമാണം ലഭിച്ചതിന്റെ ഓർമ്മ.`],
   [`"Second Babel": at Babel (Genesis 11) pride divided languages; at Pentecost people of many tongues understood one message.`,
    `"രണ്ടാം ബാബേൽ": ബാബേലിൽ (ഉൽപത്തി 11) അഹങ്കാരം ഭാഷകളെ ഭിന്നിപ്പിച്ചു; പെന്തിക്കോസ്തിയിൽ പല ഭാഷക്കാർ ഒരേ സന്ദേശം മനസ്സിലാക്കി.`],

const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
let LANG = store.get('c12help-lang') || (store.get('ss_lang') === 'ml' ? 'ml' : 'both');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let TERM = '';
function hl(s){
  s = esc(s);
  if(!TERM) return s;
  const re = new RegExp('(' + TERM.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','gi');
  return s.replace(re,'<mark>$1</mark>');
}
function T(pair){
  if(LANG==='en') return `<span lang="en">${hl(pair[0])}</span>`;
  if(LANG==='ml') return `<span lang="ml" class="ml">${hl(pair[1])}</span>`;
  return `<span lang="en">${hl(pair[0])}</span><span lang="ml" class="ml sub2">${hl(pair[1])}</span>`;
}
function U(pair){ return LANG==='ml' ? pair[1] : pair[0]; }

function qaHTML(item, i, kind){
  const num = item.n ? `${esc(U(UI.exam))} · Q${item.n}` : (kind==='d' ? `${i+1}` : `${i+1}`);
  return `<div class="qa">
    <div class="q"><span class="qn ${item.n?'exam':''}">${num}</span><div>${T(item.q)}</div></div>
    <button class="reveal" type="button">${U(UI.show)}</button>
    <div class="ans"><div class="lbl">${U(UI.answer)}</div><div class="a">${T(item.a)}</div>
      ${item.why ? `<div class="why"><b>${U(UI.why)}:</b> ${T(item.why)}</div>` : ''}</div>
  </div>`;
}

function render(){
  document.documentElement.lang = LANG==='ml' ? 'ml' : 'en';
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===LANG));
  document.querySelectorAll('[data-t]').forEach(el => {
    const k = el.dataset.t;
    el.innerHTML = LANG==='both' && (k==='title'||k==='intro'||k==='note') ? T(UI[k]).replace(/<mark>|<\/mark>/g,'') : esc(U(UI[k]));
  });
  document.getElementById('q').placeholder = U(UI.search);

  const p = CH.reduce((s,c)=>s+c.points.length,0), d = CH.reduce((s,c)=>s+c.direct.length,0), ind = CH.reduce((s,c)=>s+c.indirect.length,0);
  document.getElementById('stats').innerHTML =
    [[CH.length,UI.units],[p,UI.keyPoints],[d,UI.qs],[ind,UI.think]].map(([n,l])=>`<div class="stat"><b>${n}</b>${esc(U(l))}</div>`).join('');

  const home = document.getElementById('home'), view = document.getElementById('unitView');
  const t = TERM.toLowerCase();
  const match = pair => !t || pair.some(x => x.toLowerCase().includes(t));

  if(t){
    home.hidden = true; view.hidden = false;
    document.getElementById('groupbar').innerHTML = ''; document.getElementById('numbar').innerHTML = '';
    document.querySelector('.pager').style.display='none';
    document.getElementById('backBtn').textContent = U(UI.allCh);
    let shown = 0;
    document.getElementById('units').innerHTML = CH.map(c => {
      const hit = match(c.title);
      const P = hit ? c.points : c.points.filter(match);
      const D = hit ? c.direct : c.direct.filter(x => match(x.q)||match(x.a)||(x.why&&match(x.why)));
      const I = hit ? c.indirect : c.indirect.filter(x => match(x.q)||match(x.a));
      if(!P.length && !D.length && !I.length) return '';
      shown++; return chapterHTML(c, P, D, I, false);
    }).join('');
    document.getElementById('empty').style.display = shown ? 'none' : 'block';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  if(!CUR){
    home.hidden = false; view.hidden = true;
    const book = (n, head, sub) => `<h2 class="bookhead">${esc(U(head))}<small>${esc(U(sub))}</small></h2>` +
      GROUPS.filter(g=>g.book===n).map(g => `<section class="group">${n===1?groupHead(g):''}<div class="grid" role="list">${CH.filter(c=>c.g===g).map(tileHTML).join('')}</div></section>`).join('');
    home.innerHTML = book(1, UI.book1, UI.book1s) + book(2, UI.book2, UI.book2s);
    return;
  }

  const k = CH.findIndex(c=>c.id===CUR), c = CH[k];
  home.hidden = true; view.hidden = false; document.querySelector('.pager').style.display='';
  document.getElementById('backBtn').textContent = U(UI.allCh);
  document.getElementById('groupbar').innerHTML = GROUPS.map(g =>
    `<button type="button" data-id="${g.chapters[0].id}" aria-current="${g===c.g}" title="${esc(U(g.title))}">${esc(U(g.short))}</button>`).join('');
  document.getElementById('numbar').innerHTML = CH.filter(x=>x.g===c.g).map(x =>
    `<button type="button" role="tab" data-id="${x.id}" aria-current="${x.id===CUR}" title="${esc(U(x.title))}">${x.code}</button>`).join('');
  document.getElementById('units').innerHTML = chapterHTML(c, c.points, c.direct, c.indirect, true);
  const prev = CH[k-1], next = CH[k+1];
  const pb = document.getElementById('prevBtn'), nb = document.getElementById('nextBtn');
  pb.disabled = !prev; nb.disabled = !next;
  pb.dataset.id = prev ? prev.id : ''; nb.dataset.id = next ? next.id : '';
  pb.innerHTML = prev ? `<small>← ${esc(U(UI.prev))}</small><b class="${LANG==='ml'?'ml':''}">${prev.code} · ${esc(U(prev.title))}</b>` : '';
  nb.innerHTML = next ? `<small>${esc(U(UI.next))} →</small><b class="${LANG==='ml'?'ml':''}">${next.code} · ${esc(U(next.title))}</b>` : '';
  [...document.querySelectorAll('#numbar [aria-current="true"], #groupbar [aria-current="true"]')].forEach(a=>a.scrollIntoView({block:'nearest',inline:'center'}));
}

function openUnit(id, push=true){
  CUR = id && byId(id) ? id : null;
  if(push){ try{ history.pushState(null,'', CUR ? '#'+CUR : location.pathname+location.search); }catch(e){} }
  render();
  window.scrollTo({top: CUR ? document.getElementById('unitView').offsetTop - 70 : 0, behavior:'smooth'});
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { LANG=b.dataset.lang; store.set('c12help-lang',LANG); if(LANG!=='both') store.set('ss_lang',LANG); render(); }));
document.getElementById('q').addEventListener('input', e => { TERM = e.target.value.trim(); render(); });
document.getElementById('practice').addEventListener('change', e => {
  document.body.classList.toggle('practice', e.target.checked);
  document.querySelectorAll('.qa.shown').forEach(q=>q.classList.remove('shown'));
});
document.getElementById('home').addEventListener('click', e => { const b = e.target.closest('.tile'); if(b) openUnit(b.dataset.id); });
document.getElementById('numbar').addEventListener('click', e => { const b = e.target.closest('button'); if(b) openUnit(b.dataset.id); });
document.getElementById('groupbar').addEventListener('click', e => { const b = e.target.closest('button'); if(b) openUnit(b.dataset.id); });
document.getElementById('prevBtn').addEventListener('click', e => openUnit(e.currentTarget.dataset.id));
document.getElementById('nextBtn').addEventListener('click', e => openUnit(e.currentTarget.dataset.id));
document.getElementById('backBtn').addEventListener('click', () => {
  if(TERM){ TERM=''; document.getElementById('q').value=''; }
  openUnit(null);
});
document.getElementById('units').addEventListener('click', e => {
  const r = e.target.closest('.reveal'); if(r) r.closest('.qa').classList.add('shown');
  if(CUR && e.target.closest('summary')) e.preventDefault();
  const a = e.target.closest('.secbtns a');
  if(a){ e.preventDefault(); const h = document.getElementById(a.getAttribute('href').slice(1)); if(h) h.scrollIntoView({behavior:'smooth'}); }
});
window.addEventListener('popstate', () => { const id = location.hash.slice(1); CUR = byId(id) ? id : null; render(); });
document.getElementById('printBtn').addEventListener('click', () => {
  const keep = CUR, keepTerm = TERM;
  TERM = ''; CUR = null;
  document.getElementById('home').hidden = true; document.getElementById('unitView').hidden = false;
  document.getElementById('units').innerHTML = CH.map(c=>chapterHTML(c,c.points,c.direct,c.indirect,false)).join('');
  window.print();
  CUR = keep; TERM = keepTerm; render();
});

const root = document.documentElement, themeBtn = document.getElementById('themeBtn');
const saved = store.get('ss_theme') || store.get('c12help-theme'); if(saved) root.dataset.theme = saved;
function isDark(){ return root.dataset.theme ? root.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function syncTheme(){ themeBtn.textContent = isDark() ? '☀' : '☾'; }
themeBtn.addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; store.set('c12help-theme', root.dataset.theme); store.set('ss_theme', root.dataset.theme); syncTheme(); });
syncTheme();

{ const id = location.hash.slice(1); CUR = byId(id) ? id : null; }
render();
</script>

<script src="chatbot.js?v=5" defer></script>
