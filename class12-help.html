<meta name="description" content="OSSAE Class 12 chapter-wise study help — key points and questions & answers in English and Malayalam.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --muted:#5c6577; --line:#e5dfd3;
  --brand:#1f3160; --brand-soft:#e9edf6; --gold:#b8862b; --gold-soft:#fbf3e2;
  --ok:#1f7a4d; --ok-soft:#e7f5ee; --chip:#efe9dd;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(60,40,10,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161c; --card:#1d2029; --ink:#eceef3; --muted:#a3abbb; --line:#2e323e;
    --brand:#e0b25a; --brand-soft:#2a2512; --gold:#e3b862; --gold-soft:#332a19;
    --ok:#6fd3a0; --ok-soft:#1b3328; --chip:#272b36; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#14161c; --card:#1d2029; --ink:#eceef3; --muted:#a3abbb; --line:#2e323e;
  --brand:#e0b25a; --brand-soft:#2a2512; --gold:#e3b862; --gold-soft:#332a19;
  --ok:#6fd3a0; --ok-soft:#1b3328; --chip:#272b36; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans","Noto Sans Malayalam",system-ui,sans-serif}
.ml,[lang="ml"]{font-family:"Noto Sans Malayalam","Noto Sans",sans-serif}
a{color:var(--brand)}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#14213d,#1f3160);border-bottom:3px solid #e0b25a;color:#fff}
header.top .brand{color:#fff}
header.top .brand small{color:#c8cfe0}
header.top .brand img{background:#fff;border-radius:999px;padding:3px}
header.top .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
header.top .seg button{color:#dfe4f0}
header.top .seg button[aria-pressed="true"]{background:#e0b25a;color:#1a1405}
header.top .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0;flex:1}
.brand img{width:38px;height:38px;object-fit:contain}
.brand b{display:block;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .short{display:none}
.brand small{display:block;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px/1 inherit;padding:8px 11px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1d2029}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#1d2029}}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}

.hero{padding:28px 0 8px}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:4px 10px;border-radius:999px}
h1{font-family:"Noto Serif",Georgia,serif;font-size:clamp(26px,5vw,38px);line-height:1.2;margin:12px 0 6px}
.hero p{color:var(--muted);margin:0 0 4px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--ink)}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;outline:0;background:none;color:var(--ink);font:inherit;padding:10px 0;width:100%}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--brand);width:16px;height:16px}
:root[data-theme="dark"] a.btn[href="class12.html"]{color:#1a1405!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a.btn[href="class12.html"]{color:#1a1405!important}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}

.group{margin:8px 0 22px}
.ghead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.ghead .gno{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:var(--brand);border-radius:8px;padding:3px 9px;white-space:nowrap}
:root[data-theme="dark"] .ghead .gno{color:#1d2029}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ghead .gno{color:#1d2029}}
.ghead h2{margin:0;font-size:18px;line-height:1.35}
.ghead h2 .sub{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.bookhead{font-family:"Noto Serif",Georgia,serif;font-size:22px;margin:30px 0 4px;padding-top:16px;border-top:2px solid var(--line)}
.bookhead small{display:block;font-family:"Noto Sans",sans-serif;font-size:13px;color:var(--muted);font-weight:400}
.groupbar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.groupbar button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.groupbar button[aria-current="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.qn.exam{background:var(--gold-soft);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:6px 0 22px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,background .15s;min-height:150px}
.tile:hover{transform:translateY(-2px);border-color:var(--brand)}
.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile .tt{display:flex;align-items:center;gap:10px}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:19px;flex:none}
.tile .no{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.tile .nm{font-weight:700;line-height:1.35}
.tile .nm .sub{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.tile .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.tile .meta span{font-size:11.5px;background:var(--chip);color:var(--muted);border-radius:999px;padding:2px 8px}

.numbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.numbar button{flex:none;min-width:38px;padding:0 10px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px inherit;font-family:inherit;cursor:pointer}
.numbar button[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.backbtn{border:0;background:none;color:var(--brand);font:600 15px inherit;font-family:inherit;cursor:pointer;padding:6px 0;margin:4px 0 6px}
.pager{display:flex;gap:10px;margin:4px 0 22px}
.pager button{flex:1;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;min-width:0}
.pager button.next{text-align:right}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager button:disabled{visibility:hidden}
.secbtns{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 2px}
.secbtns a{text-decoration:none;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:6px 12px}
.view-unit .unit>summary{cursor:default}
.view-unit .unit>summary .caret{display:none}
.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden;scroll-margin-top:72px}
.unit>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:16px 18px}
h3{scroll-margin-top:72px}
.unit>summary::-webkit-details-marker{display:none}
.unum{flex:none;width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:20px}
.uhead{flex:1;min-width:0}
.uhead small{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.uhead h2{margin:2px 0 0;font-size:18px;line-height:1.35}
.uhead .sub{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.caret{flex:none;color:var(--muted);transition:transform .2s}
.unit[open] .caret{transform:rotate(180deg)}
.ubody{padding:0 18px 18px;border-top:1px solid var(--line)}
h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
h3 .count{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px;letter-spacing:0}

ul.points{margin:0;padding:0;list-style:none;display:grid;gap:10px}
ul.points li{background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px}
.sub2{display:block;color:var(--muted);margin-top:4px;font-size:.96em}

.qa{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.q{font-weight:600;display:flex;gap:10px}
.qn{flex:none;font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 7px;height:fit-content;margin-top:2px}
.q .sub2{font-weight:400}
.ans{margin-top:10px;background:var(--ok-soft);border-radius:8px;padding:10px 12px}
.ans .lbl{font-size:12px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.ans .a{font-weight:600}
.why{margin-top:6px;font-size:14px;color:var(--muted)}
.why b{color:var(--ink)}
.reveal{margin-top:10px;border:1px dashed var(--ok);color:var(--ok);background:none;border-radius:8px;padding:7px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
body.practice .qa:not(.shown) .ans{display:none}
body:not(.practice) .reveal{display:none}
body.practice .qa.shown .reveal{display:none}

.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);margin:8px 0 22px}
.empty{display:none;text-align:center;color:var(--muted);padding:30px 0}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 0 40px}
.hidden{display:none!important}
mark{background:#ffe58a;color:#1d2433;border-radius:3px}

@media (max-width:560px){
  .brand small,.brand .full{display:none}
  .brand .short{display:block}
  .seg button{padding:8px 9px}
  .unit>summary{padding:14px}
  .ubody{padding:0 14px 14px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:12px;min-height:140px}
  .tile .nm{font-size:14.5px}
  .tile .nm .sub{font-size:13px}
}
@media print{
  header.top,.tools,.grid,.numbar,.backbtn,.pager,.secbtns,.reveal,.iconbtn{display:none!important}
  body{background:#fff;color:#000}
  .unit{break-inside:auto;box-shadow:none}
  .unit .ubody{display:block!important}
  body.practice .qa .ans{display:block!important}
  .qa{break-inside:avoid}
}
</style>

<script>
const BOOK1 = [], BOOK2 = [];
// UNIT 1 — Missionary Movement and Monasticism
BOOK1.push({
 id:`u1`, title:[`Missionary Movement and Monasticism`,`മിഷനറി പ്രസ്ഥാനവും സന്യാസ പ്രസ്ഥാനവും`],
 chapters:[
 {
  id:`u1c1`, icon:`✝`,
  title:[`The Concept of Mission in the Holy Bible`,`മിഷൻ എന്ന ആശയം വേദപുസ്തകത്തിൽ`],
  points:[
   [`Jesus chose twelve disciples, trained them for over three years and sent them to announce the Gospel of the Kingdom. St. Thomas was sent to India.`,
    `യേശു പന്ത്രണ്ടു ശിഷ്യന്മാരെ തെരഞ്ഞെടുത്ത് മൂന്നിലധികം വർഷം പരിശീലിപ്പിച്ച് ദൈവരാജ്യത്തിന്റെ സുവിശേഷം അറിയിക്കുവാൻ അയച്ചു. മാർത്തോമ്മാ ശ്ലീഹായെ ഇന്ത്യയിലേക്ക് അയച്ചു.`],
   [`"Sleeha" (Syriac) means "the one who is sent". Greek: Apostolos; Latin: missionary.`,
    `"ശ്ലീഹാ" (സുറിയാനി) = അയയ്ക്കപ്പെട്ടവൻ. ഗ്രീക്കിൽ "അപ്പോസ്തോലോസ്", ലത്തീനിൽ "മിഷനറി".`],
   [`At Nazareth synagogue Jesus read Isaiah 61:1–2 (Luke 4:18) — good news to the poor, healing, freedom. This is Christ's proclamation (Korusooso). Mission is not mere preaching; it includes healing and social transformation.`,
    `നസറെത്തിലെ സിനഗോഗിൽ യേശു യെശയ്യാവ് 61:1–2 വായിച്ചു (ലൂക്കൊസ് 4:18) — ദരിദ്രരോട് സുവിശേഷം, സൗഖ്യം, വിടുതൽ. ഇതാണ് ക്രിസ്തുവിന്റെ സുവിശേഷഘോഷണം (കോറൂസൂസോ). മിഷൻ വെറും പ്രസംഗമല്ല; സൗഖ്യവും സാമൂഹ്യ പരിവർത്തനവും അതിൽ ഉൾപ്പെടുന്നു.`],
   [`Matthew 10 describes sending the Twelve; Luke 10:1 the seventy (another tradition: seventy-two). They were to go with no money bag, knapsack or extra clothes — in simplicity and peace.`,
    `മത്തായി 10-ൽ പന്ത്രണ്ടു പേരെ അയയ്ക്കുന്നതും ലൂക്കൊസ് 10:1-ൽ എഴുപതു പേരെ (മറ്റൊരു പാരമ്പര്യപ്രകാരം എഴുപത്തിരണ്ട്) അയയ്ക്കുന്നതും കാണാം. പണസഞ്ചിയോ ഭാണ്ഡമോ അധിക വസ്ത്രമോ ഇല്ലാതെ, ലാളിത്യത്തോടും സമാധാനത്തോടും കൂടെ പോകണം.`],
   [`Matthew 10:5: "Do not go among the Gentiles… go to the lost sheep of Israel." Western theologians call this "domestic mission". After the Resurrection came the universal mission to all nations (Matthew 28:16–20; Mark 16:15–16; Luke 24:47).`,
    `മത്തായി 10:5: "ജാതികളുടെ അടുക്കൽ പോകാതെ… യിസ്രായേൽ ഗൃഹത്തിലെ കാണാതെപോയ ആടുകളുടെ അടുക്കൽ പോകുവിൻ." പാശ്ചാത്യ ദൈവശാസ്ത്രജ്ഞർ ഇതിനെ "ആഭ്യന്തര മിഷൻ" എന്നു വിളിക്കുന്നു. ഉയിർപ്പിനു ശേഷമാണ് സകല ജാതികളിലേക്കുമുള്ള സാർവ്വത്രിക മിഷൻ (മത്തായി 28:16–20; മർക്കൊസ് 16:15–16; ലൂക്കൊസ് 24:47).`],
   [`Orthodox view: the two models should not be separated. The Gospel of peace must never be forced on anyone; missionaries must live simply, sacrificially, and stand for truth and justice.`,
    `ഓർത്തഡോക്സ് വീക്ഷണം: ഈ രണ്ടു മാതൃകകളെയും വേർതിരിക്കരുത്. സമാധാനത്തിന്റെ സുവിശേഷം ആരുടെ മേലും അടിച്ചേൽപ്പിക്കരുത്; സുവിശേഷകർ ലളിതജീവിതവും ത്യാഗമനോഭാവവും പുലർത്തി സത്യത്തിനും നീതിക്കും വേണ്ടി നിലകൊള്ളണം.`]
  ],
  direct:[
   {n:1, q:[`Choose the statement that is NOT true regarding Jesus sending His disciples out to preach.`,`യേശുവിന്റെ ശിഷ്യന്മാരെ സുവിശേഷ പ്രവർത്തനത്തിനായി അയക്കുന്നതുമായി ബന്ധപ്പെട്ട് യോജിക്കാത്ത പ്രസ്താവന?`],
    a:[`"Matthew 10:5 records that disciples have to go out to all nations and preach the gospel."`,`"സകല ജാതികളുടെയും അടുത്ത് പോയി സുവിശേഷം അറിയിക്കുവാൻ മത്തായി 10:5-ൽ രേഖപ്പെടുത്തിയിരിക്കുന്നു."`],
    why:[`Matthew 10:5 says NOT to go to the Gentiles. "All nations" is Matthew 28:19.`,`മത്തായി 10:5 ജാതികളുടെ അടുക്കൽ പോകരുത് എന്നാണ് പറയുന്നത്. "സകല ജാതികളും" മത്തായി 28:19-ൽ ആണ്.`]},
   {q:[`What is the meaning of the Syriac word "Sleeha"?`,`"ശ്ലീഹാ" എന്ന സുറിയാനി വാക്കിന്റെ അർത്ഥം?`],
    a:[`The one who is sent (apostle).`,`അയയ്ക്കപ്പെട്ടവൻ (അപ്പോസ്തോലൻ).`]},
   {q:[`What is the Greek and the Latin equivalent of "Sleeha"?`,`"ശ്ലീഹാ" എന്ന വാക്കിന് തുല്യമായ ഗ്രീക്ക്, ലത്തീൻ വാക്കുകൾ?`],
    a:[`Greek: Apostolos. Latin: missionary.`,`ഗ്രീക്ക്: അപ്പോസ്തോലോസ്. ലത്തീൻ: മിഷനറി.`]},
   {q:[`Which passage did Jesus read in the synagogue of Nazareth at the start of His ministry?`,`പരസ്യശുശ്രൂഷയുടെ ആരംഭത്തിൽ നസറെത്തിലെ സിനഗോഗിൽ യേശു വായിച്ച വേദഭാഗം?`],
    a:[`Isaiah 61:1–2, recorded in Luke 4:18 — "The Spirit of the Lord is upon Me…"`,`യെശയ്യാവ് 61:1–2 (ലൂക്കൊസ് 4:18) — "കർത്താവിന്റെ ആത്മാവ് എന്റെ മേൽ ഉണ്ട്…"`]},
   {q:[`What is Christ's proclamation of the gospel called in Syriac?`,`ക്രിസ്തുവിന്റെ സുവിശേഷഘോഷണത്തിന് സുറിയാനിയിൽ പറയുന്ന പേര്?`],
    a:[`Korusooso`,`കോറൂസൂസോ`]},
   {q:[`How many preachers did Jesus send according to Luke 10?`,`ലൂക്കൊസ് 10 അനുസരിച്ച് യേശു എത്ര സുവിശേഷകരെ അയച്ചു?`],
    a:[`Seventy (another tradition says seventy-two).`,`എഴുപത് (മറ്റൊരു പാരമ്പര്യപ്രകാരം എഴുപത്തിരണ്ട്).`]}
  ],
  indirect:[
   {q:[`Why does Matthew record that the disciples were first sent only to Israel?`,`ശിഷ്യന്മാരെ ആദ്യം യിസ്രായേലിലേക്കു മാത്രം അയച്ചതായി മത്തായി രേഖപ്പെടുത്തുന്നത് എന്തുകൊണ്ട്?`],
    a:[`The Jews were waiting for the Messiah. Matthew wanted to show that Jesus of Nazareth is that promised Messiah. Yet Jesus never limited His gospel to the Jews — He healed many Gentiles too.`,`യെഹൂദർ മശിഹായെ കാത്തിരിക്കുകയായിരുന്നു. നസറെത്തിലെ യേശുവാണ് ആ വാഗ്ദത്ത മശിഹാ എന്ന് വ്യക്തമാക്കാനാണ് മത്തായി അങ്ങനെ എഴുതിയത്. എങ്കിലും യേശു തന്റെ സുവിശേഷം യെഹൂദരിൽ ഒതുക്കിയില്ല — അനേകം ജാതികളെയും സൗഖ്യമാക്കി.`]},
   {q:[`Why is the word "mission" looked upon with fear in our Church?`,`നമ്മുടെ സഭയിൽ "മിഷൻ" എന്ന വാക്കിനെ ഭയത്തോടെ കാണുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Because the Europeans who came with the Portuguese tried to convert the ancient Indian Church to their folds by force, using the gospel for it.`,`പോർച്ചുഗീസുകാരോടൊപ്പം വന്ന യൂറോപ്യർ സുവിശേഷത്തിന്റെ പേരിൽ പുരാതന ഭാരതസഭയെ ബലമായി അവരുടെ സഭകളിലേക്ക് ചേർക്കാൻ ശ്രമിച്ചതുകൊണ്ട്.`]},
   {q:[`Is mission only preaching? Explain from Jesus' example.`,`മിഷൻ എന്നത് പ്രസംഗം മാത്രമാണോ? യേശുവിന്റെ മാതൃകയിൽ വിശദീകരിക്കുക.`],
    a:[`No. Jesus healed soul, body and mind, opposed exploitation by religious leaders, and gave His life for what He taught. Freedom, equality and brotherhood are values of the Kingdom.`,`അല്ല. യേശു ആത്മാവിനും ശരീരത്തിനും മനസ്സിനും സൗഖ്യം നൽകി, മതനേതാക്കളുടെ ചൂഷണത്തെ എതിർത്തു, താൻ പഠിപ്പിച്ചതിനുവേണ്ടി ജീവൻ നൽകി. സ്വാതന്ത്ര്യം, സമത്വം, സാഹോദര്യം എന്നിവ ദൈവരാജ്യത്തിന്റെ മൂല്യങ്ങളാണ്.`]}
  ]
 },
 {
  id:`u1c2`, icon:`🌍`,
  title:[`The Orthodox Church and the Missionary Movement`,`ഓർത്തഡോക്സ് സഭയും മിഷണറി പ്രസ്ഥാനവും`],
  points:[
   [`The Orthodox Church does not believe in converting others "by hook or crook". Its duty is to announce the Kingdom and work for human good and social transformation, like Jesus.`,
    `ഏതു വിധേനയും മറ്റുള്ളവരെ മതം മാറ്റുന്നതിൽ ഓർത്തഡോക്സ് സഭ വിശ്വസിക്കുന്നില്ല. ദൈവരാജ്യം അറിയിക്കുകയും യേശുവിന്റെ മാതൃകയിൽ മനുഷ്യനന്മയ്ക്കും സാമൂഹ്യ പരിവർത്തനത്തിനുമായി പ്രവർത്തിക്കുകയുമാണ് സഭയുടെ കടമ.`],
   [`The Persian Church (Church of the East) spread up to China by the 9th century. Greek missionaries Cyril and Methodius evangelised the Slavs, made a Slavonic script and translated the Bible — without force or colonial power.`,
    `പേർഷ്യൻ സഭ (പൗരസ്ത്യ സഭ) ഒൻപതാം നൂറ്റാണ്ടോടെ ചൈന വരെ വ്യാപിച്ചു. ഗ്രീക്ക് മിഷനറിമാരായ സിറിലും മെഥോഡിയസും സ്ലാവ് ജനതയെ സുവിശേഷീകരിച്ചു, സ്ലാവോണിക് ലിപി ഉണ്ടാക്കി, വേദപുസ്തകം പരിഭാഷപ്പെടുത്തി — ബലപ്രയോഗമോ കൊളോണിയൽ അധികാരമോ ഇല്ലാതെ.`],
   [`"Liturgy after the Liturgy": in Greek "liturgy" means service. The first liturgy is service to God; the second is service to human beings. True worship is complete only when both are joined.`,
    `"ലിറ്റർജിക്കു ശേഷമുള്ള ലിറ്റർജി": ഗ്രീക്കിൽ "ലിറ്റർജി" = സേവനം, ശുശ്രൂഷ. ആദ്യത്തെ ലിറ്റർജി ദൈവസേവനം; രണ്ടാമത്തേത് മനുഷ്യസേവനം. രണ്ടും ചേരുമ്പോഴാണ് യഥാർത്ഥ ആരാധന പൂർണ്ണമാകുന്നത്.`],
   [`"God so loved the world" (John 3:16). God hates sin but loves sinners; the Church must love the world in order to transform it.`,
    `"ദൈവം ലോകത്തെ അത്രമേൽ സ്നേഹിച്ചു" (യോഹന്നാൻ 3:16). ദൈവം പാപത്തെ വെറുക്കുന്നു, പാപിയെ സ്നേഹിക്കുന്നു; ലോകത്തെ രൂപാന്തരപ്പെടുത്താനായി സഭ അതിനെ സ്നേഹിക്കണം.`],
   [`Mission is a fundamental character of the Holy Trinity — one and three in eternal mutual love. The goal: all humans and all creation should be transformed and share in the divine nature.`,
    `മിഷൻ പരിശുദ്ധ ത്രിത്വത്തിന്റെ അടിസ്ഥാന സ്വഭാവമാണ് — നിത്യ പരസ്പര സ്നേഹത്തിൽ ഏകനും ത്രിയേകനും. ലക്ഷ്യം: എല്ലാ മനുഷ്യരും സർവ്വസൃഷ്ടിയും രൂപാന്തരപ്പെട്ട് ദൈവിക സ്വഭാവത്തിൽ പങ്കാളികളാകുക.`]
  ],
  direct:[
   {n:2, q:[`In the phrase "liturgy after liturgy", which word best describes the second liturgy?`,`"ലിറ്റർജി ആഫ്റ്റർ ലിറ്റർജി" എന്ന പ്രയോഗത്തിൽ രണ്ടാമത്തെ ലിറ്റർജിയോട് ഏറ്റവും അനുയോജ്യമായ വാക്ക്?`],
    a:[`Human service`,`മനുഷ്യസേവനം`],
    why:[`The first liturgy is service to God; the second is service to human beings.`,`ആദ്യത്തെ ലിറ്റർജി ദൈവസേവനം; രണ്ടാമത്തേത് മനുഷ്യസേവനം.`]},
   {q:[`What does the Greek word "liturgy" mean?`,`ഗ്രീക്കിൽ "ലിറ്റർജി" എന്ന വാക്കിന്റെ അർത്ഥം?`],
    a:[`Service; nursing (care).`,`സേവനം, ശുശ്രൂഷ.`]},
   {q:[`Which Church spread up to China through evangelism in the ninth century?`,`ഒൻപതാം നൂറ്റാണ്ടിൽ സുവിശേഷവേലയിലൂടെ ചൈന വരെ വ്യാപിച്ച സഭ?`],
    a:[`The Persian Church (Church of the East), headquartered in Mesopotamia.`,`മെസപ്പൊട്ടാമിയ ആസ്ഥാനമായ പേർഷ്യൻ സഭ (പൗരസ്ത്യ സഭ).`]},
   {q:[`Who evangelised the Slavs and made a script for the Slavonic language?`,`സ്ലാവ് ജനതയെ സുവിശേഷീകരിക്കുകയും സ്ലാവോണിക് ഭാഷയ്ക്ക് ലിപി ഉണ്ടാക്കുകയും ചെയ്തവർ?`],
    a:[`Cyril and Methodius, Greek Orthodox missionaries (9th century).`,`ഗ്രീക്ക് ഓർത്തഡോക്സ് മിഷനറിമാരായ സിറിലും മെഥോഡിയസും (9-ാം നൂറ്റാണ്ട്).`]}
  ],
  indirect:[
   {q:[`Some say the Orthodox Church is not a missionary church. How would you answer?`,`ഓർത്തഡോക്സ് സഭ ഒരു മിഷനറി സഭയല്ല എന്നു ചിലർ പറയുന്നു. എങ്ങനെ മറുപടി നൽകാം?`],
    a:[`We do not follow the Western model of conversion, but the Orthodox Church has a rich mission history (Persian Church, Cyril & Methodius) and believes worship and mission go together — "liturgy after the Liturgy".`,`പാശ്ചാത്യ മതപരിവർത്തന മാതൃക നാം പിന്തുടരുന്നില്ല; എങ്കിലും ഓർത്തഡോക്സ് സഭയ്ക്ക് സമ്പന്നമായ മിഷൻ ചരിത്രമുണ്ട് (പേർഷ്യൻ സഭ, സിറിൽ & മെഥോഡിയസ്). ആരാധനയും മിഷനും ഒന്നിച്ചു പോകുന്നു — "ലിറ്റർജിക്കു ശേഷമുള്ള ലിറ്റർജി".`]},
   {q:[`What kind of "mission work" does the Orthodox Church reject?`,`ഏതു തരം "മിഷൻ പ്രവർത്തനത്തെ" ആണ് ഓർത്തഡോക്സ് സഭ തള്ളിക്കളയുന്നത്?`],
    a:[`Enlisting members through coercion, political pressure, or offers of money or jobs.`,`ബലപ്രയോഗം, രാഷ്ട്രീയ സമ്മർദ്ദം, പണമോ ജോലിയോ വാഗ്ദാനം ചെയ്യൽ എന്നിവയിലൂടെ ആളുകളെ സഭയിൽ ചേർക്കുന്നത്.`]},
   {q:[`How is the Holy Trinity a model for mission?`,`പരിശുദ്ധ ത്രിത്വം മിഷന് മാതൃകയാകുന്നത് എങ്ങനെ?`],
    a:[`The three Persons live in eternal mutual love, respecting each one's individuality while being one. Mission should likewise build mutual respect, cooperation and fair coexistence.`,`മൂന്ന് ആളത്വങ്ങൾ നിത്യ പരസ്പര സ്നേഹത്തിൽ, ഓരോരുത്തരുടെയും വ്യക്തിത്വം മാനിച്ചുകൊണ്ട് ഏകമായി വസിക്കുന്നു. മിഷനും അതുപോലെ പരസ്പര ബഹുമാനം, സഹകരണം, നീതിപൂർവ്വമായ സഹവർത്തിത്വം എന്നിവ വളർത്തണം.`]}
  ]
 },
 {
  id:`u1c3`, icon:`⛪`,
  title:[`Malankara Orthodox Church and Mission Activities`,`മലങ്കര ഓർത്തഡോക്സ് സഭയും മിഷൻ പ്രവർത്തനങ്ങളും`],
  points:[
   [`The Malankara Church came from the mission of St. Thomas, so the spirit of evangelism must be built into it. Fathers who worked for mission: St. Gregorios of Parumala, Pathrose Mar Osthathios, Dr. Geevarghese Mar Osthathios, Stephanos Mar Thevodosios; also K. I. Philip Ramban.`,
    `മാർത്തോമ്മാ ശ്ലീഹായുടെ മിഷനിലൂടെയാണ് മലങ്കരസഭ ഉണ്ടായത്; അതിനാൽ സുവിശേഷ തീക്ഷ്ണത സഭയുടെ സ്വഭാവമാകണം. മിഷനുവേണ്ടി പ്രവർത്തിച്ച പിതാക്കന്മാർ: പരുമല മാർ ഗ്രീഗോറിയോസ്, പത്രോസ് മാർ ഒസ്താത്തിയോസ്, ഡോ. ഗീവർഗീസ് മാർ ഒസ്താത്തിയോസ്, സ്തേഫാനോസ് മാർ തേവോദോസ്യോസ്; കെ. ഐ. ഫിലിപ്പ് റമ്പാനും.`],
   [`St. Gregorios of Parumala worked for the Dalits and believed equality and justice grow through education.`,
    `പരുമല തിരുമേനി ദളിതരുടെ ഉന്നമനത്തിനായി പ്രവർത്തിച്ചു; വിദ്യാഭ്യാസത്തിലൂടെ സമത്വബോധവും നീതിചിന്തയും വളരുമെന്ന് കണ്ട് പ്രവർത്തിച്ചു.`],
   [`Pathrose Mar Osthathios founded the "Servants of the Cross" (Sleebadasa Samooham), lived simply, and went on strike for the right of Pulayas, Parayas and others to walk on public roads.`,
    `പത്രോസ് മാർ ഒസ്താത്തിയോസ് "സ്ലീബാദാസ സമൂഹം" സ്ഥാപിച്ചു; ലളിതമായി ജീവിച്ചു; പുലയർ, പറയർ തുടങ്ങിയവർക്ക് പൊതുവഴിയിലൂടെ നടക്കാനുള്ള അവകാശത്തിനായി സമരം ചെയ്തു.`],
   [`Geevarghese Mar Osthathios: "true Christianity is a religion of love"; he worked for social justice. Stephanos Mar Thevodosios was the humble missionary of the Church in North India.`,
    `ഗീവർഗീസ് മാർ ഒസ്താത്തിയോസ്: "യഥാർത്ഥ ക്രിസ്തുമതം സ്നേഹത്തിന്റെ മതമാണ്"; സാമൂഹ്യനീതിക്കായി പ്രവർത്തിച്ചു. സ്തേഫാനോസ് മാർ തേവോദോസ്യോസ് ഉത്തരേന്ത്യയിലെ സഭയുടെ വിനീതനായ മിഷനറിയായിരുന്നു.`],
   [`Dialogue with other religions and modern thought is also mission: Dr. Paulose Mar Gregorios, Fr. Dr. V. C. Samuel, Fr. Dr. T. J. Joshua.`,
    `മറ്റു മതങ്ങളോടും ആധുനിക ചിന്തകളോടുമുള്ള സംവാദവും മിഷനാണ്: ഡോ. പൗലോസ് മാർ ഗ്രീഗോറിയോസ്, ഫാ. ഡോ. വി. സി. ശമുവേൽ, ഫാ. ഡോ. ടി. ജെ. ജോഷ്വാ.`],
   [`Brahmavar Mission (near Udupi): founded by Fr. Antonio Francis Xavier Alvares; about 1000 families joined the Orthodox Church. He was consecrated Alvares Mar Julius on 29 July 1889 at the Old Seminary; died 23 September 1923.`,
    `ബ്രഹ്മവാർ മിഷൻ (ഉഡുപ്പിക്കടുത്ത്): ഫാ. അന്റോണിയോ ഫ്രാൻസിസ് സേവ്യർ അൽവാറീസ് സ്ഥാപിച്ചു; ഏകദേശം 1000 കുടുംബങ്ങൾ ഓർത്തഡോക്സ് സഭയിൽ ചേർന്നു. 1889 ജൂലൈ 29-ന് പഴയസെമിനാരിയിൽ അൽവാറീസ് മാർ യൂലിയോസ് എന്ന പേരിൽ മെത്രാപ്പോലീത്തയായി; 1923 സെപ്റ്റംബർ 23-ന് കാലം ചെയ്തു.`]
  ],
  direct:[
   {n:3, q:[`Which of the following is NOT correct?`,`തന്നിരിക്കുന്നവയിൽ ശരിയല്ലാത്ത പരാമർശം ഏത്?`],
    a:[`"Pathrose Mar Osthathios Thirumeni wrote a book about the journey to Jerusalem."`,`"പത്രോസ് മാർ ഒസ്താത്തിയോസ് തിരുമേനി യെരുശലേം യാത്രയെക്കുറിച്ച് പുസ്തകം എഴുതി."`],
    why:[`The Jerusalem travelogue was written by Parumala Thirumeni. Pathrose Mar Osthathios fought for the Pulayas.`,`യെരുശലേം യാത്രാവിവരണം എഴുതിയത് പരുമല തിരുമേനി. പത്രോസ് മാർ ഒസ്താത്തിയോസ് പുലയർക്കായി സമരം ചെയ്തു.`]},
   {n:23, q:[`The President of the Mission Board of the Malankara Church (as given in the 2025 paper).`,`നമ്മുടെ മിഷൻ ബോർഡിന്റെ അധ്യക്ഷൻ (2025 ചോദ്യപേപ്പർ പ്രകാരം).`],
    a:[`H.G. Yuhanon Mar Theodorus`,`യൂഹാനോൻ മാർ തേവോദോറോസ് തിരുമേനി`],
    why:[`The textbook says the Mission Board was founded by Dr. Geevarghese Mar Osthathios. Office-holders change — confirm the current president with your teacher.`,`മിഷൻ ബോർഡ് സ്ഥാപിച്ചത് ഡോ. ഗീവർഗീസ് മാർ ഒസ്താത്തിയോസ് എന്ന് പാഠപുസ്തകം പറയുന്നു. സ്ഥാനികൾ മാറാം — നിലവിലെ അധ്യക്ഷനെ അധ്യാപകനോട് ചോദിച്ച് ഉറപ്പാക്കുക.`]},
   {q:[`Which society did Pathrose Mar Osthathios found?`,`പത്രോസ് മാർ ഒസ്താത്തിയോസ് സ്ഥാപിച്ച സമൂഹം?`],
    a:[`Servants of the Cross (Sleebadasa Samooham).`,`സ്ലീബാദാസ സമൂഹം (Servants of the Cross).`]},
   {q:[`Who taught that "true Christianity is a religion of love"?`,`"യഥാർത്ഥ ക്രിസ്തുമതം സ്നേഹത്തിന്റെ മതമാണ്" എന്നു പഠിപ്പിച്ചത് ആര്?`],
    a:[`Dr. Geevarghese Mar Osthathios.`,`ഡോ. ഗീവർഗീസ് മാർ ഒസ്താത്തിയോസ്.`]},
   {q:[`Who founded the Brahmavar Mission, and under what name was he consecrated?`,`ബ്രഹ്മവാർ മിഷൻ സ്ഥാപിച്ചത് ആര്? ഏതു പേരിലാണ് അദ്ദേഹം മെത്രാനായി വാഴിക്കപ്പെട്ടത്?`],
    a:[`Fr. Antonio Francis Xavier Alvares — consecrated as Alvares Mar Julius on 29 July 1889.`,`ഫാ. അന്റോണിയോ ഫ്രാൻസിസ് സേവ്യർ അൽവാറീസ് — 1889 ജൂലൈ 29-ന് അൽവാറീസ് മാർ യൂലിയോസ് എന്ന പേരിൽ.`]},
   {q:[`Who was the missionary of the Malankara Church in North India?`,`ഉത്തരേന്ത്യയിൽ മലങ്കരസഭയുടെ മിഷനറിയായി പ്രവർത്തിച്ചത് ആര്?`],
    a:[`Stephanos Mar Thevodosios.`,`സ്തേഫാനോസ് മാർ തേവോദോസ്യോസ്.`]}
  ],
  indirect:[
   {q:[`Why do some say the Malankara Church lost its missionary passion?`,`മലങ്കരസഭയ്ക്ക് മിഷനറി തീക്ഷ്ണത നഷ്ടപ്പെട്ടു എന്ന് ചിലർ പറയുന്നത് എന്തുകൊണ്ട്?`],
    a:[`It lived peacefully as a small community within the caste system and could not correct it or build a society based on equality.`,`ജാതിവ്യവസ്ഥയുള്ള സമൂഹത്തിൽ ഒരു ചെറിയ സമൂഹമായി സമാധാനത്തോടെ കഴിഞ്ഞു; ജാതിവ്യവസ്ഥ തിരുത്താനോ സമത്വത്തിൽ അധിഷ്ഠിതമായ സമൂഹം കെട്ടിപ്പടുക്കാനോ കഴിഞ്ഞില്ല.`]},
   {q:[`How is dialogue with other religions part of mission?`,`മറ്റു മതങ്ങളുമായുള്ള സംവാദം മിഷന്റെ ഭാഗമാകുന്നത് എങ്ങനെ?`],
    a:[`As a minority in India, we must respond to Indian culture, science and modern ideologies with Christ's love and wisdom — as Dr. Paulose Mar Gregorios and the Cappadocian Fathers did.`,`ഇന്ത്യയിൽ ന്യൂനപക്ഷമായ നാം ഭാരതീയ സംസ്കാരത്തോടും ശാസ്ത്രത്തോടും ആധുനിക ചിന്തകളോടും ക്രിസ്തുസ്നേഹത്തോടും ജ്ഞാനത്തോടും കൂടെ പ്രതികരിക്കണം — ഡോ. പൗലോസ് മാർ ഗ്രീഗോറിയോസും കപ്പദോക്യൻ പിതാക്കന്മാരും ചെയ്തതുപോലെ.`]},
   {q:[`Who coordinates the mission activities of the Church today?`,`ഇന്ന് സഭയുടെ മിഷൻ പ്രവർത്തനങ്ങൾ ഏകോപിപ്പിക്കുന്നത് ആര്?`],
    a:[`The Mission Board, presided over by His Holiness the Catholicos (as per the textbook).`,`പരിശുദ്ധ കാതോലിക്കാ ബാവാ അധ്യക്ഷനായ മിഷൻ ബോർഡ് (പാഠപുസ്തകം പ്രകാരം).`]}
  ]
 },
 {
  id:`u1c4`, icon:`🕊`,
  title:[`Monastic Movement and Missionary Work`,`സന്യാസപ്രസ്ഥാനവും മിഷണറി പ്രവർത്തനവും`],
  points:[
   [`In the 3rd century ascetics arose in Egypt, Syria and Palestine. St. Antony was a famous hermit. St. Pachomius founded community (cenobitic) monasticism — this gave rise to Dayaras.`,
    `മൂന്നാം നൂറ്റാണ്ടിൽ ഈജിപ്റ്റ്, സിറിയ, പലസ്തീൻ എന്നിവിടങ്ങളിൽ സന്യാസിമാർ ഉണ്ടായി. വി. അന്തോണിയോസ് പ്രസിദ്ധനായ താപസൻ. വി. പക്കോമിയോസ് സമൂഹസന്യാസം ആരംഭിച്ചു — അങ്ങനെ ദയറാകൾ ഉണ്ടായി.`],
   [`St. Basil of Caesarea (4th c.) wrote rules for monks. St. Benedict of Nursia (6th c.) founded the first monastic orders in the West.`,
    `കൈസര്യയിലെ വി. ബസേലിയോസ് (4-ാം നൂറ്റാണ്ട്) സന്യാസനിയമങ്ങൾ രൂപപ്പെടുത്തി. നൂർസിയായിലെ വി. ബെനഡിക്ട് (6-ാം നൂറ്റാണ്ട്) പാശ്ചാത്യ ദേശത്ത് ആദ്യമായി സന്യാസ സമൂഹങ്ങൾ സ്ഥാപിച്ചു.`],
   [`Oriental monks like Mar Aprem enriched liturgical literature through constant prayer, Bible study, meditation and writing — and lived very simply.`,
    `മാർ അപ്രേമിനെപ്പോലെയുള്ള പൗരസ്ത്യ സന്യാസിമാർ നിരന്തര പ്രാർത്ഥന, വേദപഠനം, ധ്യാനം, എഴുത്ത് എന്നിവയിലൂടെ ആരാധനാ സാഹിത്യത്തെ സമ്പന്നമാക്കി; വളരെ ലളിതമായി ജീവിച്ചു.`],
   [`"Philokalia" means love of goodness / love of beauty — a collection of spiritual teachings of the Fathers since the 4th century, published in Malayalam in five volumes. Mount Athos in Greece is inhabited only by monks.`,
    `"ഫിലോക്കാലിയ" = നന്മയോടുള്ള സ്നേഹം / സൗന്ദര്യത്തോടുള്ള സ്നേഹം — 4-ാം നൂറ്റാണ്ടു മുതലുള്ള പിതാക്കന്മാരുടെ ആദ്ധ്യാത്മിക ഉപദേശങ്ങളുടെ സമാഹാരം; മലയാളത്തിൽ അഞ്ചു വാല്യങ്ങളായി പ്രസിദ്ധീകരിച്ചു. ഗ്രീസിലെ ആഥോസ് മലയിൽ സന്യാസിമാർ മാത്രമാണ് വസിക്കുന്നത്.`],
   [`Unlike the West, Orthodox monks do not go out to convert people. Holiness of life, good spiritual literature and disciplined worship are the main support of Orthodox mission.`,
    `പാശ്ചാത്യ സഭയിലെപ്പോലെ ഓർത്തഡോക്സ് സന്യാസിമാർ മതപരിവർത്തനത്തിനായി ഇറങ്ങുന്നില്ല. ജീവിതവിശുദ്ധി, നല്ല ആദ്ധ്യാത്മിക സാഹിത്യം, ആരാധനാനിഷ്ഠ — ഇവയാണ് ഓർത്തഡോക്സ് മിഷന്റെ പ്രധാന അടിത്തറ.`],
   [`Organised monasticism in the Malankara Church began only about 100 years ago. St. Gregorios of Pampady turned his hermitage into a Dayara and bore witness among people of all communities.`,
    `മലങ്കരസഭയിൽ സംഘടിത സന്യാസപ്രസ്ഥാനം ആരംഭിച്ചിട്ട് ഏകദേശം നൂറു വർഷമേ ആയിട്ടുള്ളൂ. പാമ്പാടി മാർ ഗ്രീഗോറിയോസ് തിരുമേനി തന്റെ ആസ്ഥാനം ദയറാ ആക്കി, എല്ലാ ജാതിമതസ്ഥരുടെയും ഇടയിൽ ക്രിസ്തുസാക്ഷ്യം വഹിച്ചു.`]
  ],
  direct:[
   {n:4, q:[`Choose the activity that is NOT part of Orthodox monastic communities.`,`ഓർത്തഡോക്സ് സന്യാസ സമൂഹങ്ങളുടെ പ്രവർത്തനങ്ങളിൽ ഉൾപ്പെടാത്തത്?`],
    a:[`Conversion of people to Christianity`,`മതപരിവർത്തനം നടത്തുക`],
    why:[`Orthodox monks pray, live simply and enrich liturgical literature; they do not go out to convert people.`,`ഓർത്തഡോക്സ് സന്യാസിമാർ പ്രാർത്ഥിക്കുന്നു, ലളിതമായി ജീവിക്കുന്നു, ആരാധനാ സാഹിത്യത്തെ സമ്പന്നമാക്കുന്നു; മതപരിവർത്തനത്തിനായി ഇറങ്ങുന്നില്ല.`]},
   {q:[`Who founded community (cenobitic) monasticism?`,`സമൂഹസന്യാസം (ഒരുമിച്ചു താമസിക്കുന്ന സന്യാസം) ആരംഭിച്ചത് ആര്?`],
    a:[`St. Pachomius.`,`വി. പക്കോമിയോസ്.`]},
   {q:[`Who formulated the rules of monasticism in the 4th century?`,`നാലാം നൂറ്റാണ്ടിൽ സന്യാസനിയമങ്ങൾ രൂപപ്പെടുത്തിയത് ആര്?`],
    a:[`St. Basil of Caesarea.`,`കൈസര്യയിലെ വി. ബസേലിയോസ്.`]},
   {q:[`What does "Philokalia" mean?`,`"ഫിലോക്കാലിയ" എന്ന വാക്കിന്റെ അർത്ഥം?`],
    a:[`Love of goodness or love of beauty (the eternal goodness and beauty of God).`,`നന്മയോടുള്ള സ്നേഹം അല്ലെങ്കിൽ സൗന്ദര്യത്തോടുള്ള സ്നേഹം (ദൈവത്തിന്റെ നിത്യനന്മയും നിത്യസൗന്ദര്യവും).`]},
   {q:[`Which place in Greece is inhabited only by monks?`,`സന്യാസിമാർ മാത്രം വസിക്കുന്ന ഗ്രീസിലെ സ്ഥലം?`],
    a:[`Mount Athos.`,`ആഥോസ് മല.`]}
  ],
  indirect:[
   {q:[`What is the difference between St. Antony and St. Pachomius in monastic life?`,`സന്യാസജീവിതത്തിൽ വി. അന്തോണിയോസും വി. പക്കോമിയോസും തമ്മിലുള്ള വ്യത്യാസം?`],
    a:[`Antony lived as a lonely hermit; Pachomius gathered monks to live together under common rules as a community.`,`അന്തോണിയോസ് ഏകാന്തവാസിയായ താപസനായിരുന്നു; പക്കോമിയോസ് സന്യാസിമാരെ പൊതുനിയമങ്ങൾ അനുസരിച്ച് ഒരുമിച്ച് സമൂഹമായി താമസിപ്പിച്ചു.`]},
   {q:[`Why are many people in Western countries joining the Orthodox Church?`,`പാശ്ചാത്യ രാജ്യങ്ങളിൽ പലരും ഓർത്തഡോക്സ് സഭയിലേക്ക് വരുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Because of their differences with some practices of Reformist churches and their desire to experience Orthodox spirituality, which keeps the faith and worship of the ancient Church unbroken.`,`നവീകരണ സഭകളിലെ ചില രീതികളോടുള്ള വിയോജിപ്പും, പുരാതന സഭയുടെ വിശ്വാസവും ആരാധനയും മുറിയാതെ സൂക്ഷിക്കുന്ന ഓർത്തഡോക്സ് ആത്മീയത അനുഭവിക്കാനുള്ള ആഗ്രഹവും.`]},
   {q:[`When does monasticism become a negative witness?`,`സന്യാസം എപ്പോഴാണ് നിഷേധാത്മക സാക്ഷ്യമായി മാറുന്നത്?`],
    a:[`When people without a true call to prayer, fasting, study and celibacy become monks, or use monasticism as a stepping stone to positions.`,`പ്രാർത്ഥന, ഉപവാസം, പഠനം, ബ്രഹ്മചര്യം എന്നിവയ്ക്ക് യഥാർത്ഥ ദൈവവിളി ഇല്ലാത്തവരോ, സ്ഥാനമാനങ്ങൾക്കുള്ള ചവിട്ടുപടിയായി സന്യാസത്തെ കാണുന്നവരോ സന്യാസിമാരാകുമ്പോൾ.`]}
  ]
 }
 ]
});

// UNIT 2 — Orthodox Faith
BOOK1.push({
 id:`u2`, title:[`Orthodox Faith`,`ഓർത്തഡോക്സ് വിശ്വാസം`],
 chapters:[
 {
  id:`u2c1`, icon:`☩`,
  title:[`Fundamentals of our Faith`,`അടിസ്ഥാന വിശ്വാസം`],
  points:[
   [`The two fundamental beliefs of Orthodoxy: the Holy Trinity, and that Jesus Christ is God Incarnate.`,
    `ഓർത്തഡോക്സ് വിശ്വാസത്തിന്റെ രണ്ട് അടിസ്ഥാനങ്ങൾ: പരിശുദ്ധ ത്രിത്വം, യേശുക്രിസ്തു മനുഷ്യാവതാരം ചെയ്ത ദൈവമാണ് എന്ന വിശ്വാസം.`],
   [`In the Old Testament the Trinity is only partly revealed (the "veil" — 2 Corinthians 3:14–16; Hebrews 1:1).`,
    `പഴയനിയമത്തിൽ ത്രിത്വം ഭാഗികമായി മാത്രമേ വെളിപ്പെട്ടിട്ടുള്ളൂ ("മൂടുപടം" — 2 കൊരിന്ത്യർ 3:14–16; എബ്രായർ 1:1).`],
   [`OT hints: "Elohim" (plural, Gen 1:1); "Let us make man" (Gen 1:26); Gen 3:22; Babel "let us go down" (Gen 11:6–7); three visitors at Mamre (Gen 18); threefold blessing (Num 6:24–26); "Holy, Holy, Holy" (Isaiah 6); Lord, Word and Breath (Psalm 33:6).`,
    `പഴയനിയമ സൂചനകൾ: "എലോഹിം" (ബഹുവചനം, ഉൽപ. 1:1); "നാം മനുഷ്യനെ ഉണ്ടാക്കുക" (ഉൽപ. 1:26); ഉൽപ. 3:22; ബാബേൽ — "നാം ഇറങ്ങിച്ചെന്ന്" (ഉൽപ. 11:6–7); മമ്രേയിലെ മൂന്നു പുരുഷന്മാർ (ഉൽപ. 18); മൂന്നു വിധ അനുഗ്രഹം (സംഖ്യ 6:24–26); "പരിശുദ്ധൻ, പരിശുദ്ധൻ, പരിശുദ്ധൻ" (യെശയ്യാവ് 6); കർത്താവ്, വചനം, ശ്വാസം (സങ്കീ. 33:6).`],
   [`NT: Jesus' baptism (voice + dove); Matthew 28:19 — "in the NAME (singular) of the Father, Son and Holy Spirit" shows God is One; 2 Corinthians 13:14; John 15:26; Ephesians 1–3.`,
    `പുതിയനിയമം: യേശുവിന്റെ മാമോദീസ (ശബ്ദം + പ്രാവ്); മത്തായി 28:19 — "പിതാവിന്റെയും പുത്രന്റെയും പരിശുദ്ധാത്മാവിന്റെയും നാമത്തിൽ" (നാമം ഏകവചനം — ദൈവം ഏകൻ); 2 കൊരി. 13:14; യോഹ. 15:26; എഫെസ്യർ 1–3.`],
   [`The three Persons are equal in power and glory, eternal, one in origin. Fathers' examples: sun–ray–light; root–trunk–fruit; spring–pool–stream. Gregory Nazianzen: no earthly example can fully explain God.`,
    `മൂന്ന് ആളത്വങ്ങളും ശക്തിയിലും മഹത്വത്തിലും തുല്യർ, നിത്യർ, ഉത്ഭവത്തിൽ ഏകർ. പിതാക്കന്മാരുടെ ഉദാഹരണങ്ങൾ: സൂര്യൻ–രശ്മി–പ്രകാശം; വേര്–തായ്ത്തടി–ഫലം; ഉറവ–കുളം–അരുവി. നാസിയാൻസിലെ ഗ്രീഗോറിയോസ്: ഭൂമിയിലെ ഒരു ഉദാഹരണത്തിനും ദൈവത്തെ പൂർണ്ണമായി വിശദീകരിക്കാനാവില്ല.`],
   [`We begin all rituals and end all prayers with worship of the Trinity ("Shubaho labo…"). The Father creates, the Son sustains, the Holy Spirit fulfils. Incarnation: "God was manifested in the flesh" (1 Timothy 3:16).`,
    `എല്ലാ ശുശ്രൂഷകളും ത്രിത്വ സ്തുതിയോടെ ആരംഭിക്കുകയും എല്ലാ പ്രാർത്ഥനകളും അതോടെ അവസാനിക്കുകയും ചെയ്യുന്നു ("ശുബഹോ ലാബോ…"). പിതാവ് സൃഷ്ടിക്കുന്നു, പുത്രൻ നിലനിർത്തുന്നു, പരിശുദ്ധാത്മാവ് പൂർത്തീകരിക്കുന്നു. മനുഷ്യാവതാരം: "അവൻ ജഡത്തിൽ വെളിപ്പെട്ടു" (1 തിമൊഥെയൊസ് 3:16).`]
  ],
  direct:[
   {n:5, q:[`Choose the passage that does NOT mention the Trinity.`,`വിശുദ്ധ ത്രിത്വത്തെക്കുറിച്ച് പരാമർശം ഇല്ലാത്ത വേദഭാഗം?`],
    a:[`Isaiah 8:10`,`യെശയ്യാവ് 8:10`],
    why:[`Genesis 11:6–7, Genesis 18 and 2 Corinthians 13:14 are all listed in the textbook as Trinity passages.`,`ഉൽപത്തി 11:6–7, ഉൽപത്തി 18, 2 കൊരിന്ത്യർ 13:14 എന്നിവ ത്രിത്വ സൂചനകളായി പാഠപുസ്തകത്തിൽ ഉണ്ട്.`]},
   {q:[`What is the Hebrew word for God in Genesis 1:1, and why is it significant?`,`ഉൽപത്തി 1:1-ൽ ദൈവത്തിന് ഉപയോഗിച്ചിരിക്കുന്ന എബ്രായ പദം? അതിന്റെ പ്രാധാന്യം?`],
    a:[`"Elohim" — grammatically a plural word, a hint of the Trinity.`,`"എലോഹിം" — വ്യാകരണപരമായി ബഹുവചനം; ത്രിത്വത്തിന്റെ സൂചന.`]},
   {q:[`In Matthew 28:19 why is the singular "name" important?`,`മത്തായി 28:19-ൽ "നാമം" എന്ന ഏകവചനത്തിന്റെ പ്രാധാന്യം?`],
    a:[`Three Persons are named, but "name" is singular — God reveals Himself in three ways but is One.`,`മൂന്ന് ആളത്വങ്ങളെ പറയുന്നുവെങ്കിലും "നാമം" ഏകവചനമാണ് — ദൈവം മൂന്നു വിധത്തിൽ വെളിപ്പെടുന്നുവെങ്കിലും ഏകനാണ്.`]},
   {q:[`Which Psalm shows the Lord, His Word and His Breath (Rooha) in creation?`,`കർത്താവ്, അവന്റെ വചനം, ശ്വാസം (റൂഹാ) എന്നിവ സൃഷ്ടിയിൽ കാണിക്കുന്ന സങ്കീർത്തനം?`],
    a:[`Psalm 33:6.`,`സങ്കീർത്തനം 33:6.`]},
   {q:[`Which verse was an early Christian hymn of faith about the Incarnation?`,`മനുഷ്യാവതാരത്തെക്കുറിച്ചുള്ള ആദിമസഭയുടെ വിശ്വാസ കീർത്തനമായ വാക്യം?`],
    a:[`1 Timothy 3:16 — "God was manifested in the flesh…"`,`1 തിമൊഥെയൊസ് 3:16 — "അവൻ ജഡത്തിൽ വെളിപ്പെട്ടു…"`]}
  ],
  indirect:[
   {q:[`Give three examples the early Fathers used to explain the Trinity. Are they enough?`,`ത്രിത്വം വിശദീകരിക്കാൻ ആദിമ പിതാക്കന്മാർ ഉപയോഗിച്ച മൂന്ന് ഉദാഹരണങ്ങൾ എഴുതുക. അവ മതിയാകുമോ?`],
    a:[`Sun–ray–light; root–trunk–fruit; spring–pool–stream. No — as St. Gregory Nazianzen taught, no earthly example can fully explain God.`,`സൂര്യൻ–രശ്മി–പ്രകാശം; വേര്–തായ്ത്തടി–ഫലം; ഉറവ–കുളം–അരുവി. ഇല്ല — നാസിയാൻസിലെ വി. ഗ്രീഗോറിയോസ് പഠിപ്പിച്ചതുപോലെ ഭൂമിയിലെ ഒരു ഉദാഹരണവും ദൈവത്തെ പൂർണ്ണമായി വിശദീകരിക്കില്ല.`]},
   {q:[`How is the Trinity present in the House Blessing service?`,`ഭവനകൂദാശയിൽ ത്രിത്വം എങ്ങനെ കാണപ്പെടുന്നു?`],
    a:[`It recalls the three visitors to Abraham — hospitality founded on the Trinity — and blesses the home: "Let the Holy Trinity reign here."`,`അബ്രഹാമിനെ സന്ദർശിച്ച മൂന്നു പുരുഷന്മാരെ ഓർക്കുന്നു — ത്രിത്വത്തിൽ അധിഷ്ഠിതമായ ആതിഥ്യം — "പരിശുദ്ധ ത്രിത്വം ഇവിടെ വാഴട്ടെ" എന്ന് ഭവനത്തെ അനുഗ്രഹിക്കുന്നു.`]},
   {q:[`Why was the Trinity only partly revealed in the Old Testament?`,`പഴയനിയമത്തിൽ ത്രിത്വം ഭാഗികമായി മാത്രം വെളിപ്പെട്ടത് എന്തുകൊണ്ട്?`],
    a:[`Paul says a veil lay over the reading of the Old Testament, taken away only in Christ (2 Cor 3:14–16); God spoke "in many parts" in olden days (Heb 1:1).`,`പഴയനിയമ വായനയിൽ ഒരു മൂടുപടം ഉണ്ടായിരുന്നു; ക്രിസ്തുവിലാണ് അത് നീങ്ങിയത് (2 കൊരി. 3:14–16). പണ്ട് ദൈവം "അംശമംശമായി" സംസാരിച്ചു (എബ്രാ. 1:1).`]}
  ]
 },
 {
  id:`u2c2`, icon:`📜`,
  title:[`The Sacred Tradition`,`വിശുദ്ധ പാരമ്പര്യം`],
  points:[
   [`"Tradition" comes from Latin "Traditio"; Greek "Paradosis" — "something handed down through generations". It is biblical and apostolic (1 John 1:1–3).`,
    `"പാരമ്പര്യം" — ലത്തീൻ "ട്രഡീഷിയോ"; ഗ്രീക്ക് "പാരഡോസിസ്" — "തലമുറകളായി പകർന്നുനൽകപ്പെട്ടത്". അത് വേദപുസ്തകാധിഷ്ഠിതവും അപ്പോസ്തോലികവുമാണ് (1 യോഹന്നാൻ 1:1–3).`],
   [`Holy Tradition = truths of faith seen by the Apostles, handed down through the Apostolic Fathers and Church Fathers to today's Church. Most important: the Trinity and the Incarnation.`,
    `അപ്പോസ്തോലന്മാർ കണ്ടറിഞ്ഞ് അപ്പോസ്തോലിക പിതാക്കന്മാരിലൂടെയും സഭാപിതാക്കന്മാരിലൂടെയും ഇന്നത്തെ സഭയിലേക്കു കൈമാറിയ വിശ്വാസസത്യങ്ങളാണ് വിശുദ്ധ പാരമ്പര്യം. പ്രധാനം: ത്രിത്വവും മനുഷ്യാവതാരവും.`],
   [`St. Athanasius (Epistle to Serapion, 28): Tradition is the faith given by the Logos in the beginning, preached by the Apostles, preserved by the Fathers, and on which the Church is founded.`,
    `വി. അത്താനാസിയോസ് (സെറാപ്പിയോനുള്ള ലേഖനം 28): ആദിയിൽ വചനം നൽകിയതും അപ്പോസ്തോലന്മാർ പ്രസംഗിച്ചതും പിതാക്കന്മാർ സംരക്ഷിച്ചതും സഭ അടിസ്ഥാനമാക്കിയതുമായ വിശ്വാസമാണ് പാരമ്പര്യം.`],
   [`Tradition is not blindly keeping the old unchanged; it is the continuing life of the Church in the Holy Spirit (St. Basil, On the Holy Spirit).`,
    `പഴയതിനെ മാറ്റമില്ലാതെ അന്ധമായി സൂക്ഷിക്കലല്ല പാരമ്പര്യം; പരിശുദ്ധാത്മാവിൽ സഭയുടെ തുടരുന്ന ജീവനാണ് (വി. ബസേലിയോസ്, പരിശുദ്ധാത്മാവിനെക്കുറിച്ച്).`],
   [`Fellowship with the saints is part of Tradition — not a shortcut for personal gain but unity in prayer. St. Mary has the first place; basis: Elizabeth's praise (Luke 1:41–45).`,
    `പരിശുദ്ധന്മാരോടുള്ള കൂട്ടായ്മ പാരമ്പര്യത്തിന്റെ ഭാഗമാണ് — സ്വകാര്യ നേട്ടത്തിനുള്ള കുറുക്കുവഴിയല്ല, പ്രാർത്ഥനയിലുള്ള ഐക്യമാണ്. ദൈവമാതാവിന് പ്രഥമസ്ഥാനം; അടിസ്ഥാനം: എലിസബത്തിന്റെ സ്തുതി (ലൂക്കൊസ് 1:41–45).`],
   [`Fellowship with the departed: "baptised for the dead" (1 Cor 15:29); Paul prays for Onesiphorus (2 Timothy 1:18). God's love does not stop at death.`,
    `വാങ്ങിപ്പോയവരോടുള്ള കൂട്ടായ്മ: "മരിച്ചവർക്കുവേണ്ടി സ്നാനം ഏൽക്കുന്നവർ" (1 കൊരി. 15:29); ഒനേസിഫൊരൊസിനുവേണ്ടി പൗലോസ് പ്രാർത്ഥിക്കുന്നു (2 തിമൊ. 1:18). ദൈവസ്നേഹം മരണത്തോടെ അവസാനിക്കുന്നില്ല.`]
  ],
  direct:[
   {n:6, q:[`Which Church Father said: "Tradition is the faith that God gave in the beginning, preached by the apostles, preserved by the church fathers, and based on it the holy church has grown"?`,`"വചനമാം ദൈവം ആദിയിൽ നൽകിയ വിശ്വാസം അപ്പോസ്തോലന്മാർ പ്രസംഗിക്കുകയും സഭാപിതാക്കന്മാർ സംരക്ഷിക്കുകയും സഭ അതിൽ അടിസ്ഥാനപ്പെടുത്തി വളർത്തുകയും ചെയ്തതാണ് വിശുദ്ധ പാരമ്പര്യം" എന്നു പറഞ്ഞ പിതാവ്?`],
    a:[`Mar Athanasius of Alexandria`,`അലക്സന്ത്രിയായിലെ മാർ അത്താനാസിയോസ്`],
    why:[`From his Epistle to Serapion, 28.`,`സെറാപ്പിയോനുള്ള ലേഖനം 28-ൽ നിന്ന്.`]},
   {q:[`What are the Latin and Greek words behind "tradition", and what do they mean?`,`"പാരമ്പര്യം" എന്ന പദത്തിന്റെ ലത്തീൻ, ഗ്രീക്ക് മൂലപദങ്ങളും അർത്ഥവും?`],
    a:[`Latin "Traditio", Greek "Paradosis" — something handed down through generations.`,`ലത്തീൻ "ട്രഡീഷിയോ", ഗ്രീക്ക് "പാരഡോസിസ്" — തലമുറകളായി പകർന്നുനൽകപ്പെട്ടത്.`]},
   {q:[`Which Bible passage is the basis for our fellowship with St. Mary?`,`ദൈവമാതാവിനോടുള്ള സഭയുടെ കൂട്ടായ്മയുടെ അടിസ്ഥാനമായ വേദഭാഗം?`],
    a:[`Elizabeth's praise of Mary — Luke 1:41–45.`,`എലിസബത്ത് മറിയത്തെ സ്തുതിക്കുന്നത് — ലൂക്കൊസ് 1:41–45.`]},
   {q:[`For whom does St. Paul pray in 2 Timothy 1:18?`,`2 തിമൊഥെയൊസ് 1:18-ൽ പൗലോസ് ആർക്കുവേണ്ടി പ്രാർത്ഥിക്കുന്നു?`],
    a:[`His departed fellow worker Onesiphorus.`,`വാങ്ങിപ്പോയ സഹപ്രവർത്തകനായ ഒനേസിഫൊരൊസിനുവേണ്ടി.`]}
  ],
  indirect:[
   {q:[`"Tradition means keeping old things without change." Is this correct?`,`"പഴയവ മാറ്റമില്ലാതെ സൂക്ഷിക്കുന്നതാണ് പാരമ്പര്യം." ഇത് ശരിയാണോ?`],
    a:[`No. Tradition is a living continuum of truths sustained by the Holy Spirit — the continuing life of the Church in the Spirit.`,`അല്ല. പരിശുദ്ധാത്മാവ് നിലനിർത്തുന്ന സത്യങ്ങളുടെ ജീവനുള്ള തുടർച്ചയാണ് പാരമ്പര്യം — ആത്മാവിൽ സഭയുടെ തുടരുന്ന ജീവൻ.`]},
   {q:[`Why do we ask the saints to pray for us?`,`നാം പരിശുദ്ധന്മാരോട് മധ്യസ്ഥത അപേക്ഷിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Death does not separate anyone from the Body of Christ. As we ask one another to pray in this life, we keep the same unity in prayer with the saints — it is not a shortcut for personal gain.`,`മരണം ആരെയും ക്രിസ്തുശരീരത്തിൽ നിന്ന് വേർപെടുത്തുന്നില്ല. ഈ ജീവിതത്തിൽ പരസ്പരം പ്രാർത്ഥിക്കുന്നതുപോലെ പരിശുദ്ധന്മാരുമായും പ്രാർത്ഥനയിൽ ഐക്യം പുലർത്തുന്നു — അത് സ്വകാര്യ നേട്ടത്തിനുള്ള കുറുക്കുവഴിയല്ല.`]}
  ]
 },
 {
  id:`u2c3`, icon:`📖`,
  title:[`Church Fathers`,`സഭാപിതാക്കന്മാർ`],
  points:[
   [`Bishops were called "Pope" (father) — "Baba" in Arabic, "Bava" in Syriac. From the 4th century, those who defended the true faith in writing were called Fathers. The age of the Fathers lasts till about the 8th century.`,
    `ബിഷപ്പുമാരെ "പാപ്പാ" (പിതാവ്) എന്നു വിളിച്ചിരുന്നു — അറബിയിൽ "ബാബാ", സുറിയാനിയിൽ "ബാവാ". നാലാം നൂറ്റാണ്ടു മുതൽ രചനകളിലൂടെ സത്യവിശ്വാസം സംരക്ഷിച്ചവരെ പിതാക്കന്മാർ എന്നു വിളിച്ചു. പിതാക്കന്മാരുടെ കാലം ഏകദേശം എട്ടാം നൂറ്റാണ്ടുവരെ.`],
   [`Four groups: (1) Fathers before Nicaea incl. Apostolic Fathers; (2) Fathers of the Great Councils; (3) Fathers after the Councils; (4) Monastic Fathers.`,
    `നാലു വിഭാഗങ്ങൾ: (1) നിഖ്യാ സുന്നഹദോസിനു മുമ്പുള്ള പിതാക്കന്മാർ (അപ്പോസ്തോലിക പിതാക്കന്മാർ ഉൾപ്പെടെ); (2) മഹാ സുന്നഹദോസുകളുടെ പിതാക്കന്മാർ; (3) സുന്നഹദോസുകൾക്കു ശേഷമുള്ള പിതാക്കന്മാർ; (4) സന്യാസ പിതാക്കന്മാർ.`],
   [`Apostolic Fathers: St. Clement of Rome (Epistle to the Corinthians, AD 96 — Qurbana at the appointed time and manner), St. Ignatius of Antioch (7 letters; Christology; bishop–priest–deacon), St. Polycarp of Smyrna (opposed Docetism). The "Didache" (chs. 14–15) describes the Eucharist.`,
    `അപ്പോസ്തോലിക പിതാക്കന്മാർ: റോമിലെ വി. ക്ലീമീസ് (കൊരിന്ത്യർക്കുള്ള ലേഖനം, എ.ഡി. 96 — നിശ്ചിത സമയത്തും ക്രമത്തിലും കുർബ്ബാന), അന്ത്യോഖ്യായിലെ വി. ഇഗ്നാത്തിയോസ് (7 ലേഖനങ്ങൾ; ക്രിസ്തുശാസ്ത്രം; എപ്പിസ്കോപ്പാ–കശീശാ–ശെമ്മാശൻ), സ്മിർണയിലെ വി. പോളിക്കാർപ്പോസ് (തോന്നൽ വാദം എതിർത്തു). "ഡിഡാക്കേ" (14, 15 അദ്ധ്യായങ്ങൾ) കുർബ്ബാന ക്രമം വിവരിക്കുന്നു.`],
   [`St. Irenaeus of Lyons wrote "Against the Heresies" (5 volumes) — the tradition of the early Church and apostolic succession.`,
    `ലിയോൺസിലെ വി. ഐറേനിയോസ് "ദുരുപദേശങ്ങൾക്കെതിരെ" (5 വാല്യം) എഴുതി — ആദിമസഭയുടെ പാരമ്പര്യവും അപ്പോസ്തോലിക പിന്തുടർച്ചയും.`],
   [`Golden age (Fathers of the Councils): Greek — Athanasius, Cappadocian Fathers, John Chrysostom, Cyril of Jerusalem; Latin — Augustine, Ambrose; Syriac — Aprem, Aphrahath. Gregory Nazianzen's writings are sources of our Promeon and Sedro.`,
    `സുവർണ്ണകാലം (സുന്നഹദോസുകളുടെ പിതാക്കന്മാർ): ഗ്രീക്ക് — അത്താനാസിയോസ്, കപ്പദോക്യൻ പിതാക്കന്മാർ, ക്രിസോസ്തമോസ്, യെരുശലേമിലെ കൂറിലോസ്; ലത്തീൻ — അഗസ്റ്റിൻ, അംബ്രോസ്; സുറിയാനി — അപ്രേം, അഫ്രഹാത്ത്. നാസിയാൻസിലെ ഗ്രീഗോറിയോസിന്റെ രചനകളാണ് പ്രൊമിയോൻ, സെദറാ എന്നിവയുടെ ഉറവിടം.`],
   [`After Chalcedon (451): Cyril of Alexandria, Severus of Antioch, Philoxenos of Mabbug. Monastic Fathers: Paul and Antony of Thebes (c. AD 250), Pachomius, Basil. Writings: "Life of Antony" (Athanasius), "Lausiac History" (Palladius).`,
    `കൽക്കദോന്യ (451) ശേഷം: അലക്സന്ത്രിയായിലെ കൂറിലോസ്, അന്ത്യോഖ്യായിലെ സേവേറിയോസ്, മാബൂഗിലെ പീലക്സീനോസ്. സന്യാസ പിതാക്കന്മാർ: തീബ്സിലെ പൗലോസും അന്തോണിയോസും (എ.ഡി. 250), പക്കോമിയോസ്, ബസേലിയോസ്. രചനകൾ: "അന്തോണിയോസിന്റെ ജീവിതം" (അത്താനാസിയോസ്), "ലൗസിയാക് ചരിത്രം" (പല്ലാഡിയോസ്).`]
  ],
  direct:[
   {n:7, q:[`Which Father opposed the heresy that denied Christ suffered in the flesh, right when it began?`,`ക്രിസ്തു ജഡത്തിൽ കഷ്ടം അനുഭവിച്ചു എന്നതിനെ നിഷേധിക്കുന്ന "തോന്നൽ വാദത്തെ" തുടക്കത്തിൽ തന്നെ എതിർത്ത പിതാവ്?`],
    a:[`Mar Polycarp of Smyrna`,`സ്മിർണയിലെ മാർ പോളിക്കാർപ്പോസ്`],
    why:[`Polycarp is an Apostolic Father who opposed Docetism; the other options are 4th-century Fathers.`,`തോന്നൽ വാദം എതിർത്ത അപ്പോസ്തോലിക പിതാവാണ് പോളിക്കാർപ്പോസ്; മറ്റുള്ളവർ നാലാം നൂറ്റാണ്ടിലെ പിതാക്കന്മാർ.`]},
   {q:[`Name the three important Apostolic Fathers.`,`മൂന്നു പ്രധാന അപ്പോസ്തോലിക പിതാക്കന്മാർ?`],
    a:[`St. Clement of Rome, St. Ignatius of Antioch, St. Polycarp of Smyrna.`,`റോമിലെ വി. ക്ലീമീസ്, അന്ത്യോഖ്യായിലെ വി. ഇഗ്നാത്തിയോസ്, സ്മിർണയിലെ വി. പോളിക്കാർപ്പോസ്.`]},
   {q:[`Which early writing describes the Holy Qurbana in chapters 14 and 15?`,`14, 15 അദ്ധ്യായങ്ങളിൽ വി. കുർബ്ബാനയുടെ ക്രമം വിവരിക്കുന്ന ആദിമ രചന?`],
    a:[`The "Didache" (The Teaching of the Twelve Apostles).`,`"ഡിഡാക്കേ" (പന്ത്രണ്ട് അപ്പോസ്തോലന്മാരുടെ ഉപദേശം).`]},
   {q:[`Who wrote "Against the Heresies"?`,`"ദുരുപദേശങ്ങൾക്കെതിരെ" എഴുതിയത് ആര്?`],
    a:[`St. Irenaeus of Lyons.`,`ലിയോൺസിലെ വി. ഐറേനിയോസ്.`]},
   {q:[`Whose writings are the sources of the Promeon and Sedro prayers?`,`പ്രൊമിയോൻ, സെദറാ പ്രാർത്ഥനകളുടെ ഉറവിടമായ രചനകൾ ആരുടേത്?`],
    a:[`St. Gregory Nazianzen.`,`നാസിയാൻസിലെ വി. ഗ്രീഗോറിയോസ്.`]},
   {q:[`Who wrote "The Life of St. Antony"?`,`"അന്തോണിയോസിന്റെ ജീവിതം" എഴുതിയത് ആര്?`],
    a:[`St. Athanasius.`,`വി. അത്താനാസിയോസ്.`]}
  ],
  indirect:[
   {q:[`Why did monasticism begin as a protest?`,`സന്യാസം ഒരു പ്രതിഷേധമായി ആരംഭിച്ചത് എന്തുകൊണ്ട്?`],
    a:[`When the Church received state recognition in the 4th century, worldliness crept in. Monks withdrew to keep the divine life; rejecting the world became like a martyrdom.`,`നാലാം നൂറ്റാണ്ടിൽ സഭയ്ക്ക് രാഷ്ട്രാംഗീകാരം ലഭിച്ചപ്പോൾ ലൗകികത കടന്നുവന്നു. ദൈവിക ജീവൻ കാത്തുസൂക്ഷിക്കാൻ സന്യാസിമാർ ലോകത്തിൽനിന്ന് മാറി; ലോകത്തെ ത്യജിക്കുന്നത് രക്തസാക്ഷിത്വത്തിനു തുല്യമായി കണ്ടു.`]},
   {q:[`Which Syriac Fathers belong to the golden age of Christian writing?`,`ക്രൈസ്തവ രചനകളുടെ സുവർണ്ണകാലത്തെ സുറിയാനി പിതാക്കന്മാർ?`],
    a:[`St. Aprem and St. Aphrahath.`,`വി. അപ്രേമും വി. അഫ്രഹാത്തും.`]}
  ]
 },
 {
  id:`u2c4`, icon:`🌐`,
  title:[`Orthodox Churches Today`,`ഓർത്തഡോക്സ് സഭകൾ ഇന്ന്`],
  points:[
   [`Two families: Oriental Orthodox (6 churches in Eucharistic communion, each independent) and Byzantine Orthodox (14 churches — together the second largest Christian community).`,
    `രണ്ടു കുടുംബങ്ങൾ: ഓറിയന്റൽ ഓർത്തഡോക്സ് (കുർബ്ബാന സംസർഗ്ഗമുള്ള, സ്വതന്ത്രമായ 6 സഭകൾ), ബൈസന്റൈൻ ഓർത്തഡോക്സ് (14 സഭകൾ — ഒന്നിച്ച് ലോകത്തിലെ രണ്ടാമത്തെ വലിയ ക്രൈസ്തവ സമൂഹം).`],
   [`Armenian Apostolic Church: succession of Bartholomew and Jude; two Catholicates (Etchmiadzin — "first among equals"; Antelias, Lebanon) and two Patriarchates (Jerusalem, Constantinople).`,
    `അർമേനിയൻ അപ്പോസ്തോലിക സഭ: ബർത്തലോമായി, യൂദാ ശ്ലീഹന്മാരുടെ പിന്തുടർച്ച; രണ്ടു കാതോലിക്കേറ്റുകൾ (എച്ച്മിയാഡ്സിൻ — "സമന്മാരിൽ മുമ്പൻ"; ലെബനോനിലെ അന്തേലിയാസ്), രണ്ടു പാത്രിയർക്കേറ്റുകൾ (യെരുശലേം, കോൺസ്റ്റാന്റിനോപ്പിൾ).`],
   [`Coptic Church: founded by St. Mark in AD 42; headquarters moved from Alexandria to Cairo; head = "Pope of Alexandria and all Africa" (Pope Shenouda died 17 March 2012); laity, priests and monks also vote; daughter churches: Ethiopia, Eritrea, British and French Orthodox.`,
    `കോപ്റ്റിക് സഭ: എ.ഡി. 42-ൽ വി. മർക്കോസ് സ്ഥാപിച്ചു; ആസ്ഥാനം അലക്സന്ത്രിയായിൽ നിന്ന് കെയ്റോയിലേക്ക്; തലവൻ = "അലക്സന്ത്രിയായുടെയും ആഫ്രിക്ക മുഴുവന്റെയും പോപ്പ്" (പോപ്പ് ഷെനൂദാ 2012 മാർച്ച് 17-ന് കാലം ചെയ്തു); തെരഞ്ഞെടുപ്പിൽ വൈദികർക്കും സന്യാസിമാർക്കും അൽമായർക്കും പങ്ക്; പുത്രീസഭകൾ: എത്യോപ്യ, എറിത്രിയ, ബ്രിട്ടീഷ്, ഫ്രഞ്ച് ഓർത്തഡോക്സ്.`],
   [`Syriac Orthodox Church: founded at Antioch by St. Peter; head = Patriarch. Relationship with Malankara began when St. Gregorios Abdul Jaleel came to India in 1665.`,
    `സുറിയാനി ഓർത്തഡോക്സ് സഭ: വി. പത്രോസ് അന്ത്യോഖ്യായിൽ സ്ഥാപിച്ചു; തലവൻ പാത്രിയർക്കീസ്. 1665-ൽ മാർ ഗ്രീഗോറിയോസ് അബ്ദൾ ജലീൽ ഇന്ത്യയിൽ വന്നതോടെ മലങ്കരയുമായുള്ള ബന്ധം ആരംഭിച്ചു.`],
   [`Ethiopian Tewahedo ("made one"): spread through St. Frumentius (Aba Salama), made bishop by Athanasius; autonomous 1949; first Patriarch Abuna Basilios (1959). Claims the Ark of the Covenant at St. Mary of Zion, Axum. Eritrean Church free from 1993.`,
    `എത്യോപ്യൻ തെവാഹെദോ സഭ ("ഒന്നാക്കപ്പെട്ടത്"): വി. ഫ്രുമെൻഷിയസ് (അബ്ബാ സലാമാ) വഴി വ്യാപിച്ചു; അത്താനാസിയോസ് അദ്ദേഹത്തെ ബിഷപ്പാക്കി; 1949-ൽ സ്വയംഭരണം; ആദ്യ പാത്രിയർക്കീസ് അബൂനാ ബസേലിയോസ് (1959). സാക്ഷ്യപെട്ടകം അക്സുമിലെ സീയോൻ മറിയം ദേവാലയത്തിൽ ഉണ്ടെന്ന് വിശ്വസിക്കുന്നു. എറിത്രിയൻ സഭ 1993 മുതൽ സ്വതന്ത്രം.`],
   [`Byzantine: Ecumenical Patriarchate of Constantinople (Istanbul) — "first among equals". Russian Church — the largest (HQ Danilov monastery, Moscow; Slavonic). Others: Alexandria, Antioch (Damascus), Jerusalem (St. Catherine's, Sinai), Serbian, Romanian, Bulgarian, Georgian, American.`,
    `ബൈസന്റൈൻ: കോൺസ്റ്റാന്റിനോപ്പിളിലെ (ഇസ്താംബൂൾ) എക്യുമെനിക്കൽ പാത്രിയർക്കേറ്റ് — "സമന്മാരിൽ മുമ്പൻ". റഷ്യൻ സഭ — ഏറ്റവും വലുത് (ആസ്ഥാനം മോസ്കോയിലെ ദാനിലോവ് ആശ്രമം; സ്ലാവോണിക് ഭാഷ). മറ്റുള്ളവ: അലക്സന്ത്രിയ, അന്ത്യോഖ്യ (ദമസ്കോസ്), യെരുശലേം (സീനായിലെ സെന്റ് കാതറിൻ ആശ്രമം), സെർബിയൻ, റൊമേനിയൻ, ബൾഗേറിയൻ, ജോർജിയൻ, അമേരിക്കൻ.`]
  ],
  direct:[
   {n:8, q:[`Orthodox Church having Patriarchates under the rule of the Catholicos.`,`കാതോലിക്കയുടെ ഭരണത്തിൻ കീഴിൽ പാത്രിയർക്കേറ്റുകൾ നിലവിലുള്ള ഓർത്തഡോക്സ് സഭ?`],
    a:[`Armenian Orthodox Church`,`അർമേനിയൻ ഓർത്തഡോക്സ് സഭ`],
    why:[`It has two Catholicates and two Patriarchates (Jerusalem and Constantinople).`,`രണ്ടു കാതോലിക്കേറ്റുകളും രണ്ടു പാത്രിയർക്കേറ്റുകളും (യെരുശലേം, കോൺസ്റ്റാന്റിനോപ്പിൾ) ഉണ്ട്.`]},
   {n:9, q:[`The Orthodox Church whose head has the title "Pope".`,`സഭാതലവന് "പോപ്പ്" എന്ന സ്ഥാനനാമമുള്ള ഓർത്തഡോക്സ് സഭ?`],
    a:[`Coptic Orthodox Church`,`കോപ്റ്റിക് ഓർത്തഡോക്സ് സഭ`],
    why:[`Official title: Pope of Alexandria and all Africa.`,`ഔദ്യോഗിക നാമം: അലക്സന്ത്രിയായുടെയും ആഫ്രിക്ക മുഴുവന്റെയും പോപ്പ്.`]},
   {n:10, q:[`The church which claims it still houses the Ark of the Covenant.`,`ഇസ്രായേല്യരുടെ സാക്ഷ്യപെട്ടകം സൂക്ഷിച്ചിരിക്കുന്നു എന്നു അവകാശപ്പെടുന്ന സഭ?`],
    a:[`Ethiopian Orthodox Church`,`എത്യോപ്യൻ ഓർത്തഡോക്സ് സഭ`],
    why:[`Kept in Our Lady Mary of Zion Church, Axum; only one monk may enter.`,`അക്സുമിലെ സീയോൻ മറിയം ദേവാലയത്തിൽ; ഒരു സന്യാസിക്കു മാത്രമേ പ്രവേശനമുള്ളൂ.`]},
   {n:11, q:[`The church considered "first among equals" in the Orthodox churches.`,`ഓർത്തഡോക്സ് സഭകളിൽ "സമന്മാരിൽ മുമ്പൻ" എന്നു കണക്കാക്കപ്പെടുന്ന സഭ?`],
    a:[`The Church of Constantinople`,`കോൺസ്റ്റാന്റിനോപ്പിളിലെ സഭ`],
    why:[`Its Patriarch is the Ecumenical Patriarch, given that place by the other Byzantine Churches.`,`അതിന്റെ പാത്രിയർക്കീസ് എക്യുമെനിക്കൽ പാത്രിയർക്കീസാണ്; മറ്റു ബൈസന്റൈൻ സഭകൾ ആ സ്ഥാനം നൽകുന്നു.`]},
   {q:[`Who founded the Coptic Church and when?`,`കോപ്റ്റിക് സഭ സ്ഥാപിച്ചത് ആര്, എപ്പോൾ?`],
    a:[`St. Mark the Evangelist, AD 42.`,`സുവിശേഷകനായ വി. മർക്കോസ്, എ.ഡി. 42.`]},
   {q:[`What does "Tewahedo" mean?`,`"തെവാഹെദോ" എന്നതിന്റെ അർത്ഥം?`],
    a:[`"Being made one".`,`"ഒന്നാക്കപ്പെട്ടത്".`]},
   {q:[`Which is the largest Orthodox Church?`,`ഏറ്റവും വലിയ ഓർത്തഡോക്സ് സഭ?`],
    a:[`The Russian Orthodox Church.`,`റഷ്യൻ ഓർത്തഡോക്സ് സഭ.`]},
   {q:[`When did the relationship between the Malankara Church and the Syriac Church begin?`,`മലങ്കരസഭയും സുറിയാനി സഭയും തമ്മിലുള്ള ബന്ധം ആരംഭിച്ചത് എപ്പോൾ?`],
    a:[`In 1665, with the coming of St. Gregorios Abdul Jaleel to India.`,`1665-ൽ മാർ ഗ്രീഗോറിയോസ് അബ്ദൾ ജലീൽ ഇന്ത്യയിൽ വന്നതോടെ.`]}
  ],
  indirect:[
   {q:[`Name the six Oriental Orthodox Churches.`,`ആറ് ഓറിയന്റൽ ഓർത്തഡോക്സ് സഭകളുടെ പേരെഴുതുക.`],
    a:[`Armenian, Coptic, Syriac, Malankara (Indian), Ethiopian and Eritrean.`,`അർമേനിയൻ, കോപ്റ്റിക്, സുറിയാനി, മലങ്കര (ഇന്ത്യൻ), എത്യോപ്യൻ, എറിത്രിയൻ.`]},
   {q:[`Who brought Christianity to Ethiopia, and who made him bishop?`,`എത്യോപ്യയിൽ ക്രിസ്തുമതം വ്യാപിപ്പിച്ചത് ആര്? അദ്ദേഹത്തെ ബിഷപ്പാക്കിയത് ആര്?`],
    a:[`St. Frumentius (Aba Salama), shipwrecked in the 4th century; St. Athanasius of Alexandria made him bishop.`,`നാലാം നൂറ്റാണ്ടിൽ കപ്പൽച്ചേതത്തിൽ എത്തിയ വി. ഫ്രുമെൻഷിയസ് (അബ്ബാ സലാമാ); അലക്സന്ത്രിയായിലെ വി. അത്താനാസിയോസ് ബിഷപ്പാക്കി.`]},
   {q:[`Why is the Patriarch of Constantinople honoured though it has few members?`,`അംഗങ്ങൾ കുറവാണെങ്കിലും കോൺസ്റ്റാന്റിനോപ്പിൾ പാത്രിയർക്കീസിന് പ്രാധാന്യം ലഭിക്കുന്നത് എന്തുകൊണ്ട്?`],
    a:[`Because of the historical importance of Constantinople; the Byzantine Churches give him the place "first among equals".`,`കോൺസ്റ്റാന്റിനോപ്പിളിന്റെ ചരിത്രപ്രാധാന്യം കൊണ്ട്; ബൈസന്റൈൻ സഭകൾ "സമന്മാരിൽ മുമ്പൻ" എന്ന സ്ഥാനം നൽകുന്നു.`]}
  ]
